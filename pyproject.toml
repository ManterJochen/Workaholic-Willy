[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workaholic-willy"
version = "0.1.0"
description = "Vision-language robot grasping: perception, grasp synthesis, fail-closed motion and a pick loop"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["src*", "api*", "datagen*", "willy*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["logs", "assets", "docs", ".venv"]

[tool.ruff.lint]
# The default safe set: pyflakes F plus the curated pycodestyle subset. The
# broader families (I, UP, B, SIM) are a later ratchet.
select = ["F", "E4", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports each package's public surface, including the lazy
# __getattr__ seams. An unused import there is the re-export, so autofix must
# not strip it.
"__init__.py" = ["F401", "F403"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
# torch, cv2, open3d, sounddevice, transformers and ur_rtde ship no type stubs.
ignore_missing_imports = true
follow_imports = "normal"
# A pragmatic baseline rather than --strict. Tightening it, starting with
# disallow_untyped_defs, is a later ratchet.

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider -rs"
markers = [
    "isaac: needs a real Isaac Sim install (Windows workstation only, skipped where isaacsim is not importable). See docs/isaac-ready.md.",
    "inference: runs a real model against real weights on a real GPU. Skipped without CUDA or without the weights in the HuggingFace cache; fetch them with scripts/model_weights/fetch.py. Not part of the CI gate: multi gigabyte downloads and minutes of GPU time.",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src", "api", "datagen"]
branch = false
omit = [
  # Vendor robot SDK boundaries (ur_rtde, EKI, robotiq_gripper):
  "*/robot/drivers/kuka/*",
  "*/robot/drivers/ur/connection.py",
  "*/robot/drivers/ur/motion.py",
  "*/robot/grippers/robotiq.py",
  # Physical camera capture, which opens a device or a vendor RGB-D SDK:
  "*/camera/setup/devices/*",
  "*/camera/setup/image_taking/single.py",
  "*/camera/setup/image_taking/webcam.py",
  "*/camera/setup/image_taking/rgbd.py",
  "*/camera/setup/quality.py",
  # GUI visualization, which opens an Open3D or cv2 window:
  "*/robot/grasping/visualization/*",
  # torch model wrappers, which need torch and model weights:
  "*/models/detection/*",
  "*/models/segmentation/*",
  "*/models/speech/speech_to_text.py",
  "*/models/handdetection/*",
  "*/models/_inference.py",
  "*/config/__main__.py",
  # Manual, Isaac free build script for the committed cuRobo gripper spheres.
  "*/safety/planning/robot/build_gripper_spheres.py",
  "*/willy_sim/run_*.py",
  "*/willy_sim/inspect_wrist_cam.py",
  "*/willy_sim/scene.py",
  # Datagen specific tests
  "*/datagen/render/isaac.py",
  "*/datagen/render/mujoco_engine.py",
  "*/datagen/render/convex_decomposition.py",
  "*/datagen/grasps/physics_isaac.py",
  "*/datagen/grasps/physics_mujoco.py",
  "*/datagen/verify_robot.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '@(abc\.)?abstractmethod',
]
