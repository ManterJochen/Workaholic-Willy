name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, because there is one dependency set. The two requirements files
  # differ only in the index URL and the two torch pins; every other package and
  # version is the same line for line.
  #
  # The runner installs the CPU file, because it has no GPU and the CUDA wheels
  # are several gigabytes it would never execute. What could rot is the two
  # files drifting apart, and test_requirements_parity.py fails on that offline,
  # so the job runs the smaller install without checking a smaller set.
  #
  # The claim that the library imports no web framework, and that nothing under
  # src/ imports api/, is proven by AST scan in the test suite rather than by
  # leaving fastapi uninstalled. It therefore holds under this job as well.
  checks:
    name: Lint, type, test, soak
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt

      - name: Torch imports
        run: python -c "import torch, torchvision; print('torch', torch.__version__, '| cuda available:', torch.cuda.is_available())"

      # `config` is in none of the three lists below: it is the YAML tree, and the
      # Python that reads it lives in src/config, which `src` already covers. mypy
      # fails outright on a directory that holds no Python, and coverage measures
      # nothing there.
      #
      # `scripts` is linted and typed whole, not just the examples. Neither tool
      # imports a module, so the workstation tools that need Isaac or a robot are
      # checked here as readily as the rest, and a script nothing checks is the
      # thing that rots first.
      - name: Ruff
        run: ruff check src api datagen tests scripts

      - name: Mypy
        run: mypy src api datagen scripts

      - name: Pytest and coverage
        run: |
          pytest tests \
            --cov=src \
            --cov=api \
            --cov=datagen \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Production soak gate
        # Deterministic synthetic soak and 12 key KPI gate; exit 0 only if all
        # pass. It checks telemetry and KPI consistency, not grasp quality.
        run: python -m src.robot.grasping.replay --soak-report

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Security audit
        # Informational. It surfaces advisories in pinned third party packages
        # that cannot be patched here, without gating the build red.
        continue-on-error: true
        run: pip-audit --desc
