<!-- A parallel jaw closing on a part: the one thing this whole stack is for. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#0e1116"/>
  <!-- wrist -->
  <rect x="14" y="4" width="4" height="6" rx="1" fill="#58a6ff"/>
  <!-- the two fingers -->
  <path d="M8 10h4v12H8z" fill="#58a6ff"/>
  <path d="M20 10h4v12h-4z" fill="#58a6ff"/>
  <!-- the part between them -->
  <rect x="13" y="14" width="6" height="8" rx="1" fill="#3fb950"/>
</svg>
