<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Workaholic-Willy</title>
    <script>
      // Applied BEFORE the first paint, on purpose. The audience window is always the black stage, the brand's look
      // on a projector (owner, 2026-10-01), whatever theme the console it was opened from uses; `demo/main.tsx` stamps
      // dark again once it runs. The language follows the console (`i18n/index.ts` reads the same key): German unless
      // English was chosen.
      // Deliberately not a module and not deferred: both would be too late to be worth writing.
      var d = document.documentElement
      d.setAttribute('data-theme', 'dark')
      d.lang = 'de'
      try {
        if (localStorage.getItem('willy.lang') === 'en') d.lang = 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
