<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Workaholic-Willy — Bedienkonsole</title>
    <script>
      // Applied BEFORE the first paint, on purpose: dark unless light was chosen (OD 3), German unless English was.
      // `lib/theme.ts` and `i18n/index.ts` read the same keys, but React effects run after the browser has painted,
      // so without this a light choice would show one dark frame first, on a console mounted next to a cell.
      // Deliberately not a module and not deferred: both would be too late to be worth writing.
      var d = document.documentElement
      d.setAttribute('data-theme', 'dark')
      d.lang = 'de'
      try {
        if (localStorage.getItem('willy.theme') === 'light') d.setAttribute('data-theme', 'light')
        if (localStorage.getItem('willy.lang') === 'en') d.lang = 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
