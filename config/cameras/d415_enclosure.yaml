# The owner's RealSense D415 in its printed enclosure (the blue box on the wrist of the UR10 cell), as one box in the
# colour camera's optical frame (x to the right in the image, y down, z out of the lens), in millimetres.
#
# MEASURED by the owner on 2026-10-12: the printed holder is 135 x 45 x 30 mm. Its 20 mm cable flange, in the middle of
# the end on the left of the image (-x), is not in this box: a cell writes it as the rig's bracket (cam.yaml,
# camera.cameras.rigs[<id>].body.bracket), as the owner's cell does.
#
# Where the box sits is as before: the holder centred on the bare D415 housing (realsense_d415.yaml: 99.15 x 23.15 x
# 20.15, centre (35.0, 0.0, -8.975)), its front lip 2 mm in front of the glass at 1.1, so its front at 3.1 and its back
# at 3.1 - 30 = -26.9: centre (35.0, 0.0, -11.9).
#
# Before: an estimate of 131.15 x 35.15 x 32.0 (2026-10-07, widened by 10 mm each side on 2026-10-08 after the camera
# touched the arm in an odd pose).
camera:
  model: d415_enclosure
  source: >-
    The owner's printed enclosure around an Intel RealSense D415, measured on 2026-10-12: 135 x 45 x 30 mm, centred on
    the D415 housing of realsense_d415.yaml (Intel RealSense D400 Series Datasheet, document 337029-017, revision 019),
    its front 2 mm in front of the glass; the cable flange is the rig's bracket
  optical_frame: color
  housing:
    size_mm: [135.0, 45.0, 30.0]
    centre_mm: [35.0, 0.0, -11.9]
