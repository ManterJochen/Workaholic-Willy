# ============================================================================
# app/runtime.yaml — every key, with what it does
# ============================================================================

runtime:

  # JPEG quality for the frames the console streams (1-100).
  image_encoding:

    # JPEG quality (1-100) for the still the console serves from GET /camera — the idle live view of what
    # the cell is looking at.
    # [default: 60]
    frame_quality: 60

  # What the console does when someone greets Willy in the chat ("Hallo Willy", "Hi Willy", "Tschüss Willy").
  greeting:

    # direct: Willy waves at once, with no click: two swings of the wrist, each judged by the exact guard like
    # every motion, and refused where it is not clear. confirm: the console asks first, in a dialog like Home's,
    # and the wave starts on its confirm. off: Willy only greets back, and nothing moves. A bare `off` and `on`
    # (which YAML reads as false and true) mean off and direct.
    # [default: direct]
    wave: direct

  # How the console reads an operator's sentence (POST /v1/commands/parse).
  commands:

    # true: a known sentence ("Alle grauen Würfel in die Gelbe Kiste.", "Hallo Willy") is read without the language
    # model, as the model was measured to read it (src/models/vlm/known.py): well under a millisecond instead of
    # about ten seconds on the cell. Every other sentence goes to the model. false: every sentence goes to the model.
    # A reading moves nothing either way; a task starts only at POST /v1/task, behind every gate of that route.
    # [default: true]
    known_sentences: true

  # What a task takes where it says nothing itself: the cell's, rather than each browser's. The console's Settings
  # page ("Auftrag") writes these into the cell's own layer, the chain's last; none of them starts a task.
  task:

    # How the console starts a typed or spoken task. enter: Enter reads the sentence and starts a clean reading at
    # once where the cell is ready, and the card opens for every other. card: Enter only reads, and Start on the
    # card starts.
    # [default: enter] [one of: enter | card]
    start: enter

    # The mode of a task Enter starts: once, one part; until_empty, until nothing matching is left. "Alle" in the
    # sentence does not change it, and a sentence that singles out one part runs once either way.
    # [default: once] [one of: once | until_empty]
    scope: once

    # Where the part goes when the sentence names no place: default, the cell's default place pose
    # (robot.motion.default_place_pose); pose:<name>, a taught pose; camera:<phrase>, a target the camera finds, in English
    # (camera:yellow bin), at most 200 characters on one line, with no " #".
    # [default: default] [one of: default | pose:<name> | camera:<phrase>]
    place: default

    # true: a card whose sentence names no part comes ticked for "alles, was die Kamera sieht", bin walls included.
    # false: the person ticks it on the card. Such a card never starts on Enter.
    # [default: false]
    anything: false

    # How each pick of a task looks: first, the first look only (multi-view off); when_needed, the looks until a
    # grasp is safe; every, every configured look, the early stop off. A card may change it for its task.
    # [default: when_needed] [one of: first | when_needed | every]
    looks: when_needed

    # Whether the parts are critical. false: a boxed-in part is pushed first (the push may shove the neighbours in
    # its way), and a blocker is cleared where no push plans. true: nothing is pushed, and a blocker is cleared
    # instead. A task may say otherwise for itself in the console's advanced drawer. Read when the cell is built, so
    # a change applies from its next build. Until 2026-10-16 this was robot.grasping.recovery.critical_parts.
    # [default: false]
    critical_parts: false
