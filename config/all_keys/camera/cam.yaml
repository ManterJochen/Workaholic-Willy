# ============================================================================
# camera/cam.yaml — every key, with what it does
# ============================================================================

# Top-level camera section: which rig is active and the rig catalogue.
cameras:

  # Which rig this cell opens. Required, and it must name one of the rigs below.
  #
  # It replaced a pair of keys, `active_mode` and `active_rig_id`, that only the stereo calibration
  # tool ever read. The grasp path chose its camera by taking the FIRST rig with `source: rgbd` in
  # list order, and that rule did not consult `enabled`, so the shipped base profile would open a
  # camera its own config declares off. Three pieces of code selected from one list by three
  # different rules.
  #
  # The rig must exist. It does not have to be enabled at load, because a profile whose cameras are
  # still waiting for their serial numbers is not a malformed file; a cell built on a disabled or
  # non RGB-D primary is refused when it is BUILT, with a message that names the RGB-D rigs there
  # are. Changing it changes which camera the cell opens, and therefore every number it measures.
  # [REQUIRED - no default]
  primary_rig_id: webcam_main

  # Stereo-calibration ChArUco board parameters + this block's ArUco marker settings.
  stereo_calibration:

    # Number of chessboard squares along the board's X axis on your PRINTED ChArUco calibration target.
    # [REQUIRED - no default]
    charuco_squares_x: 10

    # The same physical-board description along Y: how many squares tall the printed ChArUco target is.
    # [REQUIRED - no default]
    charuco_squares_y: 7

    # Edge length of ONE chessboard square on the printed board, in millimetres (shipped 26.0).
    # [REQUIRED - no default]
    charuco_square_length_mm: 26.0

    # Edge length of the small ArUco marker printed INSIDE each white square of the ChArUco board (shipped
    # 20.0 mm inside a 26.0 mm square).
    # [REQUIRED - no default]
    charuco_marker_length_mm: 20.0

    # The (width, height) in pixels that the calibration images are assumed to have; passed to
    # cv.calibrateCamera/stereoRectify as the image size, so it fixes the principal point and the
    # rectification maps.
    # [REQUIRED - no default]
    frame_size: [1280, 720]

    # How much of the original image survives rectification, 0.0..1.0, passed as cv.stereoRectify's alpha.
    # [REQUIRED - no default]
    rectify_alpha: 0.0

    # Edge length in mm of the STANDALONE ArUco square used for marker pose estimation (not the ChArUco
    # board, a different physical artefact).
    # [REQUIRED - no default]
    marker_length_mm: 50.0

    # Which OpenCV ArUco dictionary the board AND the standalone marker in this block were generated from
    # (shipped DICT_5X5_100).
    # [REQUIRED - no default]
    aruco_dict_name: DICT_5X5_100

  # RGB-D camera with native depth (e.g. Intel RealSense, Azure Kinect).
  rigs:

    # --- entry 0: webcam_main ---

      # The name you use to address this camera everywhere else: `camera.cameras.primary_rig_id`
      # selects it, `python -m src.robot.perception --rig <id>` opens it,
      # `FrameProvider.grab(rig_id)` keys on it, and if you omit `calibration_paths.base_dir` the schema
      # invents `calibration/<rig_id>` from it.
      # [REQUIRED - no default]
    - rig_id: webcam_main

      # true enables the camera rig, false disables it.
      # [REQUIRED - no default]
      enabled: true

      # `webcam_pair` is the source for this rig.
      # [REQUIRED - no default]
      source: webcam_pair

      # (RGB-D rig.) Frame rate requested from the device, in frames per second.
      # [REQUIRED - no default]
      fps: 30

      # Backend for OpenCV video capture.
      # [default: 0]
      backend: 700

      # Camera quality / capture-mode tuning shared by all rig types.
      quality:

        # (RGB-D rig.) Picks the USB pixel format for the COLOUR stream: true asks for raw YUY2/YUYV, false
        # for MJPG (the default).
        # [default: false]
        prefer_uncompressed: false

        # Prefer manual exposure over auto exposure.
        # [default: null]
        manual_exposure: null

        # Prefer manual gain over auto gain.
        # [default: null]
        manual_gain: null

        # Manual white balance.
        # [default: null]
        manual_wb: null

        # Disables automatic features like auto exposure, auto white balance, and autofocus.
        # [default: true]
        disable_auto_features: true

        # Warm-up frames to allow the camera to stabilize before capturing.
        # [default: 30]
        warmup_frames: 5

        # Tolerance for FPS mismatch between the two cameras.
        # [default: 3.0]
        fps_tolerance: 3.0

      # `[width, height]` in pixels requested from EACH camera.
      # [REQUIRED - no default]
      frame_size: [1280, 720]

      # (webcam_pair rig.) How many OpenCV indices (0 .. N-1) to probe when the camera IDs are NOT pinned.
      # [REQUIRED - no default]
      max_cam_scan: 3

      # Leave null to auto-detect in scan order (integrated webcams are filtered out). Set explicit indices
      # for deterministic runs.
      # [default: null]
      cam_left_id: 0

      # The OpenCV index of the RIGHT camera.
      # [default: null]
      cam_right_id: 1

      # Min pairs required for calibration.
      # [default: 10]
      min_pairs: 10

      # Maximum pairs allowed for calibration.
      # [default: 40]
      max_pairs: 40

      # Filesystem layout for stereo rigs (``webcam_pair`` / ``single_device``).
      calibration_paths:

        # Root folder for this rig's stereo calibration artefacts, relative to
        # the process working directory
        # [REQUIRED - no default]
        base_dir: calibration/webcam_main

        # Path to the OpenCV FileStorage XML holding the rectification maps
        # produced by stereo calibration; auto-derived as `<base_dir>/stereoMap.xml`.
        # [default: ""]
        stereo_map_file: calibration/webcam_main/stereoMap.xml

        # Folder the LEFT-eye calibration PNGs are written to (`imageL0.png`, `imageL1.png`, ...)
        # and counted from; auto-derived as `<base_dir>/left`.
        # [default: ""] [DIFFERS from the default]
        left_images_dir: calibration/webcam_main/left

        # The right-eye counterpart (`imageR0.png`, ...), auto-derived as `<base_dir>/right`.
        # [default: ""]
        right_images_dir: calibration/webcam_main/right

        # The pattern the calibration READS left images with, auto-derived as `<base_dir>/left/*.png`.
        # [default: ""]
        left_images_glob: calibration/webcam_main/left/*.png

        # Right-eye read pattern, auto-derived as `<base_dir>/right/*.png`.
        # [default: ""]
        right_images_glob: calibration/webcam_main/right/*.png

    # --- entry 1: stereo_dev0 ---

      # The name you use to address this camera everywhere else: `camera.cameras.primary_rig_id`
      # selects it, `python -m src.robot.perception --rig <id>` opens it,
      # `FrameProvider.grab(rig_id)` keys on it, and if you omit `calibration_paths.base_dir` the schema
      # invents `calibration/<rig_id>` from it.
      # [REQUIRED - no default]
    - rig_id: stereo_dev0
      enabled: false
      source: single_device
      fps: 30
      backend: 0

      quality:
        prefer_uncompressed: false
        manual_exposure: null
        manual_gain: null
        manual_wb: null
        disable_auto_features: true
        warmup_frames: 5
        fps_tolerance: 3.0
      
      device_index: 0

      # `[width, height]` of the COMBINED frame the device delivers, before
      # splitting — e.g. `[2560, 720]` for two 1280x720 eyes side by side.
      # [REQUIRED - no default]
      device_frame_size: [2560, 720]

      # `[width, height]` each eye must have AFTER cropping and splitting.
      # [REQUIRED - no default]
      per_eye_frame_size: [1280, 720]

      # How the two eyes are packed into the one frame: 'horizontal' splits at
      # the width midpoint (left eye = left half), 'vertical' splits at the height midpoint (left eye = top
      # half).
      # [REQUIRED - no default] [one of: horizontal | vertical]
      layout: horizontal

      # Pixels removed from the LEFT edge of the combined frame BEFORE it is split into two eyes.
      # [default: 0]
      crop_left: 0

      # Pixels removed from the RIGHT edge of the combined frame before splitting.
      # [default: 0]
      crop_right: 0

      # Pixels removed from the TOP of the combined frame before splitting.
      # [default: 0]
      crop_top: 0

      # Pixels removed from the BOTTOM of the combined frame before splitting.
      # [default: 0]
      crop_bottom: 0

      # What to do when a split eye does not already match `per_eye_frame_size`:
      # true (default) silently rescales it with INTER_AREA, false raises `'<side> eye size WxH != TWxTH and
      # allow_resize=False'`.
      # [default: true]
      allow_resize: true

      # Blur gate for the interactive calibration CAPTURE only: a pair is saved.
      # [default: null]
      min_sharpness: null

      # Minimum number of stereo image pairs required for calibration.
      # [default: 10]
      min_pairs: 10

      # Maximum number of stereo image pairs allowed for calibration.
      # [default: 40]
      max_pairs: 40

      # Filesystem layout for stereo rigs (``webcam_pair`` / ``single_device``).
      calibration_paths:
        base_dir: calibration/stereo_dev0
        stereo_map_file: calibration/stereo_dev0/stereoMap.xml
        left_images_dir: calibration/stereo_dev0/left
        right_images_dir: calibration/stereo_dev0/right
        left_images_glob: calibration/stereo_dev0/left/*.png
        right_images_glob: calibration/stereo_dev0/right/*.png

    # --- entry 2: stereo_dev3 ---
    - rig_id: stereo_dev3
      enabled: false
      source: single_device
      fps: 30
      backend: 0

      # Camera quality / capture-mode tuning shared by all rig types.
      quality:
        prefer_uncompressed: false
        manual_exposure: null
        manual_gain: null
        manual_wb: null
        disable_auto_features: true
        warmup_frames: 30
        fps_tolerance: 3.0

      device_index: 3
      device_frame_size: [2560, 720]
      per_eye_frame_size: [1280, 720]
      layout: horizontal
      crop_left: 0
      crop_right: 0
      crop_top: 0
      crop_bottom: 0
      allow_resize: true
      min_sharpness: null
      min_pairs: 10
      max_pairs: 40

      # Filesystem layout for stereo rigs (``webcam_pair`` / ``single_device``).
      calibration_paths:
        base_dir: calibration/stereo_dev3
        stereo_map_file: calibration/stereo_dev3/stereoMap.xml
        left_images_dir: calibration/stereo_dev3/left
        right_images_dir: calibration/stereo_dev3/right
        left_images_glob: calibration/stereo_dev3/left/*.png
        right_images_glob: calibration/stereo_dev3/right/*.png

    # --- entry 3: realsense_d435 ---

      # (RGB-D rig.) The name you use to address this camera everywhere else: `camera.cameras.primary_rig_id`
      # selects it, `python -m backend.src.robot.perception --rig <id>` opens it,
      # `FrameProvider.grab(rig_id)` keys on it, and if you omit `calibration_paths.base_dir` the schema
      # invents `calibration/<rig_id>` from it
      # [REQUIRED - no default]
    - rig_id: realsense_d435
      enabled: false
      source: rgbd
      fps: 30
      backend: 0

      # Camera quality / capture-mode tuning shared by all rig types.
      quality:
        prefer_uncompressed: false
        manual_exposure: null
        manual_gain: null
        manual_wb: null
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      device_index: 0

      # The RealSense device serial, passed to `rs_config.enable_device()`. `null` means "take
      # the first device the SDK enumerates". On a one-camera cell that is fine; on a two-camera cell it is
      # the single most dangerous null in the tree, because two identical D435s that swap enumeration order
      # do not fail, they return a complete, plausible scene with the views exchanged, every fused position
      # mirrored about the rig axis, and the pick goes confidently to the wrong place.
      # [default: null]
      serial_number: null

      # `[width, height]` in pixels for the colour stream. Not a free choice: it must be a mode
      # the device actually supports (1280x720 is the shipped D435 value), and it sets the intrinsics, the
      # fx/fy/cx/cy read back from the device and written into `intrinsics.json` belong to THIS resolution.
      # [default: [1280, 720]]
      color_resolution: [1280, 720]

      # `[width, height]` in pixels for the depth stream. Only the RealSense backend acts on it
      # (`enable_stream(..., z16, fps)`); the OpenCV/OpenNI backend stores it and never uses it, the code
      # comment says depth resolution is not verifiable through a single VideoCapture.
      # [default: [1280, 720]]
      depth_resolution: [1280, 720]

      # true (default) inserts librealsense's `rs.align(color)` so depth pixel (u,v) is the
      # depth of colour pixel (u,v).
      # [default: true]
      align_depth_to_color: true

      # (RGB-D rig.) Chooses the driver: 'realsense' talks to the device through pyrealsense2 (hardware-
      # aligned depth, real depth-scale, emitter/preset/filter control) while 'opencv' (the schema default)
      # uses generic `cv2.VideoCapture` + OpenNI channels and returns an EMPTY depth array on any device
      # whose depth only exists behind its vendor SDK i.e. on a RealSense you get colour and no depth,
      # without an exception.
      # [default: opencv] [DIFFERS from the default] [one of: opencv | realsense]
      rgbd_backend: realsense

      # Intel RealSense (pyrealsense2) device tuning.
      realsense:

        # Switches the D400's IR pattern projector on (default) or off..
        # [default: true]
        enable_emitter: true

        # IR projector power in milliwatts, passed straight to `rs.option.laser_power`. `null`
        # (default) leaves the device value (150 mW on a D435, max 360). More power = denser depth on dark
        # or distant surfaces and more heat
        # [default: null]
        laser_power_mw: null

        # Name of a D400 depth preset ('HighAccuracy', 'HighDensity', 'MediumDensity',
        # 'Default'), matched case-insensitively against the `rs400_visual_preset` enum. It is the single
        # biggest depth-quality lever there is: HighAccuracy throws away every low-confidence pixel (sparse
        # but trustworthy. Good when a wrong depth would place a grasp inside an object), HighDensity keeps
        # almost everything (fewer holes, more fliers). `null` leaves the device default.
        # [default: null]
        visual_preset: null

        # Metres per raw depth unit the D435 default is 0.001 (1 mm), and 0.0001 gives finer
        # quantisation at the cost of a much shorter max range (65535 units x the unit).
        # [default: null]
        depth_units_m: null

        # When true, `open()` writes the colour stream's factory fx/fy/cx/cy plus the 5-term
        # Brown-Conrady distortion to `calibration_paths.intrinsics_file`, creating `base_dir` if needed.
        # [default: false]
        export_intrinsics: false

        # Depth post-processing filter chain for the RealSense backend.
        post_processing:

          # Adds librealsense's decimation filter, the first stage of the depth chain: it
          # downsamples the depth map by `decimation_magnitude` with a median-like reduction.
          # [default: false]
          decimation: false

          # The decimation factor, 2-8 (default 2 = quarter the pixels). 4 gives a sixteenth.
          # Only read when `decimation` is true; on its own it does nothing at all.
          # [default: 2]
          decimation_magnitude: 2

          # Edge-preserving spatial smoothing of each depth frame, on by default at
          # librealsense's own default strength (this config exposes no sub-parameters). It removes per-
          # pixel depth noise within a surface, which is what makes a plane fit or a support-plane estimate
          # stable, while trying not to round off depth discontinuities
          # [default: true]
          spatial: true

          # Averages each depth pixel over recent frames, on by default. Excellent for a STATIC
          # bin it is the cheapest way to stabilise depth on a marginal surface and wrong for anything
          # moving: while the arm or an object is in motion it smears depth along the path and leaves ghost
          # geometry behind the mover.
          # [default: true]
          temporal: true

          # A tilted view sees object SIDES at a steep angle, which is where a D435 drops depth. Hole
          # filling INVENTS surface, and the grasp-depth top-reference would then sample invented geometry,
          # so it stays off: an honest hole is a measurable signal (the perception exerciser prints the hole
          # fraction inside each mask); a filled hole is a confident wrong number.
          # [default: false]
          hole_filling: false

          # Which neighbour a filled hole borrows its depth from: 0 = fill from left, 1 =
          # farthest-from-around (default), 2 = nearest-from-around. It is read ONLY when
          # `post_processing.hole_filling` is true, and that flag is false in the schema and in every
          # shipped rig so as configured today this key does nothing.
          # [default: 1]
          hole_filling_mode: 1

      # Filesystem layout for RGB-D rigs: where the intrinsics artefact lives.
      calibration_paths:
        base_dir: calibration/realsense_d435
        intrinsics_file: calibration/realsense_d435/intrinsics.json
