# ============================================================================
# models/stt.yaml — every key, with what it does
# ============================================================================

# Speech-to-text (Whisper) configuration.
stt:

  # Model ID for the Whisper checkpoint, used when `local` is false.
  # [REQUIRED - no default]
  model_id: openai/whisper-large-v3-turbo

  # Local directory holding the Whisper checkpoint, used when `local: true`
  # [REQUIRED - no default]
  model_path: assets/models/hf/speech/openai--whisper-large-v3-turbo

  # The Silero voice activity detector as a TorchScript file, read from disk whatever `local` says.
  # Every recording is scored for speech before Whisper is asked what was said.
  # [REQUIRED - no default]
  vad_model_path: assets/models/hf/speech/silero-vad-6.2.1/silero_vad.jit

  # The sample rate in Hz that Whisper is fed at, and the rate the microphone stream opens at. Audio that
  # arrives at another rate is resampled to it. Must be greater than 0.
  # [REQUIRED - no default]
  samplerate: 16000

  # Frames per callback of the sounddevice microphone stream, how big a bite the audio driver hands back at
  # a time (8000 frames = 0.5 s at 16 kHz). 0 lets PortAudio choose. Must be 0 or more.
  # [REQUIRED - no default]
  blocksize: 8000

  # Number of microphone channels to open on the capture stream. 1 (mono) is what Whisper wants; every
  # block is averaged into one channel, so more than one is mixed rather than interleaved.
  # [REQUIRED - no default]
  channels: 1

  # The raw PCM sample format the capture stream opens with: 'int16', 'int32' or 'float32'. Each block is
  # divided by the full scale of its own format. Not the model's compute dtype, which is
  # `optim.torch_dtype`.
  # [REQUIRED - no default]
  dtype: int16

  # Which language the decoder runs with: 'auto' picks German or English per recording, 'german' or
  # 'english' forces that language token. Nothing else is offered.
  # [REQUIRED - no default]
  language: auto

  # Whisper's decoding task. 'transcribe' is the only value accepted, so the text stays in the language it
  # was spoken in; 'translate' is refused at load.
  # [REQUIRED - no default]
  task: transcribe

  # Load Whisper offline from `model_path` (true) or from the Hub `model_id` (false).
  # [REQUIRED - no default]
  local: true

  # Optional inference-time optimizations for torch-based models.
  optim:

    # The validated baseline runs with torch_dtype + attn UNSET: the detector loads native fp32 weights
    # and its autocast(dtype=None) => fp16-autocast compute — full recall on the small (~46 px) overhead
    # cube.
    # [default: null]
    torch_dtype: auto

    # Forwarded to RT-DETR's `from_pretrained` ('eager' is shipped).
    # [default: null]
    attn_implementation: eager

    # Channels-last memory format for the RT-DETR weights and its per-call `pixel_values`.
    # [default: false]
    channels_last: true

    # `torch.compile` the RT-DETR model warm-up cost on the first call, faster afterwards, best-effort
    # with a warn-and-fall-back-to-eager on failure.
    # [default: false]
    compile: false

    # `mode=` handed to RT-DETR's `torch.compile` ('reduce-overhead' shipped). Warm-up-vs-steady-state
    # tradeoff; detections are unchanged.
    # [default: reduce-overhead]
    compile_mode: reduce-overhead
