# ============================================================================
# models/stt.yaml — every key, with what it does
# ============================================================================

# Speech to text: which Whisper checkpoint, and which language it decodes.
stt:

  # The Whisper checkpoint: a Hugging Face id, read from <weights_root>/speech/<org>--<name>
  # (`scripts/model_weights/fetch.py whisper-turbo`), or a folder's path.
  # [REQUIRED - no default]
  model_id: openai/whisper-large-v3-turbo

  # Which language the decoder runs with: 'auto' picks German or English per recording, 'german' or
  # 'english' forces that language token. Nothing else is offered.
  # [REQUIRED - no default]
  language: auto
