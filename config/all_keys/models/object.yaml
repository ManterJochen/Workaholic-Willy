# ============================================================================
# models/object.yaml — every key, with what it does
# ============================================================================

# Which perception stack a cell builds: the VLM for free text, or RT-DETR's trained classes.
pipeline:

  # Pick which perception stack to use: 'zero_shot' grounds any prompt with the VLM, 'closed_set' answers with
  # RT-DETR's fixed class list (`models.rtdetr`) and reads a prompt only as a class-name filter. SAM2 cuts the masks
  # of both.
  # [default: zero_shot] [one of: zero_shot | closed_set]
  kind: zero_shot

  # Open-vocabulary perception: the VLM grounds any prompt, SAM2 cuts each box.
  zero_shot:

    # The vision-language model that grounds every free-text prompt and reads the console's commands.
    vlm:

      # The Qwen3-VL-Instruct checkpoint: a Hugging Face id, read from
      # <weights_root>/vlm/<org>--<name> (`scripts/model_weights/fetch.py vlm-4b`, `vlm-8b`), or a folder's path.
      # It loads at the first prompt that reaches it; how it answers is fixed at the owner's cell's values.
      # [default: Qwen/Qwen3-VL-4B-Instruct-FP8] [DIFFERS from the default]
      model_id: Qwen/Qwen3-VL-4B-Instruct

# The closed-set detector, RT-DETR: its weights and the score a box must clear. Required by
# `pipeline.kind: closed_set`.
rtdetr:

  # A Hugging Face id, read from <weights_root>/detection/<org>--<name> (`scripts/model_weights/fetch.py rtdetr`), or
  # the folder a DetectorTraining run wrote, its out_dir: an absolute path, `~/...`, or `./...` beside the config
  # folder.
  # [REQUIRED - no default]
  model_id: PekingU/rtdetr_r50vd

  # Confidence floor in 0..1 for RT-DETR's boxes; a box scoring below it never leaves the detector.
  # [REQUIRED - no default]
  threshold: 0.4
