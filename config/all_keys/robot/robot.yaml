# ============================================================================
# robot/robot.yaml — every key, with what it does
# ============================================================================

robot:

  # Picks which arm driver gets built, and is validated at config-load against the RobotVendor enum.
  # [default: ur] [one of: ur | kuka | franka | ros2 | sim | dummy]
  vendor: ur

  # UR-specific connection settings.
  ur:

    # Which UR this cell drives.
    # [default: ur5e] [one of: ur3e | ur5e | ur10e]
    model: ur5e

    # Ip address of the UR controller.
    # [default: 192.168.1.100]
    ip: 192.168.1.100

    # RTDE update rate in Hz. Please refer to the UR documentation for recommended values.
    # Dont use 0.0 because it may cause synchronization issues with the UR controller.
    # [default: 0.0] 
    rtde_frequency: 0.0

    # Chooses how an approach motion gets from A to B on a real UR.
    # CuRobo NEEDS a proper environment setup to function correctly & an GPU available.
    # [default: curobo] [one of: ik | curobo]
    motion_planner: curobo

  # Isaac-Sim (or pure-Python mock) driver settings.
  sim:

    # Which simulation backend to use. Currently, only 'isaac' is supported.
    # [default: isaac]
    backend: isaac

    # Whether the simulation backend is enabled. Set to true to activate Isaac Sim; false keeps it disabled.
    # [default: false]
    enabled: false

    # Master switch between a real Isaac Sim boot and a pure-Python kinematic stand-in.
    # [default: false]
    mock_mode: false

    # Which UR the sim cell drives is validated against the Lula solver configuration.
    # [default: ur5e] [one of: ur3e | ur5e | ur10e]
    robot_model: ur5e

    # USD stage to open at session start instead of creating an empty one
    # [default: null]
    scene: null

    # Combined UR5e + Robotiq 2F-85 articulation (one root prim); gripper shares the same prim.
    # [default: null]
    robot_prim_path: null

    # Prim path of the articulation that owns the gripper's driven joint. For the shipped combined UR5e
    # asset this is the SAME prim as robot_prim_path ("/World/UR5e") because the 2F-85 is a baked variant of
    # the one 12-DoF articulation, not a separate body.
    # [default: null]
    gripper_prim_path: null

    # Where `move_home()` sends this arm.
    # We used:
    #         UR3e: z = 561.9 mm and r = 466.9 mm
    # [default: null]
    home_joint_positions: null

    # Per-camera entry inside :class:`SimConfig.cameras`.
    # Empty. Each entry under `cameras:` is keyed by YOUR name for the thing (a rig id, say) and holds a
    # full block; the index lists its keys.
    cameras: {}

    # The fixed simulator timestep in seconds, used for BOTH physics and rendering (1/60 s by default).
    # [default: 0.016666666666666666]
    step_dt_s: 0.016666666666666666

    # How long (in sim seconds) the driver waits for the arm to go steady after a motion before giving up
    # and returning MotionStatus.TIMEOUT.
    # [default: 5.0]
    settle_timeout_s: 5.0

    # Whether Isaac boots without a viewport window
    # [default: true]
    headless: true

    # Filesystem or Omniverse root of the Isaac asset pack that USD references are resolved against the
    # robot USD, the YCB/GSO meshes, the KLT bin.
    # [default: null]
    assets_root: null

    # Which end-effector variant to select out of the shipped UR USD's built-in "Gripper" variant set i.e.
    # it picks a gripper that is BAKED INTO the arm asset, and therefore only accepts names that asset
    # defines ("Robotiq_2f_85" for the ur5e).
    # [default: Robotiq_2f_85]
    gripper_variant: Robotiq_2f_85

    # The Isaac ur3e.usd ships BARE unlike ur5e/ur10e it bakes in no Robotiq variant (verified at byte
    # level: no `Gripper` variant set, no `Robotiq` token).
    # [default: null]
    gripper_mount: null

    # Which suction-cup geometry to mount for a suction pick a key in willy_sim.grippers.SUCTION_CUPS
    # ("slim" is the finer cup that reaches into tighter gaps).
    # [default: null]
    suction_cup: null

    # The park pose (arm swung clear of the overhead camera before perceiving) is inherited from the UR5e
    # layer as [3.14, -1.0, 0.9, 0, 0, 0].
    # [default: null]
    park_joint_positions: null

    # Willy-sim scene-authoring + experiment params (read by src.willy_sim only).
    scene_setup:

      # Graspable object authored into the sim scene (willy_sim scene-authoring).
      object:

        # The human-readable label attached to this object when the scene is authored.
        # [default: cube]
        name: cube

        # The shape of the object to spawn in the simulation.
        # [default: cube] [one of: cube, cylinder]
        shape: cube

        # Extents of the spawned primitive in mm.
        # [default: [30.0, 30.0, 50.0]]
        size_mm: [30.0, 30.0, 50.0]

        # Follows the scene to its new anchor (nadir over the object).
        # [default: [450.0, 0.0, 25.0]]
        position_mm: [450.0, 0.0, 25.0]

        # Rigid-body mass in kilograms (default 0.05 = 50 g)
        # [default: 0.05]
        mass_kg: 0.05

        # Static friction coefficient of the shared grip PhysicsMaterial (default 1.5 - deliberately high so
        # a parallel-jaw close holds rather than squirts the object out).
        # [default: 1.5]
        static_friction: 1.5

        # Sliding-friction coefficient of the same single shared grip material (default 1.3, just under
        # static so an object that starts sliding keeps sliding slightly more easily).
        # [default: 1.3]
        dynamic_friction: 1.3

        # RGB in the 0-1 range (NOT 0-255) painted onto the spawned primitive.
        # [default: [0.9, 0.2, 0.1]]
        color: [0.9, 0.2, 0.1]

        # Switches this object from a procedural primitive to a referenced USD mesh (a YCB or converted GSO
        # asset), which makes shape/size_mm/color inert.
        # [default: null]
        usd_asset_path: null

        # Spawn orientation as a WXYZ quaternion in the world frame (note the ordering the rest of this
        # codebase uses XYZW; this key follows Isaac's convention).
        # [default: null]
        orientation_wxyz: null

        # Authors PhysX collision onto a referenced mesh that ships without any, turning a decorative mesh
        # into a graspable rigid body.
        # [default: null]
        usd_collision_approximation: null

      # Graspable object authored into the sim scene (willy_sim scene-authoring).
      # No entries. Each item under `objects:` is a complete block; see the index for its keys.
      objects: []

      # Static table authored into the sim scene.
      table:

        # Size of the static table slab in mm (width, depth, height).
        # [default: [800.0, 800.0, 400.0]]
        size_mm: [800.0, 800.0, 400.0]

        # Position of the static table slab in mm (x, y, z).
        # [default: [450.0, 0.0, -200.0]]
        position_mm: [450.0, 0.0, -200.0]

      # Dedicated hand-eye calibration marker. Marker length + ArUco dict come from
      # ``camera.hand_eye.eye_in_hand`` (single source of truth); this block holds placement + kind.
      marker:

        # Whether a dedicated hand-eye calibration target is authored, and of what sort. "none" (default) =
        # no marker prim at all, and SceneHandles.marker_prim_path comes back None, which makes ground-truth
        # EIH calibration refuse to run. "flat" = a plain white plate (the ground-truth calibration
        # plumbing). "aruco" = a detectable ArUco board built from solid-colour geometry (perception-based
        # calibration).
        # [default: none] [one of: none | flat | aruco]
        kind: none

        # Position of the hand-eye calibration marker in mm (x, y, z).
        # [default: [450.0, -150.0, 6.0]]
        position_mm: [450.0, -150.0, 6.0]

        # Size of the flat calibration plate in mm (width, depth, height).
        # [default: [80.0, 80.0, 10.0]]
        flat_size_mm: [80.0, 80.0, 10.0]

        # Edge length in mm of the WHITE BASE PLATE the ArUco pattern is printed on not the marker itself.
        # [default: 72.0]
        aruco_plate_size_mm: 72.0

        # Which ArUco id from the configured dictionary (DICT_4X4_50) is generated onto the plate.
        # [default: 0]
        aruco_marker_id: 0

      # Eye-in-hand look-at viewpoint pattern (hemisphere around the marker).
      eih_viewpoints:

        # Camera standoff distances in mm on the hemisphere the wrist camera is driven around during eye-in-
        # hand calibration the list is a full cross product with elevations and azimuths, so 2 radii x 2
        # elevations x 6 azimuths = 24 poses.
        # [default: [235.0, 275.0]]
        radii_mm: [235.0, 275.0]

        # Elevation angles for the calibration hemisphere, measured FROM THE VERTICAL (0 = camera straight
        # above the marker), default 16 and 30 degrees.
        # [default: [16.0, 30.0]]
        elevations_deg: [16.0, 30.0]

        # Azimuth angles (degrees around the marker) for the calibration hemisphere; the default six at
        # 60-degree spacing give an even ring.
        # [default: [0.0, 60.0, 120.0, 180.0, 240.0, 300.0]]
        azimuths_deg: [0.0, 60.0, 120.0, 180.0, 240.0, 300.0]

      # Pick/lift gate thresholds for the sim validation runners.
      gate:

        # How far the target object's centre must actually RISE, in mm, for one run to count as a successful
        # pick.
        # [default: 50.0]
        lift_threshold_mm: 50.0

        # What fraction of runs must pass for the whole gate to pass, default 0.8 (8 of 10)
        # [default: 0.8]
        pass_fraction: 0.8

      # How many rendered simulation steps to pump before reading an image, so the RTX renderer and the
      # RGB/segmentation annotators have actually populated their buffers - too few and you get a black
      # frame or an empty mask that reads as a perception failure.
      # [default: 20]
      render_warmup_steps: 20

  # Settings for the in-process dummy driver.
  dummy: {}

  # Vendor-specific KUKA settings.
  kuka:

    # The KUKA arm's model name.
    # [default: unconfigured]
    model: kr6-r900

    # How many joints the arm has.
    # [default: 6]
    dof: 6

    # KUKA controller network address. Only used when EKI is in client mode (Willy dials the controller);
    # informational otherwise.
    # [default: 192.168.1.20]
    controller_ip: 192.168.1.20

    # EthernetKRL TCP/XML settings for the planned KUKA driver.
    eki:

      # Python application's role. For typical EthernetKRL setups, the robot-side KRL program opens the
      # connection to this Python server.
      # [default: server] [one of: server | client]
      role: server

      # The TCP address of the EKI link — and WHICH end it describes flips with `eki.role`. With role
      # 'server' (the shipped default, where the KRL program dials in to us) this is the LOCAL bind address,
      # and the default 0.0.0.0 means 'accept the controller on any of this PC's interfaces'; narrow it to
      # one interface address if the PC is multi-homed and you want the controller pinned to the robot
      # network. With role 'client' this key is IGNORED entirely — the driver dials `kuka.controller_ip`
      # instead. So on a default config, editing this key changes only which local NIC the listener binds.
      # ONLY WHEN: robot.vendor must be "kuka"; only consulted when robot.kuka.eki.role == "server".
      # [default: 0.0.0.0]
      host: 0.0.0.0

      # The TCP port for the EKI link the port we listen on in server role, or dial on the controller in
      # client role.
      # [default: 7000]
      port: 7000

      # One number used as the deadline for EVERY blocking EKI operation, in seconds: waiting for the
      # controller's inbound connection, waiting for an <Ack> after a command, and waiting for an FkRequest
      # or IkRequest reply
      # [default: 5.0]
      timeout_s: 5.0

      # How often (seconds) a background thread sends an <Echo> probe down the EKI link to prove the
      # controller is still alive. If no <EchoAck> comes back within max(2 * heartbeat_s, timeout_s) the
      # link is declared dead and dropped that is the ONLY mechanism that notices a controller which
      # stopped answering without closing the socket.
      # [default: 0.5]
      heartbeat_s: 0.5

      # Bytes handed to each socket recv() on the EKI reader thread and, less obviously, the basis of an
      # overflow guard: if 8 x this many bytes accumulate without a complete frame the reader logs 'buffer
      # overflow' and DROPS THE LINK, on the assumption the peer is sending garbage.
      # [default: 65536]
      buffer_size: 65536

  # Hard upper bounds on commanded velocity / acceleration.
  motion_limits:

    # The hard ceiling on commanded speed for every UR motion.
    # [default: 1.0]
    max_velocity: 1.0

    # The hard ceiling on commanded acceleration, and the default acceleration when a caller supplies none.
    # [default: 0.5]
    max_acceleration: 0.5

  # Cartesian workspace bounding box in millimetres.
  workspace_limits:

    # Lower X bound (mm, robot BASE frame) of the Cartesian box the TCP is allowed into.
    # [default: -500.0]
    x_min: -500.0

    # Upper X bound (mm, BASE frame) of the allowed TCP box.
    # [default: 500.0]
    x_max: 500.0

    # Lower Y bound (mm, BASE frame)
    # [default: -500.0]
    y_min: -500.0

    # Upper Y bound (mm, BASE frame).
    # [default: 500.0]
    y_max: 500.0

    # The FLOOR, in mm above the robot base plane.
    # [default: 0.0]
    z_min: 100.0

    # The ceiling, in mm above the base plane.
    # [default: 500.0]
    z_max: 600.0

  # Physical gripper opening limits.
  gripper:

    # Selects which end-effector driver is built.
    # [default: robotiq] [none, dummy, robotiq, vacuum, jaw_io, onrobot]
    vendor: robotiq

    # Physical opening of the mounted gripper, in mm. Default is the Robotiq 2F-85 (85 mm), the end-effector
    # this project ships. The Robotiq driver anchors its count map on this value, so it must be the real
    # physical open width, not a policy ceiling.
    # [default: 85.0]
    max_width_mm: 85.0

    # Smallest MEANINGFUL grip, a policy floor NOT the physical closed width (the 2F-85 closes to 0 mm).
    # The driver's count map is anchored on 0, so this only clamps commanded widths.
    # [default: 5.0]
    min_width_mm: 5.0

    # The PHYSICAL closed width: what ``get_width_mm()`` reads when the jaws are shut on nothing. Default
    # 0.0 = the Robotiq 2F-85 (fingers touching).
    # [default: 0.0]
    closed_width_mm: 0.0

    # Wiring + timing for a suction end-effector on the controller's digital I/O.
    vacuum:

      # Output pin that switches the ejector / pump on.
      # [default: 0]
      vacuum_output_pin: 0

      # Optional output pulsed on RELEASE. Residual vacuum keeps a light part stuck to the cup after the
      # ejector stops, so it lets go somewhere unintended; a blow-off pulse pushes it off deliberately.
      # [default: null]
      blow_off_output_pin: null

      # Optional input from a vacuum switch. WITH it the gripper can be ASKED whether it is holding a part
      # real post-close verification, which the jaw path does not have.
      # [default: null]
      vacuum_ok_input_pin: null

      # Which I/O bank the pins live on.
      # [default: tool] [one of: standard | configurable | tool]
      io_port: tool

      # How long to wait for the switch to confirm a seal.
      # [default: 1.0]
      engage_timeout_s: 1.0

      # Blow-off pulse length on release.
      # [default: 0.15]
      blow_off_s: 0.15

      # Commanded width at/below which the driver engages vacuum.
      # [default: 5.0]
      vacuum_on_below_mm: 5.0

    # Wiring + timing for a parallel-jaw gripper on the controller's digital I/O.
    jaw_io:

      # How the jaws are driven.  ``single_solenoid`` ONE output: high = close, low = open (spring
      # return). The common pneumatic case. On power loss the spring opens and a held part FALLS.
      # ``double_solenoid`` TWO outputs, pulsed: one closes, the other opens, and the valve is bistable.
      # On power loss it HOLDS the part, which is the safer failure but the jaw state is then not
      # inferable from the outputs, so feedback pins matter more here.
      # [default: single_solenoid] [one of: single_solenoid | double_solenoid]
      actuation: single_solenoid

      # Output that closes the jaws. Held high while closed (single) or pulsed (double).
      # [default: 0]
      close_output_pin: 0

      # Output that opens the jaws. REQUIRED for ``double_solenoid``; unused (and must stay unset) for
      # ``single_solenoid``, where "open" is simply dropping ``close_output_pin``.
      # [default: null]
      open_output_pin: null

      # Pulse length for ``double_solenoid``. A bistable valve latches, so the coil is energised only long
      # enough to throw it holding it high is what cooks the coil.
      # [default: 0.2]
      pulse_s: 0.2

      # Optional input from a dedicated part-present sensor. Simplest feedback: one pin, read directly.
      # [default: null]
      part_present_input_pin: null

      # Optional reed switch that reads TRUE when the jaws are FULLY CLOSED.
      # [default: null]
      closed_confirm_input_pin: null

      # Optional reed switch that reads TRUE when the jaws are FULLY OPEN.
      # [default: null]
      open_confirm_input_pin: null

      # Which I/O bank the pins live on.
      # [default: tool] [one of: standard | configurable | tool]
      io_port: tool

      # How long to wait for the jaws to reach a settled state after a close
      # [default: 1.0]
      close_timeout_s: 1.0

      # Fixed travel wait used when NO feedback pin is wired (there is nothing to poll, so the driver can
      # only wait).
      # [default: 0.3]
      close_settle_s: 0.3

      # Commanded width at/below which the driver CLOSES.
      # [default: 5.0]
      closed_below_mm: 5.0

      # What ``connect()`` does when NO feedback is wired, and it defaults to the cautious answer.
      # [default: false]
      open_on_connect_without_feedback: false

    # An OnRobot RG2 / RG6 reached over Modbus TCP through the OnRobot Compute Box.
    onrobot:

      # The Compute Box's own IP. NOT the robot's, and NOT to be assumed: the factory default is
      # 192.168.1.1, but the documented Dynamic IP mode only falls back to it after a 60-second DHCP
      # timeout, so a box on a DHCP network can be anywhere.
      # [default: 192.168.1.1]
      host: 192.168.1.1

      # Modbus TCP port. OnRobot documents 502 and one concurrent connection.
      # [default: 502]
      port: 502

      # Modbus unit id, which selects the TOOL.
      # [default: 65]
      unit_id: 65

      # Gripping force in NEWTONS, used when a caller passes none.
      # [default: 20.0] [NEWTONS: 20.0-120.0]
      default_force_n: 20.0

      # Whether commanded widths are interpreted WITH the configured fingertip offset (control value 16) or
      # without it (control value 1).
      # [default: false]
      use_fingertip_offset: false

    # Flange -> TCP for the mounted end-effector.
    tool_frame:

      # Who owns the transform.
      # [default: undeclared] [one of: undeclared | willy | polyscope]
      source: undeclared

      # Flange -> grasp-centre translation, mm, in the FLANGE frame.
      # [default: [0.0, 0.0, 0.0]]
      offset_mm: [0.0, 0.0, 0.0]

      # Flange -> TCP rotation as XYZW.
      # [default: [0.0, 0.0, 0.0, 1.0]]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

      # How far the controller's ACTIVE tool frame may differ from what this block declares before the
      # driver refuses to connect, in mm.
      # [default: 10.0]
      verify_tolerance_mm: 10.0

  # Joint configuration the arm returns to on ``move_home()``, in radians. ``None`` uses
  # :data:`HOME_JOINTS_DEFAULT`, which was authored for a UR5e.
  # [default: null]
  home_joint_positions: null

  # Cartesian POSITION the robot can retreat to at operator request.
  safe_pose:

    # X (mm, BASE frame) of a 'retreat to safety' pose.
    # [default: 0.0]
    x: 0.0

    # Y (mm, BASE frame) of the retreat pose.
    # [default: -300.0]
    y: -300.0

    # Z (mm above base) of the retreat pose.
    # [default: 400.0]
    z: 400.0

  # Tunable parameters for the hand-eye calibration routine.
  calibration:

    # Mechanical settle time after each pose move, before image capture.
    # [default: 0.5]
    settle_time_s: 0.5

    # Random orientation deviation (deg) when generating calibration poses.
    # [default: 15.0]
    orientation_spread_deg: 15.0

    # Pose-generator retry budget per pose before giving up.
    # [default: 200]
    max_attempts_per_pose: 200

    # ETH pose-generator z band PER MARKER SOURCE (``"ground_truth"`` / ``"aruco"``), as ``(lo, hi)``
    # fractions of ``workspace_limits.z_max``.
    # [default: null]
    pose_box_z_frac: null

    # RMSE thresholds (mm) that classify a hand-eye calibration result.
    quality_bands_mm:

      # The RMSE (mm) at or below which a finished hand-eye calibration is labelled 'excellent'.
      # [default: 1.0]
      excellent: 1.0

      # RMSE (mm) at or below which a calibration is labelled 'good'.
      # [default: 2.5]
      good: 2.5

      # RMSE (mm) at or below which a calibration is labelled 'marginal'.
      # Anything exceeding this threshold is considered 'poor'.
      # [default: 5.0]
      marginal: 5.0

  # Vendor-neutral safety surface.
  safety:

    # Workspace-margin safety config.
    limits:

      # A coherent pair rather than the shipped "not measured yet" markers, for the same reason as above:
      # the console should exercise the happy path, not trip a guard that exists for real cells.
      # [default: true]
      enforce: true

      # A safety buffer in mm that is subtracted from all six faces of `robot.workspace_limits` before the
      # workspace guard is built, so the arm is refused before it reaches the box edge.
      # [default: 20.0]
      workspace_margin_mm: 20.0

    # Per-axis joint-limit guard configuration.
    joint_limits:

      # A coherent pair rather than the shipped "not measured yet" markers, for the same reason as above:
      # the console should exercise the happy path, not trip a guard that exists for real cells.
      # [default: true]
      enforce: true

      # Degrees of keep-out subtracted from BOTH ends of every axis range before the commanded joint
      # solution is bounds-checked; a target inside the raw range but within this many degrees of it is
      # rejected as JOINT_LIMIT.
      # [default: 5.0]
      margin_deg: 5.0

      # Per-axis lower joint limits in degrees, one entry per arm axis.
      # [default: null]
      min_deg: null

      # Per-axis upper joint limits in degrees; the companion of `min_deg`.
      # [default: null]
      max_deg: null

    # IK-solution-quality guard configuration.
    ik_quality:

      # A coherent pair rather than the shipped "not measured yet" markers, for the same reason as above:
      # the console should exercise the happy path, not trip a guard that exists for real cells.
      # [default: true]
      enforce: true

      # Largest per-axis change (radians) allowed between the arm's CURRENT joints and the IK solution for
      # the next target.
      # [default: 1.0]
      max_jump_rad: 1.0

      # Floor on the smallest singular value of the numerically estimated 6xN geometric Jacobian at the
      # target configuration. Below it the pose is called near-singular and refused, because tiny Cartesian
      # corrections there demand huge joint speeds.
      # [default: 0.005]
      min_singular_value: 0.005

      # Ceiling on the Jacobian condition number (largest/smallest singular value) at the target
      # configuration, a unitless measure of how badly the arm is stretched between its best- and worst-
      # conditioned Cartesian direction.
      # [default: 250.0]
      max_condition_number: 250.0

      # Degrees of clearance every axis of the IK solution must keep from its resolved joint limit.
      # [default: 2.0]
      limit_proximity_deg: 2.0

    # Self-collision guard configuration.
    self_collision:

      # Whether the self-collision guard is in the preflight pipeline at all.
      # [default: true]
      enforce: true

      # Which geometry the self-collision guard checks.
      # We highly recommend using the `fcl` backend for accurate collision checking.
      # [default: fcl] [one of: capsule | fcl]
      backend: fcl

      # The clearance in mm that must remain between every monitored shape pair (arm link vs arm link, base,
      # tool, and every fixture box).
      # [default: 10.0]
      min_distance_mm: 10.0

      # Clearance (mm) handed to the TRAJECTORY PLANNER so it stops proposing configurations this guard will
      # reject.
      # [default: 0.0]
      planner_margin_mm: 0.0

      # Per-link capsule radii in mm, indexed by link (entry 0 = the first DH link capsule). It sets how fat
      # the arm is modelled to be in the capsule collision proxy; missing or short lists fall back to a 60
      # mm radius per link.
      # [default: null]
      link_radii_mm: null

      # Static fixture obstacle used by the self-collision guard.
      # No entries. Each item under `fixtures:` is a complete block; see the index for its keys.
      fixtures: []

      # An alternate DIRECTORY to load the pre-baked collision-mesh bundle from.
      # [default: null]
      mesh_dir: null

      # Which bundled UR DH table (`ur3e`, `ur5e`, ...) the guard uses to place the arm's link
      # capsules/meshes.
      # At the moment UR arms are the only supported models.
      # [default: null]
      kinematics_model: null

      # Names a per-gripper mesh bundle (`{variant}_collision_meshes.npz`, e.g. `schunk_egu50`) to load
      # INSTEAD of the model's default bundle, for cells running an end-effector other than the baked
      # Robotiq 2F-85.
      # [default: null]
      collision_mesh_variant: null

      # Rotation in degrees about +Z that reconciles the bundled UR DH base frame with the base frame your
      # poses and fixtures are expressed in.
      # [default: 0.0]
      kinematics_base_yaw_deg: 0.0

      # How far the mounted tool's body extends in mm from the commanded TCP BACK toward the flange, the
      # guard lays a capsule over that span.
      # [default: 150.0]
      tool_length_mm: 150.0

      # Radius in mm of the rotation-invariant bounding cylinder used for the tool in the default tool model
      # i.e. the guard claims the tool occupies this much space in EVERY direction perpendicular to the
      # approach axis.
      # [default: 70.0]
      tool_radius_mm: 70.0

      # Radius in mm of the fixed vertical column the guard uses to represent the robot's own pedestal/base,
      # standing at the base-frame origin.
      # [default: 80.0]
      base_radius_mm: 80.0

      # Height in mm of that base column, measured from z=0 up to the mounting flange; it sets how tall the
      # no-go cylinder around the pedestal is.
      # [default: 150.0]
      base_height_mm: 150.0

      # Chooses HOW the end-effector is shaped for collision: 'capsule' is one fat cylinder along the
      # approach axis (yaw-blind), 'finger' is a thin capsule laid along the grasp's CLOSING axis, i.e. the
      # actual footprint of two descending jaws.
      # [default: capsule] [one of: capsule | finger]
      tool_model: capsule

      # Half-width in mm of the finger capsule perpendicular to the closing axis, how thick the jaws are
      # in their slim direction.
      # [default: 16.0]
      tool_finger_radius_mm: 16.0

      # Fingertip-to-fingertip distance in mm at full open; the finger capsule is centred on the TCP and
      # extends half this each way along the closing axis.
      # [default: 150.0]
      tool_finger_span_mm: 150.0

    # Tool / payload envelope.
    payload:

      # A coherent pair rather than the shipped "not measured yet" markers, for the same reason as above:
      # the console should exercise the happy path, not trip a guard that exists for real cells.
      # [default: true]
      enforce: true

      # The mass in kg of what is actually bolted to the flange (tool plus any carried workpiece). It is not
      # just validated on UR it is PUSHED into the controller at connect via RTDE setPayload, so it
      # directly changes the controller's own protective-stop/collision-detection thresholds.
      # [default: 0.0]
      mass_kg: 0.0

      # UR3e rated payload is 3 kg (UR5e: 5 kg).
      # [default: 5.0]
      max_mass_kg: 5.0

      # NOT [0, 0, 0]: that is the "not measured yet" marker, and pushing it would tell the controller a 1.5
      # kg tool is a point mass at the flange face.
      # [default: [0.0, 0.0, 0.0]]
      cog_mm: [0.0, 0.0, 0.0]

      # The diagonal inertia tensor (Ixx, Iyy, Izz) of the payload in kg*m^2. Despite sitting in the payload
      # block next to mass_kg and cog_mm, it is never sent to any controller and never enters any distance,
      # torque or motion computation. Nothing.
      # [default: [0.0, 0.0, 0.0]]
      inertia_kgm2: [0.0, 0.0, 0.0]

    # Step-size guard between consecutive commanded targets.
    motion_continuity:

      # A coherent pair rather than the shipped "not measured yet" markers, for the same reason as above:
      # the console should exercise the happy path, not trip a guard that exists for real cells.
      # [default: true]
      enforce: true

      # Largest per-axis joint change in degrees allowed between the PREVIOUS ACCEPTED target and the next
      # one. It is a mis-command tripwire, not a speed limit, it compares two commanded targets, not the
      # actual motion.
      # [default: 45.0]
      max_joint_step_deg: 45.0

      # Largest geodesic rotation in degrees between the previous accepted TCP orientation and the next
      # commanded one
      # [default: 30.0]
      max_orientation_step_deg: 30.0

      # Largest straight-line distance in mm between consecutive commanded TCP positions.
      # [default: 250.0]
      max_tcp_step_mm: 250.0

    # Post-Stop dwell + steady-state gating.
    dwell:

      # The sim's wait_until_steady STEPS the physics.
      # [default: true]
      require_steady_before_motion: true

      # How many seconds the execution policy will block on `arm.wait_until_steady()` before EVERY commanded
      # approach/grasp/retreat move, waiting for the controller to report it has stopped moving.
      # [default: 5.0]
      steady_timeout_s: 5.0

    # What the TRAJECTORY PLANNER is told about the cell, as axis-aligned boxes in the base frame.
    planning_world:

      # Whether the trajectory planner is told about your cell at all.
      # [default: false]
      enabled: false

      # The bench, table or floor the cell stands on, as one axis-aligned slab in the base frame.
      support_plane: null
      # Bench geometry in robot base frame (mm).
      # height_mm: measured top-surface height; slab extends downward by thickness_mm.
      # extent_mm: X/Y size, centred on robot base; must cover the reachable area.
      # thickness_mm: slab depth below the top surface; does not affect height_mm.
      # Only active when robot.safety.planning_world.enabled is true.
      # Defaults: height=0.0, extent=[2000.0, 2000.0], thickness=50.0.

      # Whether the planner is told that the gripper is CARRYING something.
      payload:

        # Whether the trajectory planner is told that the gripper is CARRYING something.
        # [default: false]
        enabled: false

        # Collision spheres the planner reserves for the carried part. 
        # [default: 16]
        sphere_slots: 16

        # How far the carried part extends along the approach axis, in mm.
        # [default: 120.0]
        length_mm: 120.0

        # Added to the jaw opening on both lateral axes when the carried part is described to the planner.
        # [default: 10.0]
        lateral_margin_mm: 10.0

      # Whether the fixture boxes under `self_collision.fixtures` are also handed to the planner.
      # [default: true]
      include_fixtures: true

      # What happens when the planner confirms fewer obstacles than it was sent.
      # [default: true]
      require_registration: true

    # Whether a PLANNED PATH is checked configuration by configuration before any of it is commanded.
    trajectory_check:

      # Whether a planned PATH is judged configuration by configuration before any of it is commanded.
      # [default: false]
      enabled: false

      # Check every n-th configuration of the path instead of all of them. 1, the default, checks the path;
      # anything above 1 SAMPLES it and leaves the skipped configurations unexamined, which is a latency
      # trade against safety and should be a deliberate one.
      # [default: 1]
      stride: 1

  # Vendor-neutral grasping-behaviour surface.
  grasping:

    # Selects one of five locked behaviour profiles that decide, for every pick: which sampling the
    # calculator uses (single-object / heuristic / dense point cloud), whether pre-grasp refinement and
    # post-grasp verification are REQUIRED, and the outer allow-list of recovery actions.
    # [default: auto]
    default_mode: auto

    # How many times the pick loop may re-perceive and re-try within a single pick() call before giving up.
    # [default: 5]
    max_attempts: 5

    # Which grasp generator ranks candidates. 'geometric' is the analytic stack; 'deep' is the learned 6-DoF
    # generator, which additionally takes the geometric candidates as seeds. Fails closed when 'deep' is
    # selected without weights.
    # [default: geometric] [one of: geometric | deep]
    calculator: geometric

    # When a silhouette is near-isotropic its principal axis is numerically degenerate, so aim the jaw along
    # the RADIAL direction (base -> grasp) instead of following the noise.
    # [default: false]
    isotropic_radial_closing: false

    # Opt-in JSONL path for production GraspAttemptRecord logging. When set,
    # AutonomousGraspService.from_robot_config / from_components call enable_record_logging(path), so every
    # pick() appends one record (the soak / KPI / RL data source).
    # [default: null]
    record_log_path: null

    # Pre-grasp refinement (closed-loop) knobs.
    closed_loop:

      # Whether closed-loop pre-grasp refinement is enabled.
      # [default: false]
      enabled: false

      # Whether the pre-grasp refinement takes a SECOND perception pass at the standoff pose.
      # [default: true]
      pregrasp_rescan: true

      # How far the second-scan grasp point may have moved from the first before the refiner calls it a
      # divergence. Above 20 mm of Euclidean displacement the whole attempt is ABANDONED with
      # REFINEMENT_DIVERGED it does not fall back to the original grasp.
      # [default: 20.0]
      max_position_correction_mm: 20.0

      # Angular tolerance on the same divergence check, in degrees.
      # [default: 15.0]
      max_orientation_correction_deg: 15.0

      # How much the commanded jaw opening may change between the first and the refined grasp. |refined -
      # initial| above 20 mm aborts the attempt with REFINEMENT_DIVERGED.
      # [default: 20.0]
      max_grip_width_correction_mm: 20.0

      # Minimum mask overlap the tracker must find in the second scan to accept a segmentation as the SAME
      # object it planned on. Below 0.3 the refiner reports TARGET_LOST and the attempt ends without a
      # grasp.
      # [default: 0.3]
      target_match_iou_threshold: 0.3

    # Post-grasp verification knobs.
    verification:

      # Wether post-grasp verification is enabled.
      # [default: false]
      enabled: false

      # What to do when the gripper's own object-present bit says 'I am holding nothing'.
      # [default: false]
      require_object_detected: false

      # The 'the jaws closed on air' margin, in millimetres above the gripper's physically-closed width.
      # [default: 2.0]
      width_delta_min_mm: 2.0

      # How far ABOVE the commanded close width the jaws may sit and still count as engaged, mm.
      # [default: 10.0]
      width_delta_max_mm: 10.0

      # Whether post-lift verification also LOOKS at the scene, instead of only asking the gripper.
      # [default: false]
      post_lift_vision_check: false

      # The IoU above which a post-lift segmentation counts as 'the target is still lying there', i.e. the
      # pick failed.
      # [default: 0.2]
      vision_displacement_iou_max: 0.2

      # What an UNMEASURABLE verification means. True (default) turns 'I could not tell' into a failed pick;
      # false lets an unverifiable pick be reported as a success.
      # [default: true]
      fail_closed: true

      # How to treat a verifier that could not MEASURE anything a gripper with no width feedback and no
      # object-detect capability returns INCONCLUSIVE, not FAILED.
      # [default: false]
      require_all_conclusive: false

    # Scene-recovery knobs (dense-clutter behaviour).
    dense_recovery:

      # Wether dense-recovery is enabled.
      # [default: false]
      enabled: false

      # Intended as the per-pick recovery budget, but it changes nothing: it is written into a
      # SceneRecoveryPolicy that no pick path reads, and unlike allowed_actions it is not even carried into
      # the telemetry snapshot
      # [default: 2]
      max_recovery_actions: 2

      # WHICH recovery to plan when a pick fails.
      # [default: active_perception] [one of: active_perception | next_target | none]
      strategy: active_perception

      # Names the recovery actions this cell is permitted to plan (rescan, next_viewpoint, next_target,
      # nudge_target, container_agitate).
      # [default: [next_viewpoint]] [one of: next_viewpoint | rescan | next_target | nudge_target | container_agitate]
      allowed_actions: [next_viewpoint]

    # Pre-execution decision-layer knobs.
    decision:

      # Wether the decision layer is enabled.
      # [default: false]
      enabled: false

      # The confidence bar the AUTO gate must clear to let a grasp execute.
      # [default: 0.4]
      auto_uncertainty_threshold: 0.4

      # How many times ONE pick() call may move the camera and look again before it has to either commit or
      # refuse. Default 2, so at most three perception rounds per pick
      # [default: 2]
      max_reobservations: 2

      # Extra uncertainty added when the ranking came back carrying failure reasons (e.g. candidates were
      # rejected for collision). With the default threshold 0.4 and penalty 0.2, a clean result needs
      # top_score >= 0.6 but a result with any reason attached needs >= 0.8.
      # [default: 0.2]
      reasons_penalty: 0.2

      # What the AUTO gate does when it is not confident and cannot re-observe (budget spent, or no
      # viewpoint planner). True = refuse the pick (FAIL_CLOSED); False = downgrade to "grasp anyway".
      # [default: true]
      fail_closed_on_real_hardware: true

    # Feasibility-aware ranking knobs.
    feasibility:

      # Wether the feasibility-aware ranking is enabled.
      # [default: false]
      enabled: false

      # How much the reachability axis counts in the final candidate score, alongside geometric 0.50 /
      # stability 0.35 / reachability 0.15 (all four are normalised by their sum).
      # [default: 0.0]
      weight: 0.0

      # The list of grasp modes in which this block is allowed to act. If default_mode is not in this tuple,
      # every feasibility key collapses to its OFF value - both in the runtime carrier and in the telemetry
      # snapshot regardless of enabled/weight.
      # [default: [auto, dense_clutter, dense_autonomous]]
      # [One of: auto, dense_clutter, dense_autonomous, easy, closed_loop]
      apply_modes: [auto, dense_clutter, dense_autonomous]

      # Adds a "how well-conditioned is the arm here" term to the ranking: each surviving candidate is
      # scored 100/(100 + Jacobian condition number), so near-singular poses get demoted.
      # [default: false]
      ik_quality_enabled: false

      # Share of the feasibility sub-score that the condition-number term gets, relative to the other
      # ENABLED sub-signals (they are normalised by their own sum, so only the ratio matters, not the
      # absolute value). At the defaults 0.4 vs 0.3 vs 0.3, condition number carries 4/7 when all three are
      # on and 100 % when it is the only one on.
      # [default: 0.4]
      ik_quality_weight: 0.4

      # Adds a "how far from a joint limit is this pose" term: score ramps linearly from 0 at 0 deg of
      # margin to 1.0 at 30 deg and clips there.
      # [default: false]
      joint_margin_enabled: false

      # Share of the feasibility sub-score given to the joint-limit-margin term, relative to the other
      # enabled sub-signals (normalised by their sum).
      # [default: 0.3]
      joint_margin_weight: 0.3

      # Meant to fold a swept approach/retreat clearance verdict into the ranking.
      # [default: false]
      swept_approach_enabled: false

      # Share of the feasibility sub-score given to the approach-clearance term.
      # [default: 0.3]
      swept_approach_weight: 0.3

      # Documented as the cap on how many top-ranked candidates get the expensive swept-approach validation.
      # [default: 5]
      swept_approach_top_k: 5

    # Occlusion and hidden-geometry knobs.
    occlusion:

      # Turns on the approach-corridor analyzer: for every surviving grasp candidate it marches the approach
      # (and retreat) axis through the depth map and stamps a blockage confidence in [0,1] on the candidate.
      # [default: false]
      directional_enabled: false

      # Intended to let a blocked corridor REFUSE a candidate outright rather than merely annotate it.
      # [default: false]
      hard_reject_enabled: false

      # Which grasp modes the corridor analyzer is allowed to run in.
      # [default: [auto, dense_clutter, dense_autonomous]]
      apply_modes: [auto, dense_clutter, dense_autonomous]

      # Radius of the cylinder swept along the approach axis when testing whether something stands in the
      # way, in mm.
      # [default: 20.0]
      corridor_radius_mm: 20.0

      # Sampling pitch of the march along the approach axis, in mm.
      # [default: 5.0]
      corridor_step_mm: 5.0

      # How far back from the grasp point the approach corridor is examined, in mm.
      # [default: 200.0]
      corridor_max_distance_mm: 200.0

      # How much the neighbour-segmentation-mask evidence counts against the raw depth evidence when the two
      # are combined: confidence = (1-w)*depth + w*mask.
      # [default: 0.5]
      mask_fusion_weight: 0.5

      # The confidence at which a corridor stops being labelled CLEAR and starts being labelled PARTIAL.
      # [default: 0.3]
      partial_confidence_threshold: 0.3

      # The confidence at which a corridor is labelled BLOCKED. Default 0.7.
      # [default: 0.7]
      hard_reject_confidence_threshold: 0.7

      # Documented as a cap on how many candidates get corridor-analyzed per pick, so that the depth march
      # cost stays bounded.
      # [default: 5]
      top_k: 5

    # Clutter-aware target-ordering knobs.
    ordering:

      # Whether clutter-aware target ordering is enabled.
      # [default: false]
      enabled: false

      # How much a candidate's ability to UNBLOCK other objects is worth relative to its own grasp score,
      # when choosing which object to pick first: priority = local_score + unlock_weight * unlock_score,
      # with unlock_score = the fraction of other objects this one blocks.
      # [default: 0.0]
      unlock_weight: 0.0

      # The safety bound on ordering: how much grasp quality you are willing to sacrifice to take a blocking
      # object first.
      # [default: 0.1]
      max_local_score_drop: 0.1

      # Which grasp modes the clutter-aware target ordering runs in.
      # [default: [auto, dense_clutter, dense_autonomous]]
      apply_modes: [auto, dense_clutter, dense_autonomous]

      # Per-signal blocker-graph flags.
      blocker_graph:

        # The strongest blocking signal: object A blocks B if A is in front of B (by depth, within
        # depth_tolerance_mm) AND A's segmentation mask, dilated by adjacency_radius_px, touches B's mask.
        # [default: false]
        mask_adjacency_enabled: false

        # The cheap, mask-free blocking signal: A blocks B if A is nearer the camera by more than
        # depth_tolerance_mm and their bounding boxes overlap.
        # [default: false]
        depth_only_enabled: false

        # A placeholder for a third blocking signal based on approach-corridor overlap.
        # [default: false]
        corridor_overlap_enabled: false

        # How many pixels one object's mask is grown by before testing whether it touches another's — i.e.
        # how close two objects must appear in the image to count as touching.
        # [default: 5]
        adjacency_radius_px: 5

        # How much nearer to the camera one object's centroid must be than another's before it counts as 'in
        # front of' it, in millimetres.
        # [default: 10.0]
        depth_tolerance_mm: 10.0

    # Recovery-orchestration knobs.
    recovery:

      # Whether recovery is enabled.
      # [default: false]
      enabled: false

      # How many recovery actions (re-scan, move the camera, nudge) the cell may take within one pick() call
      # after a failed attempt, each followed by a fresh pick attempt.
      # [default: 2]
      max_recovery_actions: 2

      # Which recovery actions this cell permits.
      # [default: []]
      # [Options: rescan, next_viewpoint, next_target, nudge_target, container_agitate]
      allowed_actions: []

      # A per-action cap, given as (action, count) pairs, on top of the global max_recovery_actions e.g.
      # allow at most one next_viewpoint per pick while still permitting several rescans.
      # [default: []]
      per_action_budget: []

      # Which grasp modes the recovery orchestrator wraps.
      # [default: [auto, dense_clutter, dense_autonomous]]
      apply_modes: [auto, dense_clutter, dense_autonomous]

      # Operator-bounded envelope for physical recovery actions.
      fixture: null
      # Recovery action envelope in robot base frame (mm).
      # center_mm: box centre.
      # half_extents_mm: half-size per axis; box spans centre +/- extents.
      # max_nudge_mm: maximum displacement per nudge.
      # Required for physical recovery actions (nudge_target/container_agitate).
      # Only active when robot.grasping.recovery.enabled is true.


    # Uncertainty fusion + calibration layer.
    uncertainty:

      # Whether the uncertainty fusion layer is enabled.
      enabled: false

      # The fused-uncertainty level at or above which the decision layer refuses to grasp.
      # [default: 0.4]
      fail_closed_threshold: 0.4

      # Which grasp modes the uncertainty fusion layer is active in.
      # [default: [auto, dense_clutter, dense_autonomous]]
      apply_modes: [auto, dense_clutter, dense_autonomous]

      # Per-channel weights for the uncertainty fusion layer.
      weights:

        # Share of the fused uncertainty attributed to how confident the depth map is.
        # [default: 1.0]
        depth_confidence: 1.0

        # Share of the fused uncertainty attributed to how confident the segmentation masks are.
        # [default: 1.0]
        mask_confidence: 1.0

        # Share of the fused uncertainty attributed to approach-corridor blockage.
        # [default: 1.0]
        occlusion_corridor_risk: 1.0

        # Share of the fused uncertainty attributed to how much reachability margin the winning grasp has.
        # [default: 1.0]
        feasibility_margin: 1.0

        # Share of the fused uncertainty attributed to how far past verifications missed.
        # [default: 1.0]
        verification_residual: 1.0

        # Optional eighth-of-the-picture channel for scene-topology risk (interlocked / tangled parts).
        # [default: 0.0]
        topology_risk: 0.0

        # Optional channel for how sure the detector is that it found the object the prompt asked for.
        # [default: 0.0]
        semantic_confidence: 0.0

      # How much fused uncertainty is subtracted from the scene's top score before the decision gate judges
      # it: penalised = top_score - weight*fused, clamped to [0,1].
      # [default: 0.0]
      ranking_penalty_weight: 0.0

      # The fused-uncertainty level above which the recovery planner reorders its action list to prefer
      # LOOKING AGAIN (rescan, next viewpoint) over other recoveries.
      # [default: 1.01]
      recovery_aggressive_threshold: 1.01

      # Records when the uncertainty channels contradict each other: the spread max(remapped)-min(remapped)
      # across the channels that reported, flagged when it reaches this value.
      # [default: 1.01]
      channel_disagreement_threshold: 1.01

      # Meant to point at a JSON artifact holding the per-channel monotone remapping curves. Nothing loads
      # it.
      # [default: null]
      calibration_artifact_path: null

      # Turns on the per-candidate uncertainty re-rank, which re-sorts the candidate list by score -
      # rerank_weight * corridor_risk after the success-model blend.
      # [default: false]
      rerank_enabled: false

      # How heavily an obstructed approach corridor counts against a candidate's geometric score: adjusted =
      # score - weight * corridor_risk, with corridor_risk in [0,1].
      # [default: 0.0]
      rerank_weight: 0.0

      # The grasp modes the per-candidate uncertainty re-rank may reorder in.
      # [default: [dense_clutter, dense_autonomous]]
      rerank_modes: [dense_clutter, dense_autonomous]

    # Success-probability overlay (default off).
    success_model:

      # Whether the success model is enabled.
      # [default: false]
      enabled: false

      # Directory holding the trained success predictor's model.json and manifest.json.
      # [default: assets/models/success_probability/v1]
      artifact_dir: assets/models/success_probability/v1

      # Named as the modes the predictor may score in, and it does bound ranking_blend_modes (the validator
      # requires the blend modes to be a subset).
      # [default: [easy, auto, dense_clutter, dense_autonomous]]
      apply_modes: [easy, auto, dense_clutter, dense_autonomous]

      # Lets the learned success probability actually REORDER candidates, via final = (1-w)*geometric +
      # w*predicted_p.
      # [default: false]
      ranking_blend_enabled: false

      # How much the learned probability is allowed to move the ranking against the geometric score.
      # [default: 0.2]
      ranking_blend_weight: 0.2

      # The grasp modes in which the learned blend may reorder.
      # [default: [dense_clutter, dense_autonomous]]
      ranking_blend_modes: [dense_clutter, dense_autonomous]

      # 'shadow' (default) = the learned success predictor runs but its output is
      # discarded (byte-identical to the no-blend path). 'canary'/'active' let the bounded blend REORDER
      # candidates in the dense modes; both REQUIRE a valid promotion.json (verify_promotion: SHA-chain +
      # verdict='pass' + thresholds not weaker than plan-locked + the plan-locked validation slice + metrics
      # that agree with the recorded bounds) or the model load fails CLOSED to None (no blend).
      # [default: shadow]
      # [one of: shadow | canary | active]
      lifecycle_phase: shadow

    # Drift + OOD watchdog runtime knobs.
    watchdog:

      # Watchdog mode for drift and out-of-distribution monitoring. 'shadow' runs the monitors but does not
      # affect the robot's behavior. 'active' allows the monitors to influence decisions. 'disabled' turns
      # off the watchdog entirely.
      mode: shadow

      # How many recent pick attempts the drift monitors look at, in attempts.
      # [default: 20]
      window_size: 20

      # How many samples must be in the window before a trend monitor is allowed to say anything but 'none'.
      # Guards against calling drift off two attempts.
      # [default: 6]
      min_samples_for_trend: 6

      # First rung of the predicted-vs-observed pose-error ladder, in mm: the latest attempt's |predicted
      # target pose - observed target pose| at or above this reads MODERATE, which recommends re-observing
      # rather than blocking.
      # [default: 2.0]
      calibration_delta_moderate_mm: 2.0

      # Second rung of the same pose-error ladder, in mm: at or above this the watchdog recommends
      # BLOCK_AUTO. Default 5.0 mm.
      # [default: 5.0]
      calibration_delta_high_mm: 5.0

      # Top rung of the pose-error ladder, in mm.
      # [default: 10.0]
      calibration_delta_severe_mm: 10.0

      # First rung for 'the depth sensor is getting worse': the DROP in mean depth confidence between the
      # older and the newer half of the window, in confidence units [0,1].
      # [default: 0.05]
      depth_confidence_shift_moderate: 0.05

      # Second rung of the depth-degradation ladder, in confidence units.
      # [default: 0.1]
      depth_confidence_shift_high: 0.1

      # Top rung of the depth-degradation ladder, in confidence units.
      # [default: 0.2]
      depth_confidence_shift_severe: 0.2

      # First rung of the only drift monitor that actually has a live producer: the FRACTION of recent
      # attempts on which the decision engine refused to grasp.
      # [default: 0.3]
      fail_closed_rate_moderate: 0.3

      # Second rung of the fail-closed-rate ladder: at or above 0.50 (default) half the recent attempts
      # refused, the watchdog recommends BLOCK_AUTO.
      # [default: 0.5]
      fail_closed_rate_high: 0.5

      # Top rung of the fail-closed-rate ladder, default 0.75.
      # [default: 0.75]
      fail_closed_rate_severe: 0.75

      # First rung for a hand-eye calibration that is drifting: the GROWTH in mean calibration residual from
      # the older half of the window to the newer half, in mm.
      # [default: 1.0]
      hand_eye_residual_trend_moderate_mm: 1.0

      # Second rung of the hand-eye drift ladder, in mm of growth across the window.
      # [default: 3.0]
      hand_eye_residual_trend_high_mm: 3.0

      # Top rung of the hand-eye drift ladder, default 7.0 mm of growth across the window.
      # [default: 7.0]
      hand_eye_residual_trend_severe_mm: 7.0

      # First rung for post-grasp verification errors creeping upward: the growth in mean verification
      # residual between the older and newer half of the window, in mm.
      # [default: 0.5]
      verification_residual_trend_moderate_mm: 0.5

      # Second rung of the verification-residual ladder, default 2.0 mm of growth; recommends blocking AUTO.
      # [default: 2.0]
      verification_residual_trend_high_mm: 2.0

      # Top rung of the verification-residual ladder, default 5.0 mm of growth across the window.
      # [default: 5.0]
      verification_residual_trend_severe_mm: 5.0

      # First rung of the out-of-distribution ladder, and note the ladder runs BACKWARDS: ood_score is a
      # validity score where 1.0 means firmly in-distribution and 0.0 means far outside, so severity rises
      # as the number falls
      # [default: 0.5]
      ood_score_moderate: 0.5

      # Second rung of the inverted OOD ladder: a validity score at or below 0.3 (default) recommends
      # blocking AUTO. Lower value = stricter alarm threshold, the opposite of every other ladder in this
      # block, this is the usual place to misconfigure it.
      # [default: 0.3]
      ood_score_high: 0.3

      # Bottom rung of the inverted OOD ladder, default 0.1, a scene the model considers almost entirely
      # unlike anything it was calibrated on.
      # [default: 0.1]
      ood_score_severe: 0.1

      # Which grasp modes the watchdog is allowed to actually STOP, as opposed to merely report on.
      # [default: [auto]]
      block_modes: [auto]

    # Runtime SLO budgets and bounded-compute knobs.
    performance:

      # Whether performance monitoring is enabled.
      # [default: false]
      enabled: false

      # The p95 budget for the decision stage, in milliseconds, measured over a rolling window of picks.
      # [default: 60.0]
      decision_latency_slo_ms: 60.0

      # The p95 budget for the candidate-ranking stage, in milliseconds.
      # [default: 80.0]
      ranking_latency_slo_ms: 80.0

      # The p95 budget for the multi-view fusion / attempt-execution stage, in milliseconds.
      # [default: 220.0]
      fusion_latency_slo_ms: 220.0

      # A hard per-stage cap the decision stage was meant to be aborted at.
      # [default: 0.0]
      decision_timeout_ms: 0.0

      # Same story as decision_timeout_ms, for the ranking stage: declared, plumbed into telemetry, never
      # enforced
      # [default: 0.0]
      ranking_timeout_ms: 0.0

      # Same story as the other two timeouts, for the fusion stage: declared, plumbed into telemetry, never
      # enforced. 0.0 default = no cap; a non-zero value must not exceed fusion_latency_slo_ms or the config
      # refuses to load.
      # [default: 0.0]
      fusion_timeout_ms: 0.0

      # Declares how the cell should degrade if the success-probability model blows its timeout:
      # 'legacy_score' revert to geometry-only ranking, 'skip' drop the probability signal, 'fail_closed'
      # refuse the pick.
      # [default: legacy_score]
      model_fallback_policy: legacy_score

      # Declares how the cell should degrade if fusion blows its timeout: 'skip' proceed on single-view
      # evidence, or 'fail_closed'.
      # [default: skip]
      fusion_fallback_policy: skip

      # Whether a rising-edge p95 SLO breach actually fires a RobotWatchdogEvent.SLO_BREACH to the
      # subscribed listener.
      # [default: false]
      emit_breach_events: false

      # How many picks the in-process p95 is computed over before any breach can be declared, in attempts.
      # [default: 32]
      breach_window_size: 32

    # Bounded multi-view fusion substrate config.
    fusion:

      # Whether the bounded multi-view fusion substrate is enabled.
      enabled: false

      # Maximum number of accepted views retained simultaneously.
      # [default: 6]
      max_views: 6

      # Accepted views older than this are dropped on the next ingest (wall-clock relative to the newest
      # accepted view).
      # [default: 20.0]
      max_view_age_s: 20.0

      # Cubic voxel edge length in millimetres.
      # [default: 6.0]
      voxel_size_mm: 6.0

      # Total X/Y/Z extent (mm) of the fusion ROI, centered on the workspace origin.
      # [default: [600.0, 600.0, 360.0]]
      roi_extent_mm: [600.0, 600.0, 360.0]

      # Hard cap on total voxel count (``roi_x/voxel_size * roi_y/voxel_size * roi_z/voxel_size``).
      # [default: 1000000]
      max_voxels: 1000000

      # Minimum valid depth sample (mm).
      # [default: 80.0]
      depth_min_mm: 80.0

      # Maximum valid depth sample (mm).
      # [default: 1400.0]
      depth_max_mm: 1400.0

      # Absolute tolerance for per-element intrinsic-matrix drift between views (strict frame contract).
      # [default: 1e-06]
      intrinsics_atol: 1e-06

      # Mandatory dense multi-view commit gate.
      commit_policy:

        # Whether the commit gate is enabled.
        enabled: false

        # Minimum number of accepted views that must already be fused before the orchestrator may commit a
        # candidate to execution.
        # [default: 2]
        min_views_accepted: 2

        # Minimum fraction of voxels inside the candidate's approach corridor that must be marked hit in the
        # fusion grid. 0.0 disables the corridor check (views-only gate).
        # [default: 0.3]
        min_corridor_hit_fraction: 0.3

        # Radius (mm) of the cylindrical capsule around the candidate's approach line used for corridor
        # evidence.
        # [default: 25.0]
        corridor_radius_mm: 25.0

        # Length (mm) of the corridor capsule along the candidate's approach vector, anchored at the grasp
        # position and extending opposite the approach (i.e. into the camera-viewing volume where evidence
        # should accumulate).
        # [default: 120.0]
        corridor_length_mm: 120.0

        # Per-pick budget of additional perception captures triggered when the gate refuses. After
        # exhaustion the pick surfaces NO_COMMIT_INSUFFICIENT_FUSION.
        # [default: 1]
        max_reobserve_attempts: 1

        # Mode labels that activate the gate
        # [default: [auto, dense_clutter, dense_autonomous]]
        apply_modes: [auto, dense_clutter, dense_autonomous]

      # Read-side wiring switch.
      # [default: false]
      active_perception_use_fusion: false

      # Path to a persisted eye-to-hand Extrinsics JSON artifact (CAMERA -> BASE), as written by
      # ``src.calibration.serialization.save_extrinsics``.
      # [default: null]
      extrinsics_artifact_path: null

      # One camera's calibration entry in the central ``fusion.cameras`` map.
      # Empty. Each entry under `cameras:` is keyed by YOUR name for the thing (a rig id, say) and holds a
      # full block; the index lists its keys.
      cameras: {}

      # Fuse each object's SURFACE across the fixed cameras, and feed that to the grasp generator.
      geometry:

        # Top-level switch. False (default) = the generator sees one view per object, exactly as before --
        # byte-identical. Independent of ``fusion.enabled`` (the shadow voxel substrate).
        # [default: false]
        enabled: false

        # How 'the same object' is scored across cameras.
        # [default: overlap]
        # [one of: overlap | box_iou | centroid]
        metric: overlap

        # Match score a camera must clear to contribute.
        # [default: 0.3]
        min_score: 0.3

        # How near two points count as the same surface, for the `overlap` metric.
        # [default: 12.0]
        neighbour_mm: 12.0

        # Decimate each cloud to one point per this many mm BEFORE the association SCORING ONLY.
        # [default: 0.0]
        score_voxel_mm: 0.0

        # Distance at which the `centroid` metric scores 0.
        # [default: 150.0]
        max_centroid_mm: 150.0

        # What to do when a configured camera delivers no frame this pick (unplugged, dropped trigger, dirty
        # lens).
        # [default: degrade]
        # [one of: degrade | refuse]
        on_camera_unavailable: degrade

        # Provide each object with other cameras' scene points for collision filtering.
        # [default: false]
        neighbour_scene_enabled: false

        # Voxel size the fused neighbour cloud is thinned to.
        # [default: 8.0]
        neighbour_voxel_mm: 8.0

    # Dense-mode swept-volume approach/retreat validation.
    approach_validation:

      # Whether the approach validator is enabled.
      enabled: false

      # Pre-grasp standoff (mm) along -approach; the sweep is sampled standoff -> grasp.
      # [default: 80.0]
      standoff_mm: 80.0

      # Retreat distance (mm) after the grasp; the retreat leg is swept along +Z.
      # [default: 100.0]
      retreat_mm: 100.0

      # Swept samples on the approach leg (0 disables the approach check).
      # [default: 6]
      num_approach_samples: 6

      # Swept samples on the retreat leg (0 disables the retreat check).
      # [default: 4]
      num_retreat_samples: 4

      # Extra margin (mm) added to the swept gripper box when testing collisions.
      # [default: 0.0]
      collision_margin_mm: 0.0

      # Mode labels that activate the validator (the dense modes by default).
      # [default: [dense_clutter, dense_autonomous]]
      apply_modes: [dense_clutter, dense_autonomous]

    # The learned 6-DoF grasp GENERATOR the thing `grasping.calculator: deep` selects.
    deep_generator:

      # Path to the generator's `.pt`, written by `python -m src.robot.grasping.deep train`.
      # [default: null]
      artifact_path: null

      # Torch device for inference.
      # [default: null]
      device: null

      # Which JAW_GEOMETRY hand this cell has, for the deep generator's conditioning vector.
      # [default: null]
      gripper: null

      # Points below this graspability score are never seeded.
      # [default: 0.5]
      minimum_score: 0.5

    # The learned grasp ranker, in SHADOW: it computes, the telemetry records, the order never changes.
    deep_ranker:

      # Score every candidate with the learned ranker and record what it would have chosen.
      # [default: false]
      enabled: false

      # Where the fitted ranker lives
      # [default: assets/models/grasp_ranker/v1]
      artifact_dir: assets/models/grasp_ranker/v1

      # Which feature contract to score under.
      # [default: held_jaw_v1]
      spec: held_jaw_v1

    # Where the surface is that the parts stand on, the input the table-clearance check never had.
    support:

      # The workspace surface in BASE mm of the table.
      # instead when it is given.
      # [default: 0.0]
      height_mm: 0.0

      # Surface normal in BASE. Non-vertical describes a tilted tray or a slope; the closing-axis levelling
      # and the clearance check both honour it.
      # [default: [0.0, 0.0, 1.0]]
      normal: [0.0, 0.0, 1.0]

      # Raise the declared height to the target's own lowest fused point when that is higher the only way
      # to know an object is standing on ANOTHER object.
      # [default: true]
      refine_from_target: true

      # OPTIONAL bin / tray / KLT the objects sit inside. Everything here defaults to "no container".
      container:

        # Height in BASE mm of the surface INSIDE the container that parts rest on.
        # [default: null]
        floor_height_mm: null

        # Lower corner of the container's INTERIOR box in BASE mm (x, y, z) the empty volume you could
        # pour parts into.
        # [default: null]
        interior_min_mm: null

        # Upper corner of the container's INTERIOR box in BASE mm (x, y, z).
        # [default: null]
        interior_max_mm: null

        # Treat the four vertical walls of that interior box as collision geometry: they are sampled into
        # points and appended to what the candidate filter already checks against.
        # [default: false]
        wall_collision_enabled: false

        # How far OUTWARD from each interior face the wall material is sampled.
        # [default: 5.0]
        wall_thickness_mm: 5.0

        # Point spacing on the sampled walls.
        # [default: 8.0]
        wall_sample_mm: 8.0

      # How far the gripper envelope must stay above the support surface
      # [default: 5.0]
      min_clearance_mm: 5.0

    # Which geometry stage proposes grasp candidates.
    geometry:

      # Which stage proposes candidates.
      # [default: support_footprint]
      # [one of: support_footprint | silhouette]
      stage: support_footprint

      # Push every reconstructed face outward by this much.
      # [default: 0.0]
      inflate_mm: 0.0

    # Which gripper collision envelope the calculator filters grasp candidates against.
    gripper_geometry:

      # Chooses WHICH collision envelope every grasp candidate is filtered against: a two-finger + palm box
      # model (parallel_jaw) or a cup + shaft + wrist-mount box model (suction).
      # [default: parallel_jaw]
      # [one of: parallel_jaw | suction]
      kind: parallel_jaw

      # A safety skin inflating every box of the chosen envelope outward on all six sides, in millimetres.
      # [default: 0.0]
      outer_margin_mm: 0.0

      # Parallel-jaw collision envelope (mm) in the local grasp frame (X closes, Y binormal, Z approach).
      parallel_jaw:

        # How far each finger box extends BACKWARD from the grasp centre along -approach (toward the wrist),
        # and therefore where the palm box begins.
        # [default: 39.98]
        finger_length_mm: 39.98

        # How far each finger sticks OUTWARD from its contact face, in the closing direction: each finger
        # box runs from half the grip width out to half-width + 31.35 mm.
        # [default: 31.35]
        finger_thickness_mm: 31.35

        # The finger's extent along the binormal (the axis perpendicular to both the closing direction and
        # the approach): each finger box spans +/- 13.5 mm about the grasp centre.
        # [default: 27.0]
        finger_width_mm: 27.0

        # How far the finger box is allowed to reach INTO the jaw opening, past its own contact plane - the
        # modelled squeeze of a compliant pad.
        # [default: 2.0]
        finger_pad_overlap_mm: 2.0

        # How far the finger reaches PAST the grasp centre along the approach - i.e. toward the object and
        # the surface it stands on.
        # [default: 28.72]
        fingertip_depth_mm: 28.72

        # The CONTACT PATCH along the approach -- the part of the finger that actually touches.
        # [default: 38.0]
        pad_length_mm: 38.0

        # How far the patch reaches IN FRONT of the grasp centre.
        # [default: 23.61]
        pad_ahead_mm: 23.61

        # Thickness of the palm block sitting behind the fingers: the palm box runs from finger_length_mm to
        # finger_length_mm + 35.0 mm back along -approach, so with the defaults the envelope reaches ~75 mm
        # behind the grasp centre.
        # [default: 35.0]
        palm_depth_mm: 35.0

        # The palm's extent along the binormal, +/- 35.0 mm about the grasp axis - deliberately wider than
        # the fingers (27 mm), because the palm is the widest part of the tool.
        # [default: 70.0]
        palm_width_mm: 70.0

      # Suction-cup collision envelope (mm): cup, then shaft, then wrist mount back along -approach.
      suction:

        # Half-width of the square box that bounds the cup (a box circumscribing the circle, to stay
        # conservative).
        # [default: 15.0]
        cup_radius_mm: 15.0

        # How far the cup body extends back from the contact point along -approach before the shaft begins:
        # 25.0 mm.
        # [default: 25.0]
        cup_height_mm: 25.0

        # The only part of the suction envelope that sits IN FRONT of the grasp point: 2.0 mm of cup lip
        # modelled as protruding past the contact surface along +approach.
        # [default: 2.0]
        contact_tip_depth_mm: 2.0

        # Half-width of the box bounding the tube between cup and wrist mount: 10.0 mm, i.e. a 20 mm cross-
        # section, narrower than the cup.
        # [default: 10.0]
        shaft_radius_mm: 10.0

        # Length of that tube along -approach: 40.0 mm.
        # [default: 40.0]
        shaft_length_mm: 40.0

        # Half-width of the wrist coupler box, 30.0 mm - the WIDEST part of the suction envelope, twice the
        # cup.
        # [default: 30.0]
        mount_radius_mm: 30.0

        # How far back the wrist coupler extends along -approach: 20.0 mm, which is where the modelled tool
        # ends.
        # [default: 20.0]
        mount_depth_mm: 20.0

  # RL optimisation extension layer.
  rl:

    # RL mode selection. Determines how the robot uses reinforcement learning policies.
    # [Default: hybrid_ml]
    # [Options: geometry_only, hybrid_ml, rl_shadow, rl_active, rl_experimental.]
    mode: hybrid_ml

    # The RL policy the operator DECLARES this cell is running.
    # [default: null]
    policy_id: null

    # Overrides which CANDIDATE policy artifact the shadow router loads; unset means the committed baseline
    # docs/baselines/rl_policies/v2_candidate_baseline_v1.json
    # [default: null]
    artifact_path: null

    # Overrides the RANKING policy artifact the shadow router loads; unset falls back to the committed
    # docs/baselines/rl_policies/v3_ranking_baseline_v1.json.
    # [default: null]
    ranking_artifact_path: null

    # Overrides the SEQUENCING policy artifact for the shadow router; unset uses
    # docs/baselines/rl_policies/v4_sequencing_baseline_v1.json.
    # [default: null]
    sequencing_artifact_path: null

    # Overrides the PERCEPTION-BUDGET (LinUCB) policy artifact for the shadow router; unset uses
    # docs/baselines/rl_policies/v5_perception_budget_baseline_v1.json.
    # [default: null]
    perception_artifact_path: null

    # Overrides the RECOVERY policy artifact for the shadow router; unset uses the committed recovery
    # baseline.
    # docs/baselines/rl_policies/v6_recovery_baseline_v1.json.
    # [default: null]
    recovery_artifact_path: null

    # ``rl_experimental`` lane carrier.
    experimental:

      # Whether the experimental RL lane is enabled.
      # [default: false]
      enabled: false

    # Learner runtime tier.
    # [default: stdlib]
    # [one of: stdlib | numpy | torch]
    runtime_tier: stdlib

    # Tier-0 online learning (shadow-only, zero grasp influence). Requires an RL mode.
    # [default: false]
    online_update_enabled: false
