# ============================================================================
# robot/robot.yaml — every key, with what it does
# ============================================================================

robot:

  # Picks which arm driver gets built, and is validated at config-load against the RobotVendor enum.
  # [default: ur] [one of: ur | sim | dummy]
  vendor: ur

  # UR-specific connection settings.
  ur:

    # Which UR this cell drives.
    # [default: ur5e] [one of: ur3e | ur5e | ur10e]
    model: ur5e

    # The address of the UR controller. It has no default: a cell says where its controller is, and the cell lock holds
    # the cell by this name (ur@<address>). A tree that drives a UR and names none is refused at connect.
    # [default: none]
    ip: 192.168.1.100

    # RTDE update rate in Hz. Please refer to the UR documentation for recommended values.
    # Dont use 0.0 because it may cause synchronization issues with the UR controller.
    # [default: 0.0] 
    rtde_frequency: 0.0

  # Isaac-Sim (or pure-Python mock) driver settings.
  sim:

    # Which simulation backend to use. Currently, only 'isaac' is supported.
    # [default: isaac]
    backend: isaac

    # Whether the simulation backend is enabled. Set to true to activate Isaac Sim; false keeps it disabled.
    # [default: false]
    enabled: false

    # Master switch between a real Isaac Sim boot and a pure-Python kinematic stand-in.
    # [default: false]
    mock_mode: false

    # Which UR the sim cell drives is validated against the Lula solver configuration.
    # [default: ur5e] [one of: ur3e | ur5e | ur10e]
    robot_model: ur5e

    # USD stage to open at session start instead of creating an empty one
    # [default: null]
    scene: null

    # Combined UR5e + Robotiq 2F-85 articulation (one root prim); gripper shares the same prim.
    # [default: null]
    robot_prim_path: null

    # Prim path of the articulation that owns the gripper's driven joint. For the shipped combined UR5e
    # asset this is the SAME prim as robot_prim_path ("/World/UR5e") because the 2F-85 is a baked variant of
    # the one 12-DoF articulation, not a separate body.
    # [default: null]
    gripper_prim_path: null

    # Where `move_home()` sends this arm.
    # We used:
    #         UR3e: z = 561.9 mm and r = 466.9 mm
    # [default: null]
    home_joint_positions: null

    # The same home in DEGREES, one per joint. Give home_joint_positions or this, not both; the
    # loaded config carries it in radians.
    # [default: null]
    home_joint_positions_deg: null

    # The cameras authored into the sim scene, keyed by YOUR name for each one. They are not rigs
    # of the camera section, so they declare no calibration in config and are not fused as rigs are:
    # `run_multiview_pick --calibrated` reads each
    # fixed camera's `eth_<name>.json`, written by `run_eth_calibrate --camera <name>`, in code.
    # [default: {}]
    #
    #   cameras:
    #     overhead:
    #       # Where the camera prim is authored in the stage. Empty means the scene builder places it.
    #       prim_path: ""
    #       # Fixed to the cell or bolted to the wrist. It decides which of the two mount blocks below
    #       # is read: position_mm for a fixed camera, mount_* for one on the flange.
    #       # [one of: eye_to_hand | eye_in_hand]
    #       mounting_mode: eye_to_hand
    #       # Near clip in metres. Null keeps Isaac's own. It is load-bearing on a wrist camera,
    #       # where it is what hides the gripper from its own view.
    #       near_clip_m: null
    #       # Pixels, [width, height]. Null keeps Isaac's default.
    #       resolution: null
    #       # Horizontal field of view in degrees, meaning the FOV of the real sensor this camera
    #       # stands in for: a RealSense D435 RGB stream is 69.4. Null keeps Isaac's lens, which is
    #       # narrower and frames less of the table than the real cell does, a silent sim-to-real gap.
    #       hfov_deg: null
    #       # Fixed cameras only: where it sits in the world, in mm. Null means authored elsewhere.
    #       position_mm: null
    #       # Wrist cameras only: the mount in the wrist link's own frame, in mm.
    #       mount_offset_mm: null
    #       # Wrist cameras only: the point the camera looks at, in mm.
    #       mount_aim_mm: null
    #       # Wrist cameras only: which way is up for the mount, as a direction.
    #       mount_up_hint: null
    cameras: {}

    # The fixed simulator timestep in seconds, used for BOTH physics and rendering (1/60 s by default).
    # [default: 0.016666666666666666]
    step_dt_s: 0.016666666666666666

    # How long (in sim seconds) the driver waits for the arm to go steady after a motion before giving up
    # and returning MotionStatus.TIMEOUT.
    # [default: 5.0]
    settle_timeout_s: 5.0

    # Whether Isaac boots without a viewport window
    # [default: true]
    headless: true

    # Filesystem or Omniverse root of the Isaac asset pack that USD references are resolved against the
    # robot USD, the YCB/GSO meshes, the KLT bin.
    # [default: null]
    assets_root: null

    # Which suction-cup geometry to mount for a suction pick a key in willy_sim.grippers.SUCTION_CUPS
    # ("slim" is the finer cup that reaches into tighter gaps).
    # [default: null]
    suction_cup: null

    # The park pose (arm swung clear of the overhead camera before perceiving) is inherited from the UR5e
    # layer as [3.14, -1.0, 0.9, 0, 0, 0].
    # [default: null]
    park_joint_positions: null

    # Willy-sim scene-authoring + experiment params (read by src.willy_sim only).
    scene_setup:

      # Graspable object authored into the sim scene (willy_sim scene-authoring).
      object:

        # The human-readable label attached to this object when the scene is authored.
        # [default: cube]
        name: cube

        # The shape of the object to spawn in the simulation.
        # [default: cube] [one of: cube, cylinder]
        shape: cube

        # Extents of the spawned primitive in mm.
        # [default: [30.0, 30.0, 50.0]]
        size_mm: [30.0, 30.0, 50.0]

        # Follows the scene to its new anchor (nadir over the object).
        # [default: [450.0, 0.0, 25.0]]
        position_mm: [450.0, 0.0, 25.0]

        # Rigid-body mass in kilograms (default 0.05 = 50 g)
        # [default: 0.05]
        mass_kg: 0.05

        # Static friction coefficient of the shared grip PhysicsMaterial (default 1.5 - deliberately high so
        # a parallel-jaw close holds rather than squirts the object out).
        # [default: 1.5]
        static_friction: 1.5

        # Sliding-friction coefficient of the same single shared grip material (default 1.3, just under
        # static so an object that starts sliding keeps sliding slightly more easily).
        # [default: 1.3]
        dynamic_friction: 1.3

        # RGB in the 0-1 range (NOT 0-255) painted onto the spawned primitive.
        # [default: [0.9, 0.2, 0.1]]
        color: [0.9, 0.2, 0.1]

        # Switches this object from a procedural primitive to a referenced USD mesh (a YCB or converted GSO
        # asset), which makes shape/size_mm/color inert.
        # [default: null]
        usd_asset_path: null

        # Spawn orientation as a WXYZ quaternion in the world frame (note the ordering the rest of this
        # codebase uses XYZW; this key follows Isaac's convention).
        # [default: null]
        orientation_wxyz: null

        # Authors PhysX collision onto a referenced mesh that ships without any, turning a decorative mesh
        # into a graspable rigid body.
        # [default: null]
        usd_collision_approximation: null

      # Graspable object authored into the sim scene (willy_sim scene-authoring).
      # No entries. Each item under `objects:` is a complete block; see the index for its keys.
      objects: []

      # Static table authored into the sim scene.
      table:

        # Size of the static table slab in mm (width, depth, height).
        # [default: [800.0, 800.0, 400.0]]
        size_mm: [800.0, 800.0, 400.0]

        # Position of the static table slab in mm (x, y, z).
        # [default: [450.0, 0.0, -200.0]]
        position_mm: [450.0, 0.0, -200.0]

      # Dedicated hand-eye calibration marker. Marker length + ArUco dict come from
      # ``camera.hand_eye.eye_in_hand`` (single source of truth); this block holds placement + kind.
      marker:

        # Whether a dedicated hand-eye calibration target is authored, and of what sort. "none" (default) =
        # no marker prim at all, and SceneHandles.marker_prim_path comes back None, which makes ground-truth
        # EIH calibration refuse to run. "flat" = a plain white plate (the ground-truth calibration
        # plumbing). "aruco" = a detectable ArUco board built from solid-colour geometry (perception-based
        # calibration).
        # [default: none] [one of: none | flat | aruco]
        kind: none

        # Position of the hand-eye calibration marker in mm (x, y, z).
        # [default: [450.0, -150.0, 6.0]]
        position_mm: [450.0, -150.0, 6.0]

        # Size of the flat calibration plate in mm (width, depth, height).
        # [default: [80.0, 80.0, 10.0]]
        flat_size_mm: [80.0, 80.0, 10.0]

        # Edge length in mm of the WHITE BASE PLATE the ArUco pattern is printed on not the marker itself.
        # [default: 72.0]
        aruco_plate_size_mm: 72.0

        # Which ArUco id from the configured dictionary (DICT_4X4_50) is generated onto the plate.
        # [default: 0]
        aruco_marker_id: 0

      # Pick/lift gate thresholds for the sim validation runners.
      gate:

        # How far the target object's centre must actually RISE, in mm, for one run to count as a successful
        # pick.
        # [default: 50.0]
        lift_threshold_mm: 50.0

        # What fraction of runs must pass for the whole gate to pass, default 0.8 (8 of 10)
        # [default: 0.8]
        pass_fraction: 0.8

      # How many rendered simulation steps to pump before reading an image, so the RTX renderer and the
      # RGB/segmentation annotators have actually populated their buffers - too few and you get a black
      # frame or an empty mask that reads as a perception failure.
      # [default: 20]
      render_warmup_steps: 20

  # Settings for the in-process dummy driver.
  dummy: {}

  # How this cell's motions are planned, whichever arm drives them, and when the next leg of a pick or a place is
  # judged: as it runs, or ahead while the arm waits or moves.
  motion:

    # How a motion gets from A to B. curobo plans a collision-free trajectory in the isolated planner process and
    # needs its environment set up and a GPU; ik is the controller's straight line, which knows nothing about the
    # cell. curobo fails closed: with no planner a move is refused, never run blind. It was robot.ur.motion_planner
    # until 2026-10-13. The Isaac driver keeps its own (robot.sim.motion_planner).
    # [default: curobo] [one of: ik | curobo]
    planner: curobo

    # The hard ceiling on commanded speed, for every motion of the arm.
    # [default: 1.0]
    max_velocity: 1.0

    # The hard ceiling on commanded acceleration, and the default acceleration when a caller supplies none.
    # [default: 0.5]
    max_acceleration: 0.5

    # The box in BASE, mm, every commanded pose stays inside (the workspace guard), and where a stereo rig fixed in
    # the cell starts its depth search.
    workspace:

      # Lower X bound (mm, robot BASE frame) of the Cartesian box the TCP is allowed into.
      # [default: -500.0]
      x_min: -500.0

      # Upper X bound (mm, BASE frame) of the allowed TCP box.
      # [default: 500.0]
      x_max: 500.0

      # Lower Y bound (mm, BASE frame)
      # [default: -500.0]
      y_min: -500.0

      # Upper Y bound (mm, BASE frame).
      # [default: 500.0]
      y_max: 500.0

      # The FLOOR, in mm above the robot base plane.
      # [default: 0.0]
      z_min: 100.0

      # The ceiling, in mm above the base plane.
      # [default: 500.0]
      z_max: 600.0

    # Joint configuration the arm returns to on ``move_home()``, in DEGREES, one per joint, as the pendant shows it and
    # `python -m src.robot.execution.io_bench --where` prints it: [-90.0, -100.0, -110.0, -60.0, 90.0, 0.0]. Every
    # driver reads it in radians. Unset, the home the arm's description states (config/arms/), which for every UR was
    # authored for a UR5e.
    # [default: null]
    home_deg: null

    # Where the camera looks from before each pick when the program names no look: one list per look,
    # in DEGREES, one value per joint, as the pendant shows them and `python -m src.robot.execution.io_bench --where`
    # prints them, visited in this order. A wrist camera's pick fuses each look with the ones before it and
    # stops at the first whose grasp is safe; a fixed camera's arm is moved to them too, and its pick stops at
    # the first look that finds something. Stays in degrees in the loaded config; there is no radians twin. A
    # program's own looks override these; unset, a wrist camera looks from home and a fixed camera does not
    # move to look. Refused at load: no look, an empty or non-finite look, looks of different lengths, a
    # length unlike the home's, a joint past a full turn.
    # Radians written here cannot be refused; the real-cell desk check warns a look that reads so.
    #   look_deg:
    #     - [-90.0, -100.0, -110.0, -60.0, 90.0, 0.0]
    #     - [-70.0, -100.0, -110.0, -60.0, 90.0, 0.0]
    # [default: null]
    look_deg: null

    # How the hand and its camera naturally stand: the direction the jaws close along where nothing else
    # says. A name Pose.tool_down takes (x, -x, y, -y, radial, -radial, tangential, -tangential; a leading +
    # allowed; radial and tangential are read at each place), or a quaternion [x, y, z, w], as a taught pose
    # gives it, whose tool +X laid onto the base XY plane is that direction: only its heading counts, not its
    # pitch out of the horizontal. Camera grasps stay free, any closing direction and any tilt: of a grasp's
    # two equivalent wrist turns, half a turn about its approach apart (the same two contact faces, the jaws
    # swapped), the pick, its push, the Locator and Scene.grasps take the one whose tool +X lies nearer this
    # direction at the grasp's place. No grasp is left out or tilted, and a program's own closing_axis
    # (GraspMotion, look_around, Scene.grasps) takes precedence. Beside the simulator's twist (GraspMotion
    # align_closing_to_base_x), which chooses the way round itself, no grasp is turned; a push still takes the
    # natural way round. A pose built through the cell, robot.tool_down(x, y, z), closes along it where the
    # program names no axis. Unset, no grasp is turned and robot.tool_down closes along x, as Pose.tool_down
    # does. Refused at load: an unknown name, a quaternion that is none, one whose tool +X stands within 10
    # degrees of the vertical.
    #   natural_closing_axis: "-y"        # the tool +X along base -y
    # [default: null]
    natural_closing_axis: null

    # Poses taught by hand in the console (Setup, "Pose einlernen"): a place a task puts its part at, or a pose it
    # returns to. The key is the pose's NAME, an ASCII identifier of at most 32 characters, not a keyword and not
    # `home`; `label` is what the chat, the cards and the command reader say ("Ablage links"), free text of at most 40
    # characters with no newline and no " #". Joints in DEGREES, one per joint, with the looks' rules. A place pose
    # says where the part's BOTTOM is let go: the tool goes there raised by the part's hang, so every error goes
    # toward more air. Each pose is screened by the exact guard and the planner as it is taught, and only a clear one
    # or one in the planner's band (`screen`) is written, into the last layer of the profile chain; an unscreened or
    # refused pose never is. The console teaches poses; it never renames or deletes one: edit them here. Home stays
    # home_deg.
    #   named_poses:
    #     drop_left:
    #       joints_deg: [-60.0, -95.0, -120.0, -55.0, 90.0, 0.0]
    #       label: "Ablage links"
    #       taught_at: "2026-10-01T09:12:00+02:00"
    #       screen: clear                    # clear | band
    #       note: ""
    # [default: {}]
    named_poses: {}

    # The pose a task places at when its command names no target: a name in named_poses, or null for none, and a task
    # that names no place is then refused. Chosen in the console (Poses, "default place").
    # [default: null]
    default_place_pose: null

    # How a task sets its parts down (the owner, 2026-10-08 night): parts are set down, not dropped, and never piled.
    # Every default is what a task did before this block existed. The numbers are the owner's cell's, fixed in
    # src/robot/execution/place_target.py since 2026-10-17: 30 mm under the rim, 10 mm inside a box's opening, 20 mm
    # of rim air (a task's own air goes before it), 20 mm between parts side by side, 15 mm over the rim on a carry;
    # and a bin the check before a drop lost is always looked for again.
    place:

      # Where the jaws open on a box the camera found (a target whose inside reads lower than its rim): over_the_rim,
      # the task's rim air over the rim, as before; or below_the_rim, 30 mm under it, never lower than 10 mm
      # over what the camera reads inside the box (its floor, or the parts already in it), read again before every drop.
      # Where the camera could not read the inside, the box reads full to within 10 mm of its rim, the part or the open
      # hand does not fit inside the opening by 10 mm, the grasp stands more than 5 degrees off vertical, or
      # the guard refuses the line into the box before anything is sent, the part is let go over the rim instead.
      # [default: over_the_rim] [one of: over_the_rim | below_the_rim]
      release_in_a_box: over_the_rim

      # Whether the parts on a flat place (a taught pose, or a target the camera found with no inside) lie side by side
      # rather than at the one spot: a spot the camera reads free first (the pick's own looks for a taught pose, the
      # check before the drop for a target), else the next spot of the grid the task has not filled. A place with no
      # free spot puts the part back where it was gripped and asks.
      # [default: false]
      side_by_side: false

      # The spots a taught pose lays its parts out on where no camera reads them: rows x columns about the taught pose,
      # along the taught tool's heading, the nearest the taught pose first.
      grid:

        # How many spots along the taught tool's +X.
        # [default: 3]
        rows: 3

        # How many spots along the taught tool's +Y.
        # [default: 3]
        columns: 3

        # How far apart two spots stand, mm; null: each part's own footprint, the open hand's where that is wider, and
        # the 20 mm a place keeps between parts.
        # [default: null]
        spacing_mm: null

      # How a part is carried to a box a wrist camera found: via_the_look, to the look the box was found from, where the
      # box is looked at again, as before; or over_the_rim, where one of the pick's looks was the box's: the box is
      # checked on that look's frame (its rim's depth and colour, no detector), the arm's world holds the pick's frames
      # for the place, and the part goes up and straight over to the box on judged lines, its bottom kept the rim air and
      # 15 mm over the rim and over everything the pick's looks saw on the way. Anything that cannot be so
      # (the box unsure on that frame, the way not seen, a line refused before anything was sent, a world that cannot
      # hold the pick's frames) carries the part via the look instead. The console's switch comes in a later wave.
      # [default: via_the_look] [one of: via_the_look | over_the_rim]
      carry: via_the_look

      # How far the longest part this cell carries hangs past the fingertips along the approach, mm, a declared worst
      # case: a place sets the part's bottom where the taught fingertips stood, raised by it, and keeps it over a box's
      # rim (the rim air); the pick's looks measure the hang part by part where they read under the part. null, the
      # default: the part hangs from the TCP. It was safety.planning_world.payload.length_mm until 2026-10-17. The
      # console writes it.
      # [default: null]
      part_hang_mm: null

  # Physical gripper opening limits.
  gripper:

    # Selects which end-effector driver is built.
    # [default: robotiq] [none, dummy, robotiq, vacuum, jaw_io, onrobot]
    vendor: robotiq

    # The registry name of the hand bolted on: the stem of a file under config/grippers/, for example
    # robotiq_2f85. Lower case letters, digits and underscores only. The schema checks only that shape,
    # so a name no registry file defines, or the short name 2f85, still passes; `python -m src.config`
    # refuses both against the tree's registry. It is the only name a hand has: the loader fills the
    # hand's widths and collision envelope from its registry file wherever the profile chain leaves them
    # unset, and refuses a stated one that differs; the sim derives from it which gripper Isaac puts on
    # the arm, the self collision guard its mesh bundle, and a cell whose guard reads hand geometry
    # refuses to build while it is unset.
    # [default: null]
    model: null

    # The plates between the arm flange and the hand's own mounting face. Their thicknesses sum to where
    # a hand whose sphere map starts at its mounting face sits on the flange. null is no measurement, and
    # such a hand (the Hand-E) refuses to build until the plates are written; [] says the hand is bolted
    # straight to the flange. A hand its arm asset already placed (the 2F-85) refuses any plate.
    # Each plate is a name, a thickness_mm (the same bench measurement as the plate term in
    # tool_frame.offset_mm) and an optional cross_section_mm, the two half extents across the approach in
    # the hand model's closing and binormal axes. A plate with a cross section becomes collision geometry;
    # one without places the hand, becomes no body, and is named as a gap nobody measured.
    # [default: null]
    #
    #   coupling_plates:
    #     - name: tool_changer              # what the plate is, named when it declares no cross section
    #       thickness_mm: 48.0              # how far it holds the hand out along the approach
    #       cross_section_mm: [45.0, 45.0]  # half extents across the approach; [default: null]
    coupling_plates: null

    # Physical opening of the mounted gripper, in mm. Default is the Robotiq 2F-85 (85 mm), the end-effector
    # this project ships. The Robotiq driver anchors its count map on this value, so it must be the real
    # physical open width, not a policy ceiling. A cell that names a hand takes the hand's jaw.aperture_mm
    # unless it states this, and a stated value that differs is refused.
    # [default: 85.0]
    max_width_mm: 85.0

    # Smallest MEANINGFUL grip, a policy floor NOT the physical closed width (the 2F-85 closes to 0 mm).
    # The driver's count map is anchored on 0, so this only clamps commanded widths. A cell that names a
    # hand takes the hand's floor unless it states one between that floor and the aperture.
    # [default: 5.0]
    min_width_mm: 5.0

    # The PHYSICAL closed width: what ``get_width_mm()`` reads when the jaws are shut on nothing. Default
    # 0.0 = the Robotiq 2F-85 (fingers touching). A cell that names a hand takes the hand's own, and a
    # stated value that differs is refused.
    # [default: 0.0]
    closed_width_mm: 0.0

    # Wiring + timing for a suction end-effector on the controller's digital I/O.
    vacuum:

      # Output pin that switches the ejector / pump on. Every pin in this block is 0-7 on the standard and
      # configurable banks, and 0 or 1 on the tool bank (the default io_port): the UR tool connector has
      # two digital outputs and two inputs, and a tool pin above 1 is refused at load.
      # [default: 0]
      vacuum_output_pin: 0

      # Optional output pulsed on RELEASE. Residual vacuum keeps a light part stuck to the cup after the
      # ejector stops, so it lets go somewhere unintended; a blow-off pulse pushes it off deliberately.
      # [default: null]
      blow_off_output_pin: null

      # Optional input from a vacuum switch. WITH it the gripper can be ASKED whether it is holding a part
      # real post-close verification, which the jaw path does not have.
      # [default: null]
      vacuum_ok_input_pin: null

      # Which I/O bank the pins live on.
      # [default: tool] [one of: standard | configurable | tool]
      io_port: tool

      # How long to wait for the switch to confirm a seal.
      # [default: 1.0]
      engage_timeout_s: 1.0

      # Blow-off pulse length on release.
      # [default: 0.15]
      blow_off_s: 0.15

      # Commanded width at/below which the driver engages vacuum.
      # [default: 5.0]
      vacuum_on_below_mm: 5.0

    # Wiring + timing for a parallel-jaw gripper on the controller's digital I/O.
    jaw_io:

      # How the jaws are driven.  ``single_solenoid`` ONE output: high = close, low = open (spring
      # return). The common pneumatic case. On power loss the spring opens and a held part FALLS.
      # ``double_solenoid`` TWO outputs, pulsed: one closes, the other opens, and the valve is bistable.
      # On power loss it HOLDS the part, which is the safer failure but the jaw state is then not
      # inferable from the outputs, so feedback pins matter more here. ``single_toggle`` ONE output,
      # where EVERY CHANGE of it moves the jaws, switched on as much as switched off (a Hand-E on the
      # Robotiq I/O Coupling, 2026-09-28), and NOTHING is read back (a feedback input is refused). A
      # command is one change, left where it went; nothing is pulsed. The program asks at connect,
      # before anything moves and without writing the output, whether the jaws stand open, and counts
      # its own changes from the answer; an output switched by hand since the last command is refused,
      # and the next pick asks. Nothing is kept between programs. It takes no width.
      # [default: single_solenoid] [one of: single_solenoid | double_solenoid | single_toggle]
      actuation: single_solenoid

      # Output that closes the jaws. Held high while closed (single), pulsed (double), or the one pin
      # a toggle switches once to close and once to open. Every pin in this block is 0-7 on the standard and
      # configurable banks, and 0 or 1 on the tool bank (the default io_port): the UR tool connector has
      # two digital outputs and two inputs, and a tool pin above 1 is refused at load.
      # [default: 0]
      close_output_pin: 0

      # Output that opens the jaws. REQUIRED for ``double_solenoid``; unused (and must stay unset) for
      # ``single_solenoid``, where "open" is simply dropping ``close_output_pin``, and for
      # ``single_toggle``, where "open" is the next change of it.
      # [default: null]
      open_output_pin: null

      # Pulse length for ``double_solenoid``. A bistable valve latches, so the coil is energised only
      # long enough to throw it: holding it high is what cooks the coil. At least 0.05 s (refused below):
      # several controller cycles, 8 ms each on a CB3, so the pulse reaches the device. Unused by
      # ``single_solenoid``, which holds a level, and by ``single_toggle``, which changes its output
      # once per command and never pulses (a pulse moved the owner's Hand-E twice).
      # [default: 0.2]
      pulse_s: 0.2

      # Optional input from a dedicated part-present sensor. Simplest feedback: one pin, read directly.
      # [default: null]
      part_present_input_pin: null

      # Optional reed switch that reads TRUE when the jaws are FULLY CLOSED.
      # [default: null]
      closed_confirm_input_pin: null

      # Optional reed switch that reads TRUE when the jaws are FULLY OPEN.
      # [default: null]
      open_confirm_input_pin: null

      # Which I/O bank the pins live on.
      # [default: tool] [one of: standard | configurable | tool]
      io_port: tool

      # How long to wait for the jaws to reach a settled state after a close
      # [default: 1.0]
      close_timeout_s: 1.0

      # The jaws' travel time, both ways. With no feedback pin wired it is the whole wait: there is nothing
      # to poll, so the driver can only wait. With one, a reading that also occurs mid-stroke is taken only
      # after it. An open with no open switch waits it too, so a place does not back out of opening jaws.
      # A ``single_toggle`` waits it after every change.
      # [default: 0.3]
      close_settle_s: 0.3

      # Commanded width at/below which the driver CLOSES. Unused by ``single_toggle``, which takes no width.
      # [default: 5.0]
      closed_below_mm: 5.0

      # What ``connect()`` does when NO feedback is wired, and it defaults to the cautious answer.
      # [default: false]
      open_on_connect_without_feedback: false

      # Whether connecting ASKS a person, before anything moves, whether the jaws stand open. Closed is
      # answered with one command that opens them, or an abort; with no terminal the connect is refused.
      # null asks for ``single_toggle`` (which may not switch it off) and not for the solenoids.
      # [default: null]
      confirm_open_at_start: null

    # An OnRobot RG2 / RG6 reached over Modbus TCP through the OnRobot Compute Box.
    onrobot:

      # The Compute Box's own IP. NOT the robot's, and NOT to be assumed: the factory default is
      # 192.168.1.1, but the documented Dynamic IP mode only falls back to it after a 60-second DHCP
      # timeout, so a box on a DHCP network can be anywhere.
      # [default: 192.168.1.1]
      host: 192.168.1.1

      # Modbus TCP port. OnRobot documents 502 and one concurrent connection.
      # [default: 502]
      port: 502

      # Modbus unit id, which selects the TOOL.
      # [default: 65]
      unit_id: 65

      # Gripping force in NEWTONS, used when a caller passes none.
      # [default: 20.0] [NEWTONS: 20.0-120.0]
      default_force_n: 20.0

      # Whether commanded widths are interpreted WITH the configured fingertip offset (control value 16) or
      # without it (control value 1).
      # [default: false]
      use_fingertip_offset: false

    # Flange -> TCP for the mounted end-effector.
    tool_frame:

      # Who owns the transform.
      # [default: undeclared] [one of: undeclared | willy | controller]
      source: undeclared

      # Flange -> grasp-centre translation, mm, in the FLANGE frame.
      # [default: [0.0, 0.0, 0.0]]
      offset_mm: [0.0, 0.0, 0.0]

      # Flange -> TCP rotation as XYZW.
      # [default: [0.0, 0.0, 0.0, 1.0]]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

      # How far the controller's ACTIVE tool frame may differ from what this block declares before the
      # driver refuses to connect, in mm.
      # [default: 10.0]
      verify_tolerance_mm: 10.0

  # Tunable parameters for the hand-eye calibration routine.
  calibration:

    # Mechanical settle time after each pose move, before image capture.
    # [default: 0.5]
    settle_time_s: 0.5

    # How many counted samples a hand-guided calibration collects before it solves (``--freedrive``), unless the
    # run says otherwise (``--samples``, ``SweepOptions(samples=)``).
    # [default: 15]
    freedrive_samples: 15

    # RMSE thresholds (mm) that classify a hand-eye calibration result.
    quality_bands_mm:

      # The RMSE (mm) at or below which a finished hand-eye calibration is labelled 'excellent'.
      # [default: 1.0]
      excellent: 1.0

      # RMSE (mm) at or below which a calibration is labelled 'good'.
      # [default: 2.5]
      good: 2.5

      # RMSE (mm) at or below which a calibration is labelled 'marginal'.
      # Anything exceeding this threshold is considered 'poor'.
      # [default: 5.0]
      marginal: 5.0

  # Vendor-neutral safety surface.
  safety:

    # Self-collision guard configuration.
    self_collision:

      # Which geometry the self-collision guard checks.
      # We highly recommend using the `fcl` backend for accurate collision checking.
      # [default: fcl] [one of: capsule | fcl]
      backend: fcl

      # The clearance in mm that must remain between every monitored shape pair (arm link vs arm link, base,
      # tool, and every declared fixture box; a box a camera saw keeps perceived_min_distance_mm). It is also
      # the step every path is sampled at, so perceived_min_distance_mm plus the 6 mm every camera world grows
      # its boxes by has to reach it (refused below at load).
      # [default: 10.0]
      min_distance_mm: 3.0

      # Clearance (mm) handed to the TRAJECTORY PLANNER so it stops proposing configurations this guard will
      # reject. Undeclared by default: a UR cell that plans with cuRobo must set it here or in its profile, or
      # it refuses to start a planner rather than inherit a number nobody measured for that arm and hand. It
      # pads the planner's model only: where the padded spheres alone refuse a pose this guard accepts, on the
      # arm's own pairs, this guard decides.
      # [default: null]
      planner_margin_mm: null

      # Static fixture obstacles the self-collision guard keeps the arm from: boxes, axis-aligned in the base frame.
      # [default: []]
      #
      #   fixtures:
      #     - name: post                          # names the box in a refusal
      #       center_mm: [600.0, 0.0, 150.0]      # the box's geometric centre in the base frame
      #       half_extents_mm: [50.0, 50.0, 150.0]  # half the side length on each axis, each at least 0
      fixtures: []

      # The clearance in mm the exact mesh guard keeps from a box a camera saw. That box holds the thinned
      # cloud, one point per 10 mm camera voxel, grown by the 6 mm every cell's camera world grows its boxes
      # by, so 2 keeps the arm 8 mm from every point of it. A pixel the thinning dropped can lie nearer a box
      # face than the margin, at an oblique face or an edge: over 3,400 noise-free synthetic scenes, down to
      # 10.9 mm past the points kept; a measurement, not a bound. The arm against itself and every declared
      # fixture keep `min_distance_mm`. This plus the 6 mm must reach `min_distance_mm`, the step every path is
      # sampled at, or the config is refused at load. At least 1, refused below at load: where only these
      # boxes refuse the planner's world, this guard alone decides them. 2 is the owner's 1 to 2 mm
      # (2026-10-12): 75 of the replay bank's 116 recorded picks have a grasp it admits, 71 at 3.
      # [default: 2.0]
      perceived_min_distance_mm: 2.0

      # An alternate DIRECTORY to load the pre-baked collision-mesh bundle from.
      # [default: null]
      mesh_dir: null

    # Tool / payload envelope.
    payload:

      # The mass in kg of what is actually bolted to the flange (tool plus any carried workpiece). It is not
      # just validated on UR it is PUSHED into the controller at connect via RTDE setPayload, so it
      # directly changes the controller's own protective-stop/collision-detection thresholds.
      # [default: 0.0]
      mass_kg: 0.0

      # UR3e rated payload is 3 kg (UR5e: 5 kg).
      # [default: 5.0]
      max_mass_kg: 5.0

      # NOT [0, 0, 0]: that is the "not measured yet" marker, and pushing it would tell the controller a 1.5
      # kg tool is a point mass at the flange face.
      # [default: [0.0, 0.0, 0.0]]
      cog_mm: [0.0, 0.0, 0.0]

      # The diagonal inertia tensor (Ixx, Iyy, Izz) of the payload in kg*m^2. Despite sitting in the payload
      # block next to mass_kg and cog_mm, it is never sent to any controller and never enters any distance,
      # torque or motion computation. Nothing.
      # [default: [0.0, 0.0, 0.0]]
      inertia_kgm2: [0.0, 0.0, 0.0]

    # What the TRAJECTORY PLANNER is told about the cell, as axis-aligned boxes in the base frame.
    planning_world:

      # The bench, table or floor the cell stands on, as one axis-aligned slab in the base frame. Declaring it turns
      # the planning world on: the planner is told the bench, the meshes below and what the cameras see. A pick and
      # a place hold that world across the standoff, the carry and the drop, a world confirmed only in part refuses
      # the motion, the guard's fixtures stay the guard's, and no part in the jaws is modelled (every cell's since
      # 2026-10-17). null: the planner keeps its own boot world and no camera world is built.
      support_plane: null
      # Bench geometry in robot base frame (mm).
      # height_mm: measured top-surface height; slab extends downward by thickness_mm.
      # extent_mm: X/Y size, centred on center_mm; must cover the reachable area.
      # thickness_mm: slab depth below the top surface; does not affect height_mm.
      # center_mm: where the slab sits in the base plane. Needed when the robot is not bolted to the
      #   middle of its table: a base at the head of a bench running x=250 to x=800 has no bench under
      #   the half it works over unless the slab is moved there. Oversizing extent_mm is the other way.
      # Defaults: height=0.0, extent=[2000.0, 2000.0], thickness=50.0, center=[0.0, 0.0].

      # Geometry the planner routes around as the shape it is rather than as a box. The case that pays
      # for itself is a container: as a box a tote is solid, so a cell can never reach into it; as a
      # mesh it keeps its hollow. The planning sidecar reads the file itself, in its own process, so
      # the path has to be one that process can open; anything trimesh loads works (STL, OBJ, PLY, GLB).
      # The guards cannot read a mesh: geometry declared here is known to the PLANNER and to nothing
      # else, so where the shape must also be enforced, declare the parts that matter as
      # self_collision.fixtures boxes as well.
      # Only active where support_plane is declared.
      # [default: []]
      #
      #   meshes:
      #     - name: tote                      # unique among every obstacle; duplicates collapse
      #       path: meshes/tote.obj           # <config folder>/meshes/tote.obj, read by the planning sidecar
      #       center_mm: [500.0, 0.0, 0.0]    # where the mesh origin sits in the base frame
      #       yaw_deg: 0.0                    # rotation about base Z; a tote stands on a floor
      #       scale: 0.001                    # 0.001 for a mesh authored in millimetres
      meshes: []

  # Vendor-neutral grasping-behaviour surface.
  grasping:

    # Selects one of three locked behaviour profiles (easy, auto, dense_clutter) that decide, for every
    # pick: the outer allow-list of recovery actions (easy none, auto rescan, dense_clutter rescan and the push).
    # closed_loop and dense_autonomous were removed on 2026-09-29 and are refused at load with the mode to name
    # instead.
    # [default: dense_clutter]
    default_mode: dense_clutter

    # Which grasp generator ranks candidates. 'geometric' is the analytic stack; 'deep' is the learned 6-DoF
    # generator, which additionally takes the geometric candidates as seeds. Fails closed when 'deep' is
    # selected without weights.
    # [default: geometric] [one of: geometric | deep]
    calculator: geometric

    # The JSONL file every pick() appends its GraspAttemptRecord to (what `python -m src.robot.grasping.replay`
    # reads). Null, or an environment reference that expands to nothing, is grasp_records.jsonl in the log folder.
    # [default: null]
    record_log_path: null

    # The post-grasp `verification` block and the `dense_recovery` block were removed on 2026-09-29: no
    # pick path ran the one or consulted the other. A tree that still writes either is refused at load
    # with the sentence that says what to do instead. The hold a pick reports is the gripper's own hold
    # evidence, read after every close; the recovery a pick runs is the owner's cell's, fixed since 2026-10-16
    # (below).

    # The `decision`, `feasibility`, `occlusion`, `ordering`, `uncertainty`, `success_model`, `watchdog`,
    # `performance` and `approach_validation` blocks were removed on 2026-10-16 with their code: switched on one
    # at a time, none changed a pick of the owner's cell's replay bank (479 picks). A tree that still writes one
    # is refused at load with the sentence that says why. `robot.rl` went the same day, and the `recovery`
    # block too: the recovery a pick runs is fixed at the values the owner's cell ran, and whether the parts
    # are critical is `runtime.task.critical_parts` in app/runtime.yaml. And the `fusion` block: a cell fuses its
    # cameras by itself wherever camera.cameras.rigs declares two or more enabled RGB-D rigs with their calibration.

    # The learned 6-DoF grasp GENERATOR the thing `grasping.calculator: deep` selects.
    deep_generator:

      # Path to the generator's `.pt`, written by `python -m src.robot.grasping.deep train`.
      # [default: null]
      artifact_path: null

      # Torch device for inference.
      # [default: null]
      device: null

      # Points below this graspability score are never seeded.
      # [default: 0.5]
      minimum_score: 0.5

    # The learned grasp ranker, in SHADOW: it computes, the telemetry records, the order never changes.
    deep_ranker:

      # Score every candidate with the learned ranker and record what it would have chosen.
      # [default: false]
      enabled: false

      # Where the fitted ranker lives
      # [default: ${WILLY_PROJECT_ROOT}/assets/models/grasp_ranker/v1]
      artifact_dir: "${WILLY_PROJECT_ROOT}/assets/models/grasp_ranker/v1"

      # Which feature contract to score under.
      # [default: held_jaw_v1]
      spec: held_jaw_v1

    # What the parts stand on besides the bench (safety.planning_world.support_plane): the bin.
    support:

      # OPTIONAL bin / tray / KLT the objects sit inside. Everything here defaults to "no container".
      container:

        # Height in BASE mm of the surface INSIDE the container that parts rest on.
        # [default: null]
        floor_height_mm: null

        # Lower corner of the container's INTERIOR box in BASE mm (x, y, z) the empty volume you could
        # pour parts into.
        # [default: null]
        interior_min_mm: null

        # Upper corner of the container's INTERIOR box in BASE mm (x, y, z).
        # [default: null]
        interior_max_mm: null

        # Treat the four vertical walls of that interior box as collision geometry: they are sampled into
        # points and appended to what the candidate filter already checks against.
        # [default: false]
        wall_collision_enabled: false

        # How far OUTWARD from each interior face the wall material is sampled.
        # [default: 5.0]
        wall_thickness_mm: 5.0

        # Point spacing on the sampled walls.
        # [default: 8.0]
        wall_sample_mm: 8.0
