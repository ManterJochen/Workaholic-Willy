# The URSim bed with the planner on: a real controller, a real sidecar, no hardware.
#
# Layered on top of `ursim`, as `WILLY_PROFILE=ursim,ursim_curobo`. That profile exercises the driver
# against a real UR controller with `motion_planner: ik`, because nothing there plans. This layer
# turns the planner on, so the bed measures every verb planned or path checked, against a controller
# that answers like the real one.
#
# The bed has no camera, so it has no live camera world: every verb has to decline one
# with `without_camera_world`, as the bed probe in scripts/ursim does, or it is refused before
# planning, and `real_cell --check` blocks on its `camera world` row.
#
# The sidecar runs on the host, not in the container. `CuroboPlanClient` spawns it over pipes with the
# cuRobo environment's own python, so the container's missing GPU decides nothing here; what decides
# it is whether that environment is installed on the machine running this repository.
robot:
  ur:
    motion_planner: "curobo"

  safety:
    self_collision:
      # The margin the planner keeps, the same value the sim cell declares: 4.0 across the arm
      # family. With the planner's spheres fitted to the meshes, 10 mm leaves a UR5 no pose at all,
      # so this layer and the ur3 bed layer below name one number. robot.sim.yaml carries the
      # measurement.
      planner_margin_mm: 4.0
