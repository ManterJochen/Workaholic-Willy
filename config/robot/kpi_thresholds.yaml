# KPI bounds for the replay gate, per deployment: an operator overrides one without a code change.
# The schema is `KpiThresholdsConfig` in src/config/schema/robot/kpi_schema.py. Every rate is on
# [0, 1]; `median_cycle_time_increase_pct_max` is a percentage, so 5.0 means +5%.
#
# Only the `soak` section is read, and only by `python -m src.robot.grasping.replay --soak`, whose
# `--thresholds` defaults to this file: `min_attempts` sizes the synthetic record stream and
# `dead_loop_rate_max` is the bound that stream is judged against. The `easy`, `auto` and `dense`
# sections are required by the schema and read by nothing: `--soak-report` and `--baseline-report`
# carry their own locked copies of those numbers, in
# src/robot/grasping/replay/baseline_report.py, so editing them here moves no gate.
easy:
  false_positive_grasp_rate_max: 0.005
  dead_loop_rate_max: 0.0
  median_cycle_time_increase_pct_max: 5.0
auto:
  dead_loop_rate_max: 0.002
dense:
  dead_loop_rate_max: 0.01
  false_positive_grasp_rate_max: 0.02
soak:
  min_attempts: 1000
  dead_loop_rate_max: 0.005
