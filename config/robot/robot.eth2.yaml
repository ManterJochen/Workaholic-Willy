# ============================================================================
# Robot layer for a cell with two fixed RGB-D cameras, fused.
#
#   WILLY_PROFILE=ur5e,eth2
#
# This layer is the fusion half only. It says nothing about the arm, the bench or the tool,
# because `robot.ur5e.yaml` already does, and layers apply left to right. On its own this
# profile merges onto the base `robot.yaml`, which already sets `vendor: ur`, and produces a
# cell that still has no tool frame and no weighed payload, so it is not a cell; the pair is.
#
# The camera inventory is the other half, in `camera/cam.eth2.yaml`. The two files share
# one vocabulary: the rig ids `cam_left` and `cam_right` there are the camera ids here, and
# the calibration runner stamps the rig id into the artifact it writes, so the three places
# a camera is named line up by construction.
#
# What fusing a second view is for. One camera sees one side of a part. The grasp is
# synthesised from the primary camera's cloud, and a surface it never measured is a surface
# the finger placement is guessing at. A second view measured in the same frame turns that
# guess into geometry. Scored against a simulated reference corpus through the analytic
# calculator, fusing a second view raises both the share of scenes whose best candidate is
# graspable and the share of objects reachable at all, by a wide margin. That is the reason
# to build this cell. The size of the gain belongs to that corpus and to that calculator, so
# this file does not quote it as a prediction for your bin.
#
# This cell has never run on hardware. `_build_multi_camera_rig` in
# `src/robot/execution/autonomous_grasp/cells.py` says so about itself, and the real-cell
# calibration has only ever been exercised in simulation. The config path is complete and
# the refusals are armed; the bring-up is yours.
# ============================================================================
robot:
  grasping:
    fusion:
      # Both resolver builders return nothing while this is false, so this key is the gate
      # on the calibration itself and not only on the shadow substrate. Without it the cell
      # has no CAMERA to BASE transform, `from_robot_config` refuses to build it, and the
      # message names this key.
      #
      # It also arms the shadow voxel substrate, which ingests perception frames and emits
      # telemetry. That changes no grasp and no motion, because the gate that would let
      # fused evidence decide is `fusion.commit_policy.enabled` and it stays off, but it is
      # not free at runtime.
      enabled: true

      # The primary camera's calibration, and the only key that satisfies the CAMERA to BASE
      # refusal in `AutonomousGraspService.from_robot_config`. It becomes the transform the
      # pick loop places the primary view with, every pick.
      #
      # It is easy to miss. `real_cell.calibrate` prints a `fusion.cameras` block to paste
      # after each camera, and that block alone leaves this key null: a cell can be fully
      # calibrated, load both artifacts, and still be refused at build. Point this at the
      # artifact for the first `source: rgbd` rig in `camera.cameras.rigs`, the primary camera.
      extrinsics_artifact_path: "calibration/real/eth_cam_left.json"

      # Every camera except the primary, one entry per camera, each with its own artifact.
      #
      # The primary is omitted on purpose, and that is the trap of the whole file. Four places
      # read this map and two of them disagree about what belongs in it. `_build_multi_camera_rig`
      # builds the extra-camera rig from this map with the primary filtered out, because the
      # primary already streams through the main perception source. The orchestrator's
      # `configured_camera_ids` is built from the same map with only disabled entries dropped,
      # and the pick loop then reports every configured camera that delivered no frame. List the
      # primary here and it is permanently among the missing: a warning on every pick under
      # `on_camera_unavailable: degrade`, and a raised RuntimeError on every pick under
      # `refuse`.
      #
      # `robot.sim.yaml` lists all three of its cameras including its primary. That is
      # correct there, because the Isaac runner builds its own rig that includes the
      # primary, and it is wrong here. Do not copy the shape of that block.
      #
      # The cost of leaving the primary out is one false line at construction: the counter
      # that warns about a single-view cell also reads this map, so it reports one
      # calibrated camera and recommends adding a second while the cell is fusing two.
      cameras:
        cam_right:
          enabled: true
          # A fixed camera: the artifact is CAMERA to BASE and loads into a resolver that
          # returns one transform and never consults the arm. `eye_in_hand` is the other
          # case, a camera on the wrist, where the artifact is CAMERA to TOOL and the live
          # tool pose completes it each frame.
          mounting_mode: "eye_to_hand"
          # Loaded fail-closed at construction, and only while `geometry.enabled` below is
          # true: a path that does not resolve raises there, naming this key, rather than
          # producing a cell that silently grasps single-view.
          extrinsics_artifact_path: "calibration/real/eth_cam_right.json"

      geometry:
        # The switch that changes grasp candidates, and the one the extra-camera rig is
        # gated on. `fusion.enabled` above arms the calibration and the shadow substrate;
        # this is what makes a second view reach the grasp.
        enabled: true

        # How a camera decides it is looking at the same object as the primary. `overlap`
        # scores shared surface and abstains when it finds none, which is what an occluded
        # camera should do. `centroid` matches on nearest centre and never abstains, so an
        # absent target is answered with a neighbouring object's surface welded into the
        # cloud the grasp is planned on.
        metric: "overlap"

        # The match score a camera must clear to contribute to an object. Below it the
        # camera contributes nothing for that object, exactly as an occluded camera does.
        min_score: 0.30

        # How near two points from different cameras count as one surface. Above the depth
        # noise of a D435 at bin distance and below the gap between two parts that touch,
        # so a small calibration error still fuses and two objects still do not merge.
        neighbour_mm: 12.0

        # What to do when a camera named above delivers no frame. `degrade` warns and
        # continues on the cameras that did deliver; `refuse` fails the pick closed.
        # `refuse` is the stricter reading and states that a cell must never fall back to
        # single-view in silence. It is left at `degrade` here because nobody has yet
        # measured how often a D435 drops a frame in a real cell, and a first bring-up that
        # stops on a dropped frame is hard to tell from a broken one. Move it to `refuse`
        # once the cell has run.
        on_camera_unavailable: "degrade"

        # `neighbour_scene_enabled` stays off. It feeds the other camera's view of everything
        # that is not the target to the collision filter, and on the reference corpus it
        # rescues about as many grasps as it destroys. For a bin it is also the wrong lever:
        # most of the collisions that survive ranking hit a bin wall, and no detector segments
        # a wall as an object, so no amount of camera fusion reaches one. Wall geometry is
        # declared instead, under `robot.grasping.support.container`, and that measured flat
        # as well. Neither is switched on here, because an example that enables a knob implies
        # a gain the measurements do not support.

# ============================================================================
# Bring-up order.
#
# 1. Read both camera serials with `rs-enumerate-devices -s` and set WILLY_CAM_LEFT_SERIAL
#    and WILLY_CAM_RIGHT_SERIAL, or write the literals into camera/cam.eth2.yaml. With
#    neither set the placeholder defaults load and validate, so the tree passes the command
#    below and the failure moves to the first attempt to open a device.
#
#      WILLY_PROFILE=ur5e,eth2 python -m src.config
#
# 2. Prove each camera streams depth on its own, before anything is built:
#
#      WILLY_PROFILE=ur5e,eth2 python -m src.robot.perception --rig cam_left
#      WILLY_PROFILE=ur5e,eth2 python -m src.robot.perception --rig cam_right
#
# 3. Fill in the tool frame and the payload in robot.ur5e.yaml. Those are bench
#    measurements and the cell refuses to connect without them.
#
# 4. Calibrate each camera against the robot. This moves the robot. Check first, then run:
#
#      python -m src.robot.execution.real_cell.calibrate --profile ur5e,eth2 --rig cam_left --check
#      python -m src.robot.execution.real_cell.calibrate --profile ur5e,eth2 --rig cam_left
#      python -m src.robot.execution.real_cell.calibrate --profile ur5e,eth2 --rig cam_right
#
#    Each run writes `calibration/real/eth_<rig>.json`, which is what the two artifact keys
#    above already name. Point them elsewhere only if you passed `--out`.
#
# 5. Check the whole cell, rehearse it, then pick:
#
#      WILLY_PROFILE=ur5e,eth2 python -m src.robot.execution.real_cell --check
#      WILLY_PROFILE=ur5e,eth2 python -m src.robot.execution.real_cell --rehearse
#
#    `--check` verifies the primary artifact key only; it never reads `fusion.cameras`. It
#    does not open the file either, so a green check with a missing artifact still fails when
#    the cell is built.
#
# What this cell does not do: the operator console's live view reads the primary camera
# only, and offers no camera selector, so the second view appears in telemetry rather than
# on the panel.
# ============================================================================
