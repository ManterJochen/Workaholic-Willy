# ============================================================================
# Decision profile   --profile decision   (layers onto robot.yaml, chained last)
#
#   WILLY_PROFILE=sim,decision      (or: --profile sim,decision)
#
# Turns on `robot.grasping.decision`, one of the `grasping.*` blocks that ship disabled. It is a
# profile layer rather than an edit to robot.yaml so that the base tree stays as it is: every
# other runner and every gate that reads it are unaffected, and the block is enabled by name
# rather than by remembering which line was toggled.
#
# What `decision` is: the auto gate. `DecisionEngine` in src/robot/grasping/decision.py decides
# whether the stack may execute a grasp autonomously, and it is fail-closed. On real hardware an
# inconclusive verdict refuses the pick rather than attempting it, so this is the block least
# worth meeting for the first time on a physical cell.
#
# Expect the pick count to fall, not rise: a gate that never refuses is not a gate. What the layer
# has to answer is whether it refuses the right picks and says why, so read `decision_action` and
# `decision_reason_code` off the `DecisionReport` the engine returns, not the pick count alone.
#
# The block's other keys are unset here and take their schema defaults; see
# `GraspingDecisionConfig` in src/config/schema/robot/grasping_schema.py.
# ============================================================================

robot:
  grasping:
    decision:
      enabled: true
