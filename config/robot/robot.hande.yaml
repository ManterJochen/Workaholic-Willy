# Gripper profile (WILLY_PROFILE=hande), deep-merged onto robot.yaml.
#
# The Robotiq Hand-E as the gripper of a cell. It is a gripper layer rather than a cell layer, so it
# chains: `WILLY_PROFILE=ur3e,hande` puts this hand on the UR3e cell and `WILLY_PROFILE=hande` puts
# it on the UR5e one. Nothing here names an arm: the guard derives its bundle from `model` below and
# composes the arm in, so the one name is right on either arm.
#
# One name, three readers. The tree answers three questions about one piece of hardware:
#
#   robot.gripper widths                 actuation: what the driver may command
#   robot.grasping.gripper_geometry      envelope: what shape the calculator sweeps
#   robot.gripper.model + coupling_plates      the planner's model: what cuRobo and Coal refuse against
#
# Written as three statements, nothing would cross-check them: a layer that sets `max_width_mm: 50` and
# leaves the rest commands a 50 mm stroke while the collision filter sweeps a 2F-85's fingers. So `model`
# below is the only statement. The loader fills the widths and the envelope from
# grippers/robotiq_hande.yaml and refuses a layer that states them differently, and the planner and the
# guard read the bundle and the sphere map fitted from the same measurement.
#
# Every number of this hand is measured off `robotiq_hande_ur5e_collision_meshes.npz`, which is the Isaac
# Hand-E asset placed into the tool0 frame by scripts/grippers/bake_gripper_variant.py. That script
# reproduces the committed 2F-85 to 0.05 mm before it writes anything, which is what makes these
# numbers evidence rather than a datasheet transcription.
robot:
  gripper:
    vendor: "robotiq"
    # The hand, by registry name (config/grippers/robotiq_hande.yaml). Named in this layer so any chain
    # it joins carries it: without it `sim,hande` would inherit the sim profile's 2F-85, and with it the
    # chain takes the Hand-E's widths and envelope.
    model: robotiq_hande

    # The plates between the flange and this hand's own mounting face. The Hand-E's sphere map and
    # bundles start at that face (origin mounting_face), so the guard adds the thicknesses to the hand
    # and the cell refuses to build without them. 20.0 is an assumption, not a measurement: no rule has
    # been put on this cell's coupling. Replace it with the bench number, the plate term of the tool
    # frame below.
    #
    # No `cross_section_mm`, so this plate places the hand and becomes no collision body, and the cell
    # says so by name. A body built from one measured number and one guessed one is indistinguishable
    # downstream from a body somebody measured. What that costs is measured by
    # scripts/curobo/probe_plate_body.py: over the 1,483 judged poses, against the exact guard's 10 mm, a
    # plate of flange radius turns 0 to 2 of about 950 clear poses per arm, the worst grazing at 8.944 mm.
    # A quick change coupler is the case that matters, at 0 to 25 poses, and it is also the one a bench
    # can measure in a minute.
    coupling_plates:
      - name: hande_adapter
        thickness_mm: 20.0

    # Same URCap socket, same 0..255 counts, same port. The transport does not know which Robotiq is
    # on the flange and does not need to: the count map is anchored on the aperture and the closed width.
    #
    # One description per hand. The widths and the collision envelope come from
    # grippers/robotiq_hande.yaml, where their measurements are written, and restating them here is
    # refused the moment they disagree. Custom fingertips that do not meet are a different hand to this
    # stack, with their own closed width and their own body: describe them as their own registry hand
    # rather than stating a closed_width_mm here, because a count map on the wrong closed width leaves
    # every commanded width 5.6 mm out.

    # Not declared here, on purpose. Flange to grasp centre depends on the coupling plate, which is a
    # per-cell bench measurement, and the real UR driver refuses to connect while this says
    # `undeclared`. A plausible default is how the next cell inherits a wrong frame in silence, and the
    # rotational half of that error is invisible: a cell 90 degrees out logs nothing but successes
    # while closing the jaws along the wrong object axis, and hand-eye calibration reports an excellent
    # RMSE either way because it solves for whatever frame `get_tcp_pose()` reports.
    #
    # Measured, as the half of the answer that does not depend on the cell: the gripper's own mounting
    # face to its grasp centre is 135.75 mm, along the approach. Add the coupling plate to get
    # `offset_mm`. The same plate thickness is what `build_ur_config.py --coupling-mm` wants, so take it
    # once.
    tool_frame:
      source: "undeclared"

  # grasping.gripper_geometry is not written here: the named hand supplies its collision envelope, and
  # the measurements behind each number, the carriage shoulder under-model among them, are written in
  # grippers/robotiq_hande.yaml.
