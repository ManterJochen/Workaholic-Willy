# ============================================================================
# Sim profile overlay: the Isaac work cell, deep-merged onto robot.yaml.
#
# `src/config/loader.py` merges this file whenever the active profile chain contains
# `sim`, which `WILLY_PROFILE=sim` selects and which willy_sim's `load_sim_config` sets
# for the duration of a sim load. A second layer, as in `WILLY_PROFILE=sim,ur3e`, puts a
# different UR on top of it. What the Isaac cell needs differently from the UR
# production config lives here and everything unlisted is inherited from robot.yaml,
# though parts of it restate the base rather than change it: the calibration block, the
# gripper vendor and widths, and parts of the sim and self_collision blocks.
#
# A `null` leaf in an overlay keeps the base value instead of clearing it
# (`src/config/_merge.py`), so a leaf here reaches the tree only when it is non-null or when
# the base does not carry the key, as `assets_root` does; `scene: null` restates a base null
# and changes nothing. Forcing an inherited field back to null takes the `__null__` reset
# sentinel that `src/config/loader.py` defines.
# ============================================================================
robot:
  vendor: "sim"

  sim:
    enabled: true
    mock_mode: false
    backend: "isaac"
    scene: null
    # One combined UR5e and Robotiq 2F-85 articulation, so the gripper shares the arm's root prim.
    robot_prim_path: "/World/UR5e"
    gripper_prim_path: "/World/UR5e"
    gripper_variant: "Robotiq_2f_85"          # the `Gripper` variant selected on the UR5e USD asset
    home_joint_positions: [0.0, -1.0, 0.9, 0.0, 0.0, 0.0]
    park_joint_positions: [3.14, -1.0, 0.9, 0.0, 0.0, 0.0]   # swings the arm out of the camera view
    # Where the Isaac sample assets live. Null asks Isaac itself, through
    # `get_assets_root_path()`, which is right on a normal install. Set it only where the
    # assets sit somewhere Isaac does not look, and prefer the environment variable over
    # a literal so the file stays portable:
    #     assets_root: ${WILLY_ISAAC_ASSETS_ROOT:-}
    assets_root: null
    headless: true
    cameras:
      overhead:                                # eye-to-hand camera 1000 mm above the table
        prim_path: "/World/Cameras/Overhead"
        mounting_mode: "eye_to_hand"
        position_mm: [450.0, 0.0, 1000.0]
        resolution: [640, 480]
        # Inert on this camera, and null is the deliberate value. `willy_sim/scene/build.py` calls
        # `set_clipping_range` only on the branch a camera with `mount_aim_mm` takes, so a nadir
        # camera keeps Isaac's 1.0 m default near plane whatever this key says.
        #
        # That default is load-bearing on the ground-truth path: it hides the home-pose arm link
        # that overlaps the object, so the instance-id mask stays clean. The object's top face is
        # 50 mm above the table and this camera is 1000 mm above it, so the object sits inside the
        # 1.0 m plane as well. On this geometry a clean instance mask and an object-bearing
        # rendered depth cannot both hold, and only a scene change resolves it: park the arm out of
        # view for perception, or raise the camera. So the single-camera ground-truth runners keep
        # this default, the real-vision path parks the arm and sets its own close clip in code
        # (`willy_sim/perception/vision.py`), and `run_multiview_pick` drops this camera's clip to
        # 0.05 m in code, rendering the arm, and adds the obliques, which have no arm overlap.
        #
        # A close value here is harmless while nothing applies it and a trap the moment something
        # does: wiring this key through to the nadir branch lets the arm back into the instance
        # mask and breaks the ground-truth pick. Authoring a value is also not proof the camera
        # took it; read the clipping range back off the camera before believing it.
        near_clip_m: null
      wrist:                                   # eye-in-hand camera, a child of wrist_3_link
        prim_path: "/World/UR5e/wrist_3_link/wrist_cam"
        mounting_mode: "eye_in_hand"
        resolution: [640, 480]
        near_clip_m: 0.02                       # close range; Isaac's 1.0 m default renders black
        # Mount in the wrist-link local frame: offset to the side and aimed along the wrist's +Y,
        # which is the gripper's approach axis, so the gripper stays out of frame.
        mount_offset_mm: [130.0, 20.0, 0.0]
        mount_aim_mm:    [130.0, 457.0, 0.0]
        mount_up_hint:   [0.0, -1.0, 0.0]
      # Two fixed eye-to-hand obliques, one per side, so a target occluded from one side is still
      # covered by the other view. `willy_sim/scene/build.py` authors `overhead` alone, so these two
      # entries do nothing for the single-camera runners; `run_multiview_pick` and the bin and pile
      # runners author them from these values. On a fixed eye-to-hand camera `mount_aim_mm` is the
      # world-frame look-at target, here the bin centre. The near clip is 0.05 m because a
      # side camera stands about 870 mm from its aim point, inside Isaac's 1.0 m default plane,
      # which would render it black.
      oblique_L:
        prim_path: "/World/Cameras/ObliqueL"
        mounting_mode: "eye_to_hand"
        position_mm: [450.0, -560.0, 720.0]
        mount_aim_mm: [450.0, 0.0, 50.0]
        resolution: [640, 480]
        near_clip_m: 0.05
      oblique_R:
        prim_path: "/World/Cameras/ObliqueR"
        mounting_mode: "eye_to_hand"
        position_mm: [450.0, 560.0, 720.0]
        mount_aim_mm: [450.0, 0.0, 50.0]
        resolution: [640, 480]
        near_clip_m: 0.05

    # Scene authoring and run parameters for the sim runners; none of it reaches the driver.
    scene_setup:
      object:   { size_mm: [30.0, 30.0, 50.0], position_mm: [450.0, 0.0, 25.0], mass_kg: 0.05, static_friction: 1.5, dynamic_friction: 1.3 }
      table:    { size_mm: [800.0, 800.0, 400.0], position_mm: [450.0, 0.0, -200.0] }
      marker:   { kind: "none", position_mm: [450.0, -150.0, 6.0], aruco_plate_size_mm: 72.0, aruco_marker_id: 0 }
      eih_viewpoints: { radii_mm: [235.0, 275.0], elevations_deg: [16.0, 30.0], azimuths_deg: [0.0, 60.0, 120.0, 180.0, 240.0, 300.0] }
      gate:     { lift_threshold_mm: 50.0, pass_fraction: 0.8 }
      render_warmup_steps: 20

  # Cartesian workspace box (mm) for this cell. It has to span both the calibration viewpoints, the
  # tool held high over the table, and the low grasp poses: a top-down grasp on the cube puts the
  # TCP near z=37, and the SafetyPreflight WorkspaceGuard rejects every motion whose target falls
  # outside this box. z_min 0.0 is the table top, and `safety.limits.workspace_margin_mm`, 20 mm in
  # robot.yaml, then floors the guard at z=20.
  workspace_limits:
    x_min: 100.0
    x_max: 700.0
    y_min: -350.0
    y_max: 350.0
    z_min: 0.0
    z_max: 600.0

  # Retreat pose, and it must sit inside workspace_limits: `_check_safe_pose_in_workspace` refuses
  # the tree at config load otherwise, because the WorkspaceGuard would reject a retreat motion
  # aimed outside that box. Nothing moves to the pose today: its only reader is the willy_sim
  # reach doctor (`harness/reach.py`). The production default (0, -300, 400) is outside this cell's
  # x[100, 700], hence the override: tool high, off the -Y side, clear of the picks at x=450.
  safe_pose:
    x: 450.0
    y: -300.0
    z: 400.0

  # SafetyPreflight is wired into the sim pick path. The built-in joint-limit table is keyed on a
  # Universal Robots vendor and this cell's vendor is `sim`, so without explicit limits the guard
  # reports UNAVAILABLE and fails closed. The arm is physically a UR5e, so these are its factory
  # +/-360 deg per-axis envelope: valid grasps pass and out-of-envelope joints are still caught.
  safety:
    joint_limits:
      min_deg: [-360.0, -360.0, -360.0, -360.0, -360.0, -360.0]
      max_deg: [360.0, 360.0, 360.0, 360.0, 360.0, 360.0]
    # ik_quality and motion_continuity are sized for a servo drive, where an IK jump is an
    # unfollowable discontinuity and a near-singular configuration amplifies joint velocity. The
    # Isaac drive has neither failure mode: `move_joint` is position-controlled and walks the move
    # in 0.03 rad waypoints, up to 250 of them and so about 7.5 rad in one command, and `move()`
    # verifies the achieved TCP by FK. The jump, step and singularity limits are therefore widened
    # to what this drive can really follow, which passes a large single-move reconfiguration and an
    # awkward but valid near-singular grasp while still rejecting IK garbage: a condition number
    # above 1000, a smallest singular value under 1e-4, a wildly wrong branch. Deep-merge leaves
    # every unlisted field, the enforce flags included, at the robot.yaml value, and the widening
    # is per-cell: the UR thresholds and the workspace, joint-limit, self-collision and payload
    # guards are untouched.
    ik_quality:
      max_jump_rad: 3.5
      max_condition_number: 1000.0
      min_singular_value: 0.0001
    motion_continuity:
      max_joint_step_deg: 180.0
      max_orientation_step_deg: 180.0
      max_tcp_step_mm: 1000.0
    dwell:
      # The sim's `wait_until_steady` steps the physics itself, so as a pre-move gate inside the
      # pick loop it fights the loop's own stepping and the picks fail. It is off for this cell.
      # On real hardware the same call reads a controller steady signal and steps nothing, so the
      # gate works there and robot.yaml leaves it on.
      require_steady_before_motion: false
    # The arm is physically a UR5e, so `kinematics_model` opts this non-UR vendor into the bundled
    # UR DH table: the guard then measures arm against arm and arm against gripper instead of base,
    # tool and fixture capsules alone. It must equal `sim.robot_model`, which the config load
    # cross-validates. The bundled DH base frame is rotated 180 deg about Z from the Isaac UR5e USD
    # `base_link`, and `kinematics_base_yaw_deg` is what turns the arm capsules back into the frame
    # the base, tool and fixture capsules already use. `backend: fcl` is the vertex-exact mesh
    # check, Coal preferred with python-fcl as the fallback; it needs one of those engines plus the
    # model's mesh bundle, and without them the guard logs the degradation and drops back to the
    # capsule proxy, which over-rejects the reach-down grasps this cell makes.
    self_collision:
      backend: "fcl"
      kinematics_model: "ur5e"
      kinematics_base_yaw_deg: 180.0
      min_distance_mm: 10.0
      # The same clearance handed to the trajectory planner, so it stops returning paths this guard
      # would then reject: cuRobo plans against a sphere model while the guard re-checks the exact
      # meshes, and the two disagree by fractions of a millimetre. Not derived from
      # `min_distance_mm`, because how much margin a planner can absorb depends on how tightly its
      # spheres fit that arm: a UR3e finds no plan at all at 10 mm (see robot.ur3e.yaml).
      planner_margin_mm: 10.0

  gripper:
    vendor: "robotiq"
    max_width_mm: 85.0          # Robotiq 2F-85 opening
    min_width_mm: 5.0

    # The sim cell declares its tool frame in the same place a real cell does, so the flange-to-TCP
    # transform has one owner and both halves of it are visible to config. `source: "willy"` says
    # the driver composes flange and TCP inside its own boundary, which is the honest label for a
    # simulator: there is no controller holding a tool register at all. The values are the 2F-85
    # mount, 132 mm along flange +Y plus a -90 deg rotation about flange X that maps the TCP's +Z,
    # the approach axis, onto flange +Y. Only the `bootstrap_sim_cell(gripper_mount=...)` argument
    # swaps in a mounted gripper's own flange-to-TCP translation; the same key set in YAML mounts
    # that gripper and its width profile and leaves the arm on this 2F-85 offset.
    tool_frame:
      source: "willy"
      offset_mm: [0.0, 132.0, 0.0]
      rotation_quat_xyzw: [-0.70710678, 0.0, 0.0, 0.70710678]

  calibration:
    settle_time_s: 0.5
    orientation_spread_deg: 15.0
    max_attempts_per_pose: 200
    quality_bands_mm:
      excellent: 1.0
      good:      2.5
      marginal:  5.0

  # Every camera this cell fuses, the primary included, each calibrated on its own
  # (`run_eth_calibrate --camera <id>`) and pointing at its own persisted artifact.
  #
  # Listing the primary here used to be described as correct for the simulator and wrong for a real
  # cell, because the real path excluded it and the boot banner counted the map. That asymmetry is
  # gone: the map means the whole camera inventory everywhere, so this block was already the right
  # shape and the documentation around it was the part that was wrong. The primary is still left out
  # of the extra-camera rig a real cell opens, because it already streams through the cell's main
  # perception source. The
  # camera ids have to match the entries in `robot.sim.cameras`, since the oblique poses are
  # authored from that same block. The map is inert while `grasping.fusion.enabled` stays false:
  # `build_config_frame_resolvers` returns an empty map and every runner keeps the sim ground-truth
  # extrinsics. `run_multiview_pick --calibrated` is the explicit opt-in, enabling fusion for the
  # resolver build and consuming these artifacts instead. Fail-closed: an enabled camera whose
  # artifact is missing or unreadable raises at construction rather than running a smaller rig than
  # was asked for.
  grasping:
    fusion:
      # The calibration runners namespace their artifacts by robot model, so a two-robot bench
      # cannot lose one arm's calibration by running the other's. Keep the `ur5e` segment in step
      # with `sim.robot_model`: `run_eth_calibrate` writes into `logs/calibration/<robot_model>/`.
      cameras:
        overhead:
          mounting_mode: "eye_to_hand"
          extrinsics_artifact_path: "logs/calibration/ur5e/eth_overhead.json"
        oblique_L:
          mounting_mode: "eye_to_hand"
          extrinsics_artifact_path: "logs/calibration/ur5e/eth_oblique_L.json"
        oblique_R:
          mounting_mode: "eye_to_hand"
          extrinsics_artifact_path: "logs/calibration/ur5e/eth_oblique_R.json"
