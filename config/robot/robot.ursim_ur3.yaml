# ============================================================================
# URSim UR3e layer, selected as `WILLY_PROFILE=ursim,ursim_ur3`.
#
# It layers onto `ursim` and changes one thing: which robot the driver thinks it is
# holding. That one key is load-bearing. `ur.model` selects the safety DH chain, the
# exact-mesh collision bundle and the cuRobo robot config, so a UR3e planned against UR5e
# link lengths (a2/a3 -243.55/-213.2 mm against -425/-392.2 mm) is what setting it here
# prevents. `_verify_tool_frame` derives the controller's active tool frame from that same
# DH table, so pointing the UR5e chain at a UR3e controller makes the driver refuse to
# connect. Where `safety.self_collision.kinematics_model` is set, it is cross-validated
# against this key at config load and the two must name the same model.
#
# Start the matching container on the UR3 image first, and fresh (`URSIM_FRESH=1`), with
# the URSim helper under `scripts/ursim/`. Every container start comes up in local mode,
# fresh or reused: the `RemoteControlEnabled=true` file survives a stop and start, the
# top-right Local/Remote selector does not, and nothing in the dashboard protocol can move
# it. Re-enable it at the pendant each time.
# ============================================================================

robot:
  ur:
    model: "ur3e"

  safety:
    self_collision:
      # 4.0, the same value the `ursim_curobo` layer above declares: with the planner's
      # spheres fitted to the meshes no arm absorbs 10 mm. Kept here rather than deleted
      # because the key is a declaration, and a bed chain that declared nothing would be
      # refused for saying nothing. Inert while this layer runs over plain `ursim`, which
      # plans nothing; it bites on the bed chain `ursim,ursim_curobo,ursim_ur3`, where the
      # layer order puts this one last.
      planner_margin_mm: 4.0
