# ============================================================================
# URSim profile layer, selected as `WILLY_PROFILE=ursim`, layered onto `robot.yaml`.
#
# It points the UR driver at a URSim container on localhost instead of a real controller.
# URSim is real UR controller software driving a robot that does not exist, so the vendor
# stays `ur` and the real driver runs: this is not a simulated driver. The profile also
# declares what `URRobotArm.connect()` refuses to start without:
#
#   * `safety.payload.enforce: true` with `mass_kg: 0.0`: connecting would push
#     setPayload(0.0) and overwrite the controller's payload for a mounted tool.
#   * `gripper.tool_frame.source: undeclared`: nobody has said where the grasp centre sits
#     on the flange, so the driver cannot know whether a commanded pose means the TCP or
#     the flange.
#
# The numbers below are a simulator's numbers: they exist so the code path can be
# exercised, not because anybody weighed a tool. The rotation is the 2F-85 one the Isaac
# cell runs, -90 deg about flange X; the stand-off is not. `robot.sim.yaml` puts its 132 mm
# on flange +Y, the axis that rotation maps the approach onto, and this profile puts the same
# 132 mm on flange +Z, so the two halves belong to different flange conventions. `willy` mode
# expects a bare flange at the controller, so nothing in URSim checks the pair. The payload is
# a plausible mass for a 2F-85 with its coupling. On a real cell every one of them is a bench
# measurement; the `ToolFrameConfig` docstring says why the rotational half is the
# dangerous half.
#
# URSim must be in remote control. In local mode the controller runs no program sent from
# outside, so RTDEControlInterface times out with a message that names nothing; `connect()`
# diagnoses that case explicitly. Enable it at http://localhost:6080/vnc.html under
# `menu -> Settings -> System -> Remote Control -> Enable`, then switch the top-right
# selector from Local to Remote.
#
# Bring the container up first, on the UR5 or UR3 image, with the URSim helper under
# `scripts/ursim/`.
# ============================================================================

robot:
  vendor: ur
  ur:
    ip: "127.0.0.1"
    # 0.0 leaves the rate to the controller. It is this stack's sentinel and not ur_rtde's,
    # which reads 0.0 as zero hertz and fails synchronisation after 6.1 s, so the UR connection
    # translates it to -1.0 at the driver boundary. Past that translation the rate does not
    # decide whether the control interface connects, so there is nothing to tune here.
    rtde_frequency: 0.0
    # Not the base tree's "curobo": the sidecar runs on the machine driving the cell rather
    # than in the container, spawned from the cuRobo environment under `ext_deps/`. Where that
    # is missing the UR path is fail-closed: it refuses every move with CONTROLLER_REJECTED and
    # never degrades to blind IK. This profile exercises the driver against a real controller,
    # not the planner.
    motion_planner: "ik"

  gripper:
    vendor: "none"          # no end-effector on the container; a no-op gripper stands in
    tool_frame:
      # `willy` means the controller runs a bare flange and this driver composes the
      # transform, which is what URSim is: no tool is configured on it. Declaring
      # `polyscope` instead makes the frame the driver derives from the controller
      # disagree with this declaration, and the driver then refuses to connect.
      source: "willy"
      offset_mm: [0.0, 0.0, 132.0]
      rotation_quat_xyzw: [-0.70710678, 0.0, 0.0, 0.70710678]
      verify_tolerance_mm: 10.0

  safety:
    payload:
      enforce: true
      mass_kg: 1.5
      # Not [0, 0, 0]: that is the "not measured yet" marker, and pushing it would tell the
      # controller a 1.5 kg tool is a point mass at the flange face, so `connect()` refuses
      # the pair.
      cog_mm: [0.0, 0.0, 60.0]
