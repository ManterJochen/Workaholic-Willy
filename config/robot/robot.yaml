# Robot configuration: the vendor and its driver block, the arm's limits, the mounted
# end-effector, the vendor-neutral safety guards and the grasping behaviour. This is the base
# layer every `robot.*.yaml` profile overlay merges onto, and it describes one worked cell: a
# Universal Robots arm carrying a Robotiq 2F-85, planning with cuRobo.
#
# `vendor` selects which driver `create_arm()` builds, and is checked against the `RobotVendor`
# enum as the config loads, so a typo is refused there rather than at the first motion. Each
# vendor owns a sibling block below and only the matching one is read: "ur", "sim" for the Isaac
# or pure-Python mock arm, "dummy" for the featureless in-process stub.
robot:
  vendor: "ur"

  # ----------------------------------------------------------------------
  # UR-only block. Only consulted when robot.vendor == "ur".
  # ----------------------------------------------------------------------
  ur:
    # The UR10 cell's controller. The key has no default: a tree that drives a controller says where it is,
    # and the cell lock holds the cell by this address (ur@192.168.1.100).
    ip: "192.168.1.100"
    rtde_frequency: 0.0        # 0 = the controller picks its own rate, 125 Hz, not zero hertz

  # ----------------------------------------------------------------------
  # How this cell's motions are planned, whichever arm drives them.
  # ----------------------------------------------------------------------
  motion:
    # "curobo" plans a collision-free trajectory in the isolated planner process (safety.planning), to
    # the goal configuration nearest the arm, and runs it as one moveJ per kept waypoint: the fewest of
    # the plan's own waypoints whose legs stay within the path gate's step, judged leg by leg by the
    # path gate and the planner. "ik" is the controller's straight line, which knows nothing about the
    # bench, the bin or anything else in the cell and will drive through all of it. The "curobo" path
    # is fail-closed: with no cuRobo environment the move is refused with CONTROLLER_REJECTED and never
    # degrades to blind IK, so confirm that environment first with
    # `python -m src.robot.safety.planning --doctor`. What the planner knows about the cell comes from
    # `safety.planning_world`; where it declares no support_plane it plans against its own robot model
    # and a generic 1.6 m table and nothing else. It was robot.ur.motion_planner until 2026-10-13.
    planner: "curobo"
    max_velocity: 1.0          # rad/s
    max_acceleration: 0.5      # rad/s^2
    workspace:            # Cartesian box in mm
      x_min: -500.0
      x_max:  500.0
      y_min: -500.0
      y_max:  500.0
      z_min:  100.0              # keep above table
      z_max:  600.0

  # ----------------------------------------------------------------------
  # Sim block (Isaac Sim or pure-Python mock). Only consulted when
  # robot.vendor == "sim". With mock_mode: true the driver touches no
  # Isaac SDK at all: connect() succeeds at once and each motion updates
  # a cached TCP, so a machine with no NVIDIA install can drive it.
  # ----------------------------------------------------------------------
  sim:
    enabled: false
    mock_mode: false
    backend: "isaac"
    # Which UR the sim cell drives: "ur5e", or any arm the registry admits for a simulator (ur3, ur3e,
    # ur5, ur10, ur10e). It selects the Lula solver config, the Isaac USD and the cuRobo {model}.yml;
    # see src/robot/drivers/sim/robot_models.py. It is the model the Isaac arm reports, so it is the
    # arm the self-collision guard judges.
    robot_model: "ur5e"
    scene: null
    robot_prim_path: null
    gripper_prim_path: null
    headless: true
  # ----------------------------------------------------------------------
  # Dummy driver block. Only consulted when robot.vendor == "dummy". The
  # driver is featureless by intent and the block carries no fields; it
  # exists so the YAML shape stays stable if one is ever added.
  # ----------------------------------------------------------------------
  dummy: {}

  gripper:
    vendor: "robotiq"
    # max_width_mm, min_width_mm and closed_width_mm are not written here. A hand named by
    # robot.gripper.model supplies its own aperture, policy floor and closed width from its registry
    # file, and a cell naming none keeps the schema defaults, which are the 2F-85's 85, 5 and 0 mm.
    # They are three keys because they answer three questions. The driver's count map is anchored on
    # the aperture, so a number set as a policy ceiling lands every commanded width short. The floor
    # is a policy about the part and never the mechanism. The closed width is what get_width_mm()
    # reads with the jaws shut on nothing, the other end of that count map: the 5 mm policy floor in
    # its place would move every commanded width off the mark.

    # Which hand this is, by registry name: the stem of a file in the grippers/ directory beside
    # robot/, for example robotiq_2f85. Name the hand by its model name: 2f85 is the short name
    # existing corpora stamp this hand with, and the registry resolves it only for a lookup that asks
    # for aliases, which the lookup behind this key does not. Unset here, so no overlay inherits a
    # hand: each cell profile names its own (the sim and ursim profiles the 2F-85, the hande layer
    # the Hand-E). The sim derives from it which gripper Isaac puts on the arm, the self collision
    # guard its mesh bundle, and `python -m src.config` refuses a name no registry file defines, or
    # the short name. So this base tree alone does not build a UR arm: its exact mesh guard reads
    # hand geometry, and it refuses with a sentence until a profile names the hand.
    # model: robotiq_2f85

    # The plates between the flange and the hand's own mounting face; their thicknesses sum to where
    # the hand sits. Only a hand whose sphere map starts at its mounting face takes them (the Hand-E,
    # whose layer writes them), and it refuses to build without; a hand its arm asset already placed
    # (the 2F-85) refuses any. [] says the hand is bolted straight to the flange.
    #
    # A plate that also declares `cross_section_mm`, the two half extents across the approach, becomes
    # a collision body; one without places the hand and is named as a gap nobody measured.
    # coupling_plates:
    #   - name: tool_changer
    #     thickness_mm: 48.0
    #     cross_section_mm: [45.0, 45.0]

    # Where the grasp centre sits on the flange. Left undeclared here on purpose: this is a
    # per-cell bench measurement of the coupling plate plus the gripper, and a plausible-looking
    # default is how the next cell inherits a wrong frame in silence. A real UR driver refuses to
    # connect while this says `undeclared`; that refusal is the feature.
    #
    # Why it matters: every pose this stack commands is the grasp centre, and the UR driver hands
    # poses straight to moveL in whatever frame the controller's tool register holds. At the UR
    # factory default, identity at the flange, a top-down grasp commanding z=37 mm drives the
    # flange to 37 mm and the fingertips about 95 mm below the table. No guard names the cause: the
    # workspace guard bounds the commanded number, and this file declares no fixture, so a table
    # exists only where a profile adds one, as robot.ur5e.yaml adds a bench.
    #
    #   source: "willy"      this driver composes flange to TCP itself and the controller runs a
    #                        bare flange. Needs no vendor SDK call. The cuRobo path, which plans
    #                        to tool0 and executes moveJ, is handed the flange goal in both modes.
    #   source: "controller"  an operator set the TCP on the teach pendant; the driver passes poses
    #                        through and only verifies that the controller agrees.
    #
    # Either way connect() derives what the controller is actually running, the bundled DH table's
    # base-to-flange transform inverted and composed with getForwardKinematics(q), and refuses a
    # mismatch beyond `verify_tolerance_mm`. No setTcp is involved: nothing writes the controller's
    # tool register. getTCPOffset is not part of this derivation either, though connection.py calls
    # it once per connection so fk(q) can pass an explicit offset. The two modes predict different
    # answers, identity
    # against the declared transform, 132 mm and 90 deg apart for the 2F-85, so a passing check
    # also shows which mode the cell is in.
    #
    # For a 2F-85 on a UR flange the sim driver carries
    #   offset_mm: [0.0, 132.0, 0.0]
    #   rotation_quat_xyzw: [-0.70710678, 0.0, 0.0, 0.70710678]   # -90 deg about flange X
    # Measure them on the real coupling before trusting them, and take safety.payload.cog_mm in the
    # same bench session. The registry's grasp_centre_mm for the 2F-85 (grippers/robotiq_2f85.yaml)
    # is 146.5, an estimate off the pad face, and the `grasp centre` preflight row warns on 132 until
    # one of the two is measured.
    tool_frame:
      source: "undeclared"

  calibration:
    # How long the routine waits after each pose move before it captures: spent on the driver's
    # steady signal where it has one, slept otherwise.
    settle_time_s: 0.5

    # How many counted samples a calibration guided by hand collects before it solves
    # (`calibrate --freedrive`); `--samples` sets it for one run, and `q` finishes earlier.
    freedrive_samples: 15

    # RMSE bands in mm that label a hand-eye calibration result, each an inclusive upper bound and
    # strictly increasing. They label the result and do not gate it: the extrinsics are saved
    # whatever the RMSE, so judging it stays with the operator.
    quality_bands_mm:
      excellent: 1.0
      good:      2.5
      marginal:  5.0

  # ----------------------------------------------------------------------
  # Vendor-neutral safety knobs. Enforced in addition to controller-side
  # safety (UR safety planes, KUKA SafeOperation and the like); the more
  # restrictive value always wins. Tighten these for fragile
  # end-effectors or smaller maintenance cells.
  #
  # Every guard runs on every cell, none can be switched off (the owner's
  # cleanup, 2026-10-17). The workspace margin, the joint limits, the IK
  # quality and the motion continuity run at the arm's own numbers
  # (src/robot/safety/guard_numbers.py, every real arm the owner's cell's:
  # 20 mm inside the workspace box; the arm's own joint envelope, 5 deg inside
  # each end and every full-turn joint within half a turn of home; IK jumps of
  # at most 1.0 rad, a singular value of 0.005, a condition number of 250,
  # 2 deg from a limit; 45 deg, 30 deg and 250 mm between two targets). See
  # src/robot/safety/preflight.py for the canonical guard order.
  # ----------------------------------------------------------------------
  safety:
    # Mass / CoG / inertia envelope of the mounted tool plus payload. ``mass_kg`` is what is
    # mounted now, ``max_mass_kg`` is the absolute upper bound the guard refuses to set regardless,
    # ``cog_mm`` is the centre-of-gravity offset from the flange and ``inertia_kgm2`` the diagonal
    # tensor. A real UR pushes mass_kg and cog_mm to the controller at connect, so the shipped
    # mass_kg: 0.0, "not weighed yet", is refused there rather than overwriting the controller's
    # payload for a tool that is really mounted. Weigh the whole assembly (coupling plate,
    # wrist-borne cables and hoses, any carried workpiece) and set both keys. A declared mass left
    # at cog_mm [0, 0, 0] is refused too: that describes a point mass at the flange face.
    payload:
      mass_kg: 0.0
      max_mass_kg: 5.0
      cog_mm:      [0.0, 0.0, 0.0]
      inertia_kgm2: [0.0, 0.0, 0.0]

    # Link-against-link and link-against-fixture collision. ``capsule`` is the always-available
    # proxy: each arm link becomes a 60 mm capsule, the hand's fingers one capsule from its registry
    # file and the base a column up to the shoulder, and every pair is checked in closed form. Every
    # path is judged whole first: each guard names the first sample it might refuse, and every sample
    # from it on is judged one at a time. ``min_distance_mm`` is the
    # smallest signed distance two monitored shapes may reach. ``mesh_dir`` names a directory
    # holding a ``{model}_collision_meshes.npz`` bundle in place of the one shipped with the safety
    # package. ``fixtures`` are axis-aligned boxes in the base frame, checked by both backends. They
    # stay the guard's: the planner is told the bench and the meshes of ``planning_world`` and what
    # the cameras see. An empty list leaves the bench, the bin and every wall invisible to the guard.
    self_collision:
      # Exact meshes, not the capsule proxy. The proxy cannot see the gripper at a joint gate: it
      # builds the tool capsule from target_pose, and gate_joint_target, which every commanded
      # joint move takes, never sets one. The cuRobo final-config gate is a pose gate and does set
      # one. The two disagree on a large share of arm configurations: at joints
      # [1.95, 0.38, -1.33, -0.55, 2.00, 0.79] the proxy accepts and the meshes reject with
      # `forearm|lfinger: mesh distance 0.367 mm`, and there are configurations the proxy
      # accepts whose true mesh distance is 0.000 mm. Cost: about 0.085 ms for the proxy
      # against about 9.6 ms per check.
      # Requires an engine (python-fcl, or Coal via WILLY_COAL_PREFIX) and a bundle for the model;
      # with either missing the guard warns once and runs the capsule proxy instead. An arm the
      # registry does not describe as a UR has neither and falls back to the proxy by construction.
      backend: "fcl"
      min_distance_mm: 3.0
      # planner_margin_mm is deliberately absent here, in the manner of robot.gripper.model. It is
      # the clearance the planner keeps, and how much of it an arm can absorb depends on the arm
      # and the hand: every UR plans at 4, and the UR5 finds no retract at all at 8 or 10. A UR
      # cell that plans with cuRobo declares it in its own profile, or it refuses to start a
      # planner rather than inheriting a number nobody measured for that pair, and a committed
      # evidence file has to have measured the combination at that margin. It pads the planner's
      # model only: where the padded spheres alone refuse a pose this guard accepts, on the arm's
      # own pairs, this guard decides (docs/guide/04-robot-and-safety.md, section 6).
      mesh_dir: null
      fixtures: []
      # How close the arm may come to a box a camera saw. That box holds the thinned cloud, one point per
      # 10 mm camera voxel, grown by the 6 mm every cell's camera world grows its boxes by, so 2 keeps the
      # arm 8 mm from every point of it. A pixel the thinning dropped can lie nearer, at an oblique face or
      # an edge: measured down to 10.9 mm past the points kept (docs/guide/04-robot-and-safety.md, section
      # 5.5). `min_distance_mm` stays for the arm against itself and for every declared fixture. This, plus
      # the 6 mm, has to reach `min_distance_mm`, the step every path is sampled at, or the load refuses.
      # Below 1 the load refuses too: where only the camera's boxes refuse the planner's world, the exact
      # guard alone decides them.
      # 2, the owner's 1 to 2 mm (2026-10-12): 75 of the replay bank's 116 picks have a grasp it admits, 71 at 3.
      perceived_min_distance_mm: 2.0

    # What the trajectory planner is told about the cell: the bench it stands on, the meshes
    # below, and what the cameras see. It is on wherever `support_plane` is declared, because
    # registering a world replaces the planner's own rather than adding to it. Without a bench, as
    # shipped, the planner knows its own robot model and a generic 1.6 m table, and nothing else:
    # not the bench, not the bin. It plans straight through them, and only the exact guard objects,
    # which judges every sample of a path but cannot shape one. The guard's fixtures above stay the
    # guard's; the cameras find what the parts stand on.
    #
    # Declaring the bench also turns on the camera world, which rebuilds the world from the cameras
    # before every plan, including moves that have nothing to do with a pick. That is the point:
    # a world registered once is a photograph, and everything that arrived afterwards is
    # invisible to the planner while looking exactly like empty space in every log there is. It
    # has a price: a frame older than 2000 ms refuses the motion, and a camera that still cannot
    # vouch for the cell after 3 more readings stops it with an error, not a refusal.
    # Every enabled RGB-D rig that declares its calibration feeds that world, the primary first, so
    # a second calibrated camera that cannot answer stops every planned motion too.
    #
    # On a cuRobo cell the bench is not optional once a rig declares its calibration: a planned
    # motion with neither a live world nor a decline is refused before planning, so such a cell
    # without a bench does not build, and the checklist's `camera world` row blocks it first. An
    # uncalibrated cell builds, and every planned motion then needs
    # `robot.without_camera_world("<why>")`.
    #
    # The rest is every cell's since 2026-10-17 (the owner's cleanup): a pick and a place judge
    # across their standoff, their carry and their drop in the world they hold, a world the
    # planner confirms only in part refuses the motion, and no part in the jaws is modelled: a
    # closed hand is judged as an empty one, by the exact guard at full stroke. How far the parts
    # hang below the fingertips is `robot.place.part_hang_mm`.
    planning_world:
      # Measure three things at the bench and this block is done. `height_mm` is the top surface of
      # whatever the robot stands over, read with a rule against the robot's base plate, sign
      # included (a bench below the base plate is negative). `extent_mm` has to cover everywhere the
      # arm can reach over it; oversizing is cheap, a gap is not.
      #
      #   support_plane:
      #     height_mm: -5.0                 # bench top, 5 mm below the robot's base plate
      #     extent_mm: [1600.0, 1600.0]     # 1.6 x 1.6 m of bench
      #     thickness_mm: 50.0              # body, so a path cannot slip underneath
      #     center_mm: [0.0, 0.0]           # where the slab sits; the default is under the base
      #
      # `center_mm` matters when the robot is not bolted to the middle of its table. A base at the
      # head of a bench running x=250 to x=800 has no bench under the half it works over unless
      # the slab is moved there, and the alternative is to oversize `extent_mm` until a centred
      # slab reaches it. Both work. The second also covers the space behind the robot, which is
      # harmless where `motion.workspace` already forbids it and confusing to read.
      #
      # Put the slab's top where the bench is. The camera world takes its floor from this same
      # `height_mm`: it drops as bench only what lies within 5 mm of the slab's top, the bench band
      # every cell's camera world keeps, so a slab sunk below the bench brings every bench pixel the
      # camera sees back as one obstacle over the whole view, and every low pick is refused. A
      # declared fixture or mesh keeps its own 5 mm band (`perceived.DECLARED_SURFACE_MM`), so a
      # part beside a declared tote stays an obstacle, and the grasp planner keeps its own 5 mm
      # floor over the support (`grasping.scene.SUPPORT_READ_ERROR_MM`), so a low part still gets a
      # grasp.
      support_plane: null
      # Geometry the planner routes around as the shape it is rather than as a box. The case that
      # pays for itself is a container: as a box a tote is solid, so a cell that declares one can
      # never reach into it; as a mesh it keeps its hollow. The sidecar reads the file itself, and
      # anything trimesh loads works. A relative path is read against this config folder, as every
      # path in the tree is, and reaches the sidecar absolute.
      #
      # The guards cannot read a mesh. Geometry declared here is known to the planner and to
      # nothing else, so where the shape must also be enforced, declare the parts that matter as
      # `self_collision.fixtures` boxes as well.
      #
      #   meshes:
      #     - name: tote
      #       path: meshes/tote.obj           # <config folder>/meshes/tote.obj
      #       center_mm: [500.0, 0.0, 0.0]
      #       yaw_deg: 0.0
      #       scale: 0.001                  # a mesh authored in millimetres
      meshes: []
      # What the cameras see becomes obstacles wherever the bench is declared. Every plan waits for a
      # depth frame, converts it and registers a world: boxes of what the cameras saw, grown by
      # 6 mm, and every column they measured as a 10 mm distance field, beside the fine world the
      # guard holds about a motion's goal. A frame with no depth is refused as blind, and so is a
      # fixed camera's frame less than half of whose pixels hold one; a goal the cameras look at but
      # none can measure around is refused as unseen. Measured on one camera at 848 x 480: 9 ms to
      # build boxes and a distance field. Its numbers are every cell's since 2026-10-17, the owner's
      # cell's (src/robot/safety/planning/perceived.py, the CAMERA_* constants): no key tunes them.

  # ----------------------------------------------------------------------
  # Vendor-neutral grasping behaviour: which mode runs, how many attempts,
  # where records go. Safety stays under `robot.safety`; nothing here can
  # relax a safety limit or unlock a recovery action the mode profile forbids.
  #
  # The camera fusion and the recovery have no keys: a cell fuses its calibrated
  # cameras by itself and recovers as the owner's cell did (2026-10-16). Every
  # knob this section has:
  #
  #     python -m src.config where grasping --tier all
  # ----------------------------------------------------------------------
  grasping:
    # The learned 6-DoF grasp generator, selected by `grasping.calculator: deep`. Inert while
    # `calculator` is `geometric`, which is the default. Fail-closed when it is not: `calculator:
    # deep` with no readable artifact refuses to build the cell rather than quietly running the
    # analytic stack under the learned generator's name.
    deep_generator:
      # Weights written by `python -m src.robot.grasping.deep train-set`. Null means the learned
      # generator cannot be selected, and `calculator: deep` then refuses. The file is checked by
      # its stamped kind and artifact version before it loads, so weights from an older generator
      # are refused by name instead of run.
      artifact_path: null
      # Torch device for inference. Null resolves it the way every other model does, through
      # `src/utility/device.py`, so `WILLY_DEVICE` is honoured; a named device the machine does not
      # have raises rather than falling back to CPU.
      device: null
      # Graspability cut belonging to an older decoder that this build does not load. The generator
      # `calculator: deep` runs ranks by its own per-slot confidence and reads this key nowhere, so
      # setting it changes nothing; the generator logs that once at load.
      minimum_score: 0.5
    # The learned grasp ranker, in shadow: it scores every candidate, telemetry records what it
    # would have chosen, and the order never changes. Enabling it adds the `deep_ranker_*` keys and
    # changes no ordering and no decision; `deep_ranker_would_change_top1` is the point, because it
    # answers on real picks whether turning it on would do anything.
    deep_ranker:
      enabled: false
      # Where the fitted ranker lives. The card beside the trees is committed, the trees are not;
      # regenerate them with `python -m datagen train-ranker`. ${WILLY_PROJECT_ROOT} is the
      # repository, where that writes, so the path holds wherever this config folder lives.
      artifact_dir: "${WILLY_PROJECT_ROOT}/assets/models/grasp_ranker/v1"
      # Which feature contract to score under. It must match the artifact: the scorer refuses a
      # mismatch rather than scoring a vector the model was never fitted on. `held_jaw_v1` predicts
      # whether a shake could not pull the object out; `valid_jaw_v1`, shipped beside it, predicts
      # this stack's own analytic verdict, which makes anything measured with it self-referential.
      spec: held_jaw_v1
    # What the parts stand on besides the bench. The bench is the planner world's support_plane
    # (robot.safety.planning_world.support_plane, 0 mm where none is declared): level, raised to a part's
    # own lowest point wherever its cloud saw down its side, never lowered, and the gripper keeps 1 mm over
    # it, the guard's finger floor. The plane is resolved per pick by
    # `src/robot/grasping/collision/support_resolver.py`.
    support:
      # The bin, tray or KLT the parts sit inside, if there is one. Everything here defaults to no
      # container, which is what this cell has.
      container:
        # The inside floor in BASE mm, the surface the parts rest on: not the height of the bin,
        # not its rim. A KLT standing on the table raises what its contents rest on by the
        # thickness of its own floor, and a planner that takes the table for the support will
        # allow a finger that many millimetres too low. Null uses the bench.
        floor_height_mm: null
        # Lower corner of the container's interior box in BASE mm (x, y, z), the empty volume parts
        # are poured into; z is the inside floor, the same surface as `floor_height_mm`. A cell
        # with a bin declares something like [300.0, -100.0, 0.0].
        interior_min_mm: null
        # Upper corner of that interior box in BASE mm. z is the rim, the height a finger may pass
        # over from outside, and every axis must exceed `interior_min_mm`: [600.0, 100.0, 147.0].
        interior_max_mm: null
        # Treat the four vertical walls of the interior box as collision geometry, sampled into
        # points and appended to what the candidate filter already checks. That filter sees a
        # target cloud, the neighbours' clouds and a support plane, and a plane is a floor, so a
        # bin wall stays invisible until this is on; declaring the box alone changes nothing, this
        # flag is the decision. No camera closes that gap, because no detector segments a wall as
        # an instance. Set it for safety rather than for the pick rate: it finds no extra grasps,
        # it stops the ranker offering one that drives a finger into the side of the bin, which is
        # the difference between a retry and a collision. Fail-closed: setting it without both
        # interior corners raises at config load, because a cell that wrongly believes its walls
        # are protected is worse than one that knows they are not.
        wall_collision_enabled: false
        # How far outward from each interior face the wall material is sampled. Sampling only the
        # inner face would leave a finger standing inside a thick wall undetected. A KLT wall is
        # typically 3 to 8 mm.
        wall_thickness_mm: 5.0
        # Point spacing on the sampled walls. Matches the calculator's cloud voxel (8 mm), so wall
        # points arrive at the density of the neighbour points they are checked alongside.
        wall_sample_mm: 8.0
    # Which behaviour profile a pick runs under when the caller names none: `easy` never moves to
    # recover, `auto` may look again (`rescan`) and `dense_clutter` may also push the part aside
    # (`nudge_target`), the owner's cell's. `closed_loop` and `dense_autonomous` were removed on
    # 2026-09-29 and are refused at load with the mode to name instead.
    default_mode: "dense_clutter"
    # The JSONL file every `pick()` appends its `GraspAttemptRecord` to, which
    # `python -m src.robot.grasping.replay` reads for its KPIs and failure taxonomy. Null, or an
    # environment reference that expands to nothing, is grasp_records.jsonl in the log folder.
    record_log_path: null
