# Runtime tuning for the app-level services.
#
# Every block is operator-tunable. image_encoding cannot move the robot. greeting decides whether
# "Hallo Willy" in the chat waves at once, on a click, or not at all: the wave is two swings of the
# wrist, each judged by the exact guard like every motion. commands decides whether the cell's
# everyday sentences are read without the language model; a reading moves nothing either way. task
# holds what a task takes where it says nothing itself, for every browser of the cell: the console's
# Settings page ("Auftrag") writes it into the cell's own layer, app/runtime.<layer>.yaml of the
# chain's last layer (app/runtime.cell.yaml under --profile ur10,hande,cell), never into this file,
# and none of it starts a task. The file is optional and the schema defaults apply when it is
# absent. Validation is by `RuntimeConfig` in src/config/schema/runtime.py on every load.

runtime:
  image_encoding:
    frame_quality: 60              # JPEG quality, 1 to 100, for the console viewfinder frames
  greeting:
    # "Hallo Willy" in the chat: direct (Willy waves at once, no click), confirm (a dialog like
    # Home's asks first), off (Willy only greets back). The owner, 2026-10-06: direct for now.
    wave: direct
  commands:
    # Known sentences ("Alle grauen Würfel in die Gelbe Kiste.", "Hallo Willy") are read without
    # the language model, as the model was measured to read them: well under a millisecond instead
    # of about ten seconds. Every other sentence goes to the model. false: every sentence goes to
    # the model. The owner, 2026-10-08: on.
    known_sentences: true
  task:
    # How a typed or spoken task starts: enter (Enter starts a clean reading at once on a ready
    # cell, and the card opens for every other), card (Enter only reads; Start on the card
    # starts). The owner, 2026-10-08: "Enter startet sofort".
    start: enter
    # The mode of a task Enter starts: once or until_empty. "Alle" in the sentence does not
    # change it, and a sentence that singles out one part runs once either way.
    scope: once
    # Where the part goes when the sentence names no place: default (robot.motion.default_place_pose),
    # pose:<name> (a taught pose), camera:<phrase> (what the camera finds: camera:yellow bin).
    place: default
    # A sentence that names no part: true ticks "alles, was die Kamera sieht" on its card; false
    # leaves the tick to the person. Such a card never starts on Enter.
    anything: false
    # How each pick looks: first (the first look only), when_needed (the looks until a grasp is
    # safe), every (every configured look). A card may change it for its task.
    looks: when_needed
    # Whether the parts are critical: false pushes a boxed-in part first (the push may shove the
    # neighbours in its way) and clears a blocker where no push plans; true pushes nothing and
    # clears a blocker instead. A task may say otherwise for itself in the console's advanced
    # drawer. Read when the cell is built. Until 2026-10-16 this was
    # robot.grasping.recovery.critical_parts.
    critical_parts: false
