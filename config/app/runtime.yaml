# Runtime tuning for the app-level services.
#
# The one block here is operator-tunable and not safety-critical: editing it cannot move the robot.
# The file is optional and the schema defaults apply when it is absent. Validation is by
# `RuntimeConfig` in src/config/schema/runtime.py on every load.

runtime:
  image_encoding:
    frame_quality: 60              # JPEG quality, 1 to 100, for the console viewfinder frames
