# Camera overlay for `WILLY_PROFILE=web`, a development rig built from two USB webcams. The layer
# name means webcam; it has nothing to do with a web service.
#
# The loader deep-merges this onto `camera/cam.yaml`, so it states only what changes: skip the
# device probe, and open exactly the webcam pair. Everything else, the `webcam_main` rig definition
# included, stays in `cam.yaml`; restating keys here would let the two copies drift apart.
#
# The layer name selects three files (`app/runtime.web.yaml`, `camera/cam.web.yaml` and
# `robot/robot.web.yaml`), so renaming the profile means renaming all three.
cameras:
  # The rig has to be defined in `cam.yaml`; the schema refuses the tree if it is missing.
  primary_rig_id: webcam_main
