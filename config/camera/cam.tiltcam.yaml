# ============================================================================
# Tilted dual-D435 camera rig: the camera half of a two-camera cell.
#
#   WILLY_PROFILE=ur3e,tiltcam        real UR3e cell with the tilted pair
#   WILLY_PROFILE=sim,ur3e,tiltcam    the same optics in Isaac
#
# Paired with `config/robot/robot.tiltcam.yaml` under the same profile name on
# purpose. That file places two eye-to-hand cameras at 70 deg elevation, 900 mm
# from the aim point, and authors their lens to a D435's 69.4 deg RGB field of
# view. This file is the other half: the two physical cameras those positions
# describe. Under two separate profile names a cell could run the tilted
# geometry against a single-camera config, or the reverse, and neither half
# would report a problem.
#
# The complete camera set is restated here rather than patched. `cameras.rigs`
# is a list, `src/config/_merge.py` replaces a list wholesale, and the base
# `config/camera/cam.yaml` carries a single RGB-D rig, so a two-camera cell
# cannot be reached by overlaying fields onto that rig.
#
# The serials are the point. Two identical D435s on one bus can only be told
# apart by serial: `RealSenseRGBDStreamer` binds a device with
# `rs_config.enable_device(serial)` and, with no serial, takes whatever the SDK
# offers first, an enumeration order that survives neither a reboot nor a
# replug. Two cameras that swap identity do not fail. They produce a complete,
# plausible scene with left and right exchanged, every fused position mirrored
# about the rig axis, and the pick goes confidently to the wrong place.
#
# So both rigs ship disabled with null serials: the tree loads, and enabling
# both while a serial is still null makes `CameraSystemConfig` in
# `src/config/schema/camera/cam_schema.py` refuse the tree, with a message that
# says how to read the serials. The same validator refuses one serial written
# on both rigs, which would bind a single physical camera twice.
#
#   Bench step: read the serials, one line, with either camera unplugged first
#   to be certain which is which:
#
#     rs-enumerate-devices -s
#     # or:
#     python -c "import pyrealsense2 as rs; print([d.get_info(rs.camera_info.serial_number) \
#       for d in rs.context().devices])"
#
#   Then set `serial_number` per rig and `enabled: true` on both.
#
# Naming: the rig ids match the robot layer's camera keys (`oblique_L` /
# `oblique_R`) so the two halves read as one cell. Which physical camera is
# "left" is decided by the serial set here, not by cable order.
#
# The geometry mirrors `config/robot/robot.tiltcam.yaml` and states an intended
# mounting: no D435 pair has been enumerated, calibrated or streamed by this
# repository.
# ============================================================================
cameras:
  rigs:
    - rig_id: oblique_L
      enabled: false           # Enable only after serial_number below is filled
      source: rgbd

      device_index: 0          # Ignored once serial_number is set; kept for a one-camera fallback
      serial_number: null      # Required before both rigs are enabled; see the header
      fps: 30
      backend: 0

      color_resolution: [1280, 720]
      depth_resolution: [1280, 720]
      align_depth_to_color: true

      rgbd_backend: realsense
      realsense:
        enable_emitter: true
        laser_power_mw: null
        visual_preset: null
        depth_units_m: null
        export_intrinsics: false
        post_processing:
          decimation: false
          spatial: true
          temporal: true
          # A tilted view sees object sides at a steep angle, which is where a D435 drops depth.
          # Hole filling invents surface, and the top-referenced grasp depth in
          # `src/robot/perception/realsense_source.py` takes the nearest real surface over the
          # mask, so it would sample that invented geometry. An unfilled hole stays measurable:
          # `python -m src.robot.perception` prints the hole fraction inside each mask, while a
          # filled hole reports a confident wrong number.
          hole_filling: false

      # Under `rgbd_backend: realsense` only warmup_frames is read: RealSenseRGBDStreamer
      # discards that many frames before reading intrinsics. The other three keys are read
      # by the opencv backend alone.
      quality:
        prefer_uncompressed: false
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/oblique_L

    - rig_id: oblique_R
      enabled: false           # Enable only after serial_number below is filled
      source: rgbd

      device_index: 1
      serial_number: null      # Required before both rigs are enabled; see the header
      fps: 30
      backend: 0

      color_resolution: [1280, 720]
      depth_resolution: [1280, 720]
      align_depth_to_color: true

      rgbd_backend: realsense
      realsense:
        enable_emitter: true
        laser_power_mw: null
        visual_preset: null
        depth_units_m: null
        export_intrinsics: false
        post_processing:
          decimation: false
          spatial: true
          temporal: true
          hole_filling: false

      quality:
        prefer_uncompressed: false
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/oblique_R
