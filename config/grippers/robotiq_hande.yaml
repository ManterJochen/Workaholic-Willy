# The Robotiq Hand-E, described once.
#
# The one description of this hand. A cell naming robotiq_hande takes its actuation widths and its collision
# envelope from here; no robot layer restates them. They come from one measurement session off
# robotiq_hande_ur5e_collision_meshes.npz, plus finger_behind_mm and palm_thickness_mm, measured by
# scripts/grippers/measure_jaw_from_bundle.py.
#
# The jaw faces stand 49.99 mm apart and the stroke closes to 0.00 mm: what the asset holds, not a datasheet's
# 50. 0.0 is the bare gripper. Custom fingertips that do not meet are a different closed width, and a cell that
# states one is refused until this file says the same. min_width_mm is a policy floor about the part, 5 mm on
# any hand, and it does not scale with the stroke.
#
# The finger numbers are the material outside the housing. Each finger reaches 8.69 mm past the centre line
# inside the housing on a carriage, which the palm box covers: the finger box has its inner face pinned at the
# gap, so the carriage in it would be a solid block exactly where the object goes. A known under-model: between
# 24.6 and 34.7 mm behind the grasp centre the carriage shoulder narrows the passage to 36.7 mm, and a box cannot
# be thicker at the back. Raising finger_pad_overlap_mm to 6.65 would cover it and refuse every object over
# 36.7 mm even for a shallow grasp, so it stays at 2.0. This box is a candidate filter; Coal and cuRobo refuse
# against the vertex-exact bundle, which has the shoulder, so the cost is a plan rejected later, not a collision.
#
# Grasp frame: X closes between the contacts, Y is the binormal, Z is the approach, z = 0 is the grasp centre,
# 135.75 mm from the gripper's own mounting face. The coupling plate between that face and the flange is in no
# number here; it is a bench measurement (robot.hande.yaml: tool_frame and robot.gripper.coupling_plates).
#
# The contact patch is the committed 20.91 mm. It is 0.91 mm longer than the flat jaw face in the bundle
# (20.00 mm from 126.20 mm), down the chamfer below the face. The committed patch is kept, and the suite
# pins the difference, so a re-baked bundle that changes it is noticed.
gripper:
  model: robotiq_hande
  kind: parallel_jaw
  source: >-
    Isaac asset Robotiq/Hand-E/Robotiq_Hand_E_edit.usd, baked into robotiq_hande_ur5e_collision_meshes.npz by
    scripts/grippers/bake_gripper_variant.py and measured off that bundle at full open: the jaw faces 49.99 mm
    apart, the fingertip 10.45 mm past the grasp centre, the finger material outside the housing 36.53 mm
    behind it (the carriage inside the housing belongs to the palm), 10.80 mm thick and 29.24 mm wide, and the
    housing 104.12 mm deep from the finger box to its coupling bolts and 75.00 mm across. The contact patch and
    the 2.0 mm envelope overlap are the committed values. The friction is a default.
  # The robot.gripper.vendor drivers that can actuate this hand: the Robotiq driver over the socket the
  # URCap opens. A real UR profile naming this hand with another driver is refused at load; none and dummy
  # are always admitted.
  drivers: [robotiq]
  jaw:
    # Where the grasp centre sits along the approach, from this hand's own bundle origin. Every other
    # number here is relative to it, so without it these numbers are a shape with no place on an arm:
    # measured off robotiq_hande_hand_meshes.npz, from that bundle's own origin, which is the hand's
    # mounting face rather than the flange.
    grasp_centre_mm: 136.2
    aperture_mm: 49.99
    min_width_mm: 5.0
    closed_width_mm: 0.0
    finger_ahead_mm: 10.45
    finger_behind_mm: 36.53
    finger_length_mm: 36.53
    finger_thickness_mm: 10.80
    finger_width_mm: 29.24
    finger_pad_overlap_mm: 2.0
    pad_length_mm: 20.91
    pad_ahead_mm: 10.45
    pad_behind_mm: 10.46
    palm_depth_mm: 104.12
    palm_width_mm: 75.00
    # The housing along the closing axis, twice its furthest reach from the grasp axis, off the same bundle.
    palm_thickness_mm: 75.0
    palm_measured: true
    friction_coefficient: 0.5
    friction_is_default: true
