# SAM2, the mask source of every perception stack: one box in, one mask out, built by
# `src/models/factory.py`. The id is read from <models.weights_root>/segmentation/<org>--<name>,
# which `python scripts/model_weights/fetch.py sam2` writes, 0.9 GB; it loads with fp32 weights under
# fp16 autocast, which keeps small parts whole (src/models/_inference.py).
segmenter:
  model_id: "facebook/sam2-hiera-large"
