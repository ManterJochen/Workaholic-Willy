# Hand and gesture detection with MediaPipe: optional and standalone.
#
# Nothing in the grasp pipeline reads this. It is read when a caller builds a detector through
# `src.models.handdetection.factory`, or by that package's CLI:
#
#     python -m src.models.handdetection --check      # mediapipe installed? bundles present?
#     python -m src.models.handdetection --rig <id>   # locate a hand in the base frame
#
# Two things have to be in place, and each fails closed with an actionable message rather than
# silently:
#   1. mediapipe, pinned in requirements.txt.
#   2. the `.task` model bundles: an operator download, URLs in the comments below. They are
#      binaries and the operator picks the revision, so they are not committed; `.gitignore` keeps
#      a local download out of the index, and `--check` prints the URL for a bundle it cannot find.
handdetect:
  # The hand-landmark bundle: 21 landmarks per hand, no gesture head. Smaller and faster than the
  # gesture bundle, and all that is needed when only the palm centre matters. A relative path
  # resolves against the process working directory.
  # https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
  model_path: "assets/models/mediapipe/hand_landmarker.task"

  # Upper bound on hands tracked at once. The 3-D HandFinder needs exactly one hand and skips a rig
  # that shows more, so this is deliberately not 1: the second hand has to be seen to be refused.
  max_hands: 2

  # MediaPipe confidence floors, each 0.0 to 1.0. `threshold` is whether a hand is in the frame at
  # all, `presence_threshold` whether the hand already being tracked still is, `tracking_threshold`
  # the frame-to-frame association.
  threshold: 0.5
  presence_threshold: 0.5
  tracking_threshold: 0.5

  # Not a MediaPipe parameter. The disc around the palm centre whose median depth becomes the
  # hand's distance: too small and one dropout on skin loses the hand, too large and it starts
  # averaging in whatever is behind the hand.
  palm_patch_radius_px: 15

  # How many valid depth pixels that disc must contain before its median is believed. Below this
  # the rig contributes no distance: a median over three surviving pixels is a number, not a
  # measurement.
  min_depth_samples: 20

gesturedetect:
  # The canned gesture bundle. It embeds a hand landmarker, so it returns landmarks as well as
  # gestures: a cell that wants both configures this model alone rather than running two over one
  # frame. The classifier knows seven shapes; thumbs-up and thumbs-down are mapped and the rest are
  # reported as OTHER.
  # https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task
  model_path: "assets/models/mediapipe/gesture_recognizer.task"

  max_hands: 2
  threshold: 0.5
  presence_threshold: 0.5
  tracking_threshold: 0.5

  # The score a thumbs-up must reach to be reported as one. Below it the answer is no gesture, not
  # a low-confidence thumbs-up. Raise it wherever a false confirmation costs something.
  min_gesture_confidence: 0.5
