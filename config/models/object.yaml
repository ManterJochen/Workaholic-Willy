# The detector a cell builds, read by `src.models.factory.build_perception`.
#
# `kind: zero_shot` grounds any prompt with the VLM, Qwen3-VL, and `kind: closed_set` answers with
# RT-DETR's trained classes, reading a prompt only as a class-name filter. SAM2 cuts every box either
# way (models/segmenting.yaml). A model is named by its model_id alone: a Hugging Face id is read
# from <models.weights_root>/<kind>/<org>--<name>, the folder `scripts/model_weights/fetch.py`
# writes (models/weights.yaml), and nothing downloads at run time. How each model loads and answers
# is fixed in code at the values the owner's cell ran (src/models/_inference.py, src/models/vlm/qwen.py).
pipeline:
  kind: zero_shot             # zero_shot = the VLM grounds free text; closed_set = RT-DETR's classes

  zero_shot:
    vlm:
      # VRAM is the constraint: this model shares the card with the segmenter, so the checkpoint
      # has to fit in what that leaves. The schema default is the FP8 variant of this id; the bf16
      # checkpoint is set here, and it is the one the VLM tests and the measured coordinate space in
      # `src/models/vlm/qwen.py` come from. `python scripts/model_weights/fetch.py vlm-4b` fetches it,
      # 9 GB; the owner's cell runs Qwen/Qwen3-VL-8B-Instruct (`vlm-8b`). The VLM also reads the
      # console's commands on a closed-set cell, where a person loads it first.
      model_id: "Qwen/Qwen3-VL-4B-Instruct"

# The closed-set detector: RT-DETR's trained COCO classes, no prompt. Required by
# `pipeline.kind: closed_set`, which is refused without it. `python scripts/model_weights/fetch.py
# rtdetr` writes the folder this id is read from, 0.2 GB. A detector you trained is named by its
# folder: model_id: "D:/models/chess", the out_dir of a DetectorTraining run (its best epoch; the
# last is in last/), or "./chess" beside this config folder.
rtdetr:
  model_id: "PekingU/rtdetr_r50vd"
  # The confidence a box must clear.
  threshold: 0.4
