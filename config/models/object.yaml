# GroundingDINO, the open-vocabulary detector: it grounds a text prompt to boxes. `local: True`
# reads `model_path` from disk and downloads nothing, and `python scripts/model_weights/fetch.py
# dino-tiny` writes exactly that directory. `local: false` pulls `model_id` from the Hub instead,
# which is the same weights without the guarantee that deleting this checkout deletes them.
# `threshold` is the confidence a box must clear. ${WILLY_PROJECT_ROOT} is the repository, where
# the fetch writes, so every model path here holds wherever this config folder lives; a relative
# path would be read against the config folder.
objectdetector:
  model_path: "${WILLY_PROJECT_ROOT}/assets/models/hf/detection/IDEA-Research--grounding-dino-tiny"
  model_id: "IDEA-Research/grounding-dino-tiny"
  threshold: 0.4
  local: True
  optim:
    # Unset on purpose (2026-09-29): fp32 weights with fp16 autocast, the path that holds recall on
    # small objects. `auto` loads fp16 weights on CUDA and misses them, and naming "float32" turns
    # the autocast off as well; docs/guide/02-models.md section 6 has the table.
    torch_dtype: null
    attn_implementation: "eager"  # all this model supports; sdpa and flash_attention_2 raise
    channels_last: true
    compile: false             # opt-in; can speed up after warm-up
    compile_mode: reduce-overhead

# Which detector `build_object_detector` builds: "groundingdino" grounds a text prompt, "rtdetr"
# answers with its trained classes and reads a prompt only as a class-name filter, raising on one
# longer than two words. While the `pipeline` block below is set, that block decides instead for
# anything built through `build_perception`, which is how a cell is assembled; this key still
# decides for `python -m src.robot.perception`.
detector: "groundingdino"

# models.pipeline: choose a whole perception stack instead of assembling one.
#
# This block is active and set to the stack a build gets by default: change one word to change the
# stack. Read by `src.models.factory.build_perception`.
#
# The legal stacks:
#   zero_shot / grounded_sam  x {sam2, oneformer}
#   zero_shot / vlm           x {sam2, oneformer}
#   closed_set / rtdetr       x {sam2, oneformer}
# Either mask source works under either grounding model, so those two choices are independent. What
# is refused is a stack that cannot run: the schema rejects the router without the VLM backend, and
# the builder rejects a kind whose model block is missing, before any weight loads.
pipeline:
  kind: zero_shot             # zero_shot = free-text prompt; closed_set = fixed classes

  zero_shot:
    # grounded_sam = GroundingDINO grounds the phrase and the segmenter cuts the mask. Fast, and
    #                reliable on plain noun phrases.
    # vlm          = Qwen3-VL grounds instead. Slower and much heavier, and the only route that
    #                handles negation, comparatives, relative clauses and non-English prompts. The
    #                phrase grounder does not fail on those: it returns a confident box for the
    #                wrong object, which is why the router exists.
    backend: grounded_sam

    # sam2      = promptable: one box in, one mask out.
    # oneformer = segments the whole image with its own trained vocabulary; the box then selects
    #             among the segments. Works under either backend, since it takes a box exactly as
    #             sam2 does, and needs the `oneformer` block in models/segmenting.yaml. Which of
    #             the two segments better is unmeasured here: a knob, not a recommendation.
    segmenter: sam2

    vlm:
      # Only consulted when backend: vlm. VRAM is the constraint: this model shares the card with
      # the segmenter, so the checkpoint has to fit in what that leaves. The schema default is the
      # FP8 variant of this id; the bf16 checkpoint is set here, and it is the one the VLM tests
      # and the measured coordinate space in `src/models/vlm/qwen.py` come from.
      model_id: "Qwen/Qwen3-VL-4B-Instruct"
      # Fetched by `python scripts/model_weights/fetch.py vlm-4b`, 9 GB, and read from disk
      # rather than the Hub for the same reason as every other block here: a download that
      # lands in the user profile outlives the checkout. This route is off by default, so
      # nothing needs those 9 GB until `backend` above says vlm.
      model_path: "${WILLY_PROJECT_ROOT}/assets/models/hf/vlm/Qwen--Qwen3-VL-4B-Instruct"
      local: true
      preload: false          # false = load on the first prompt that reaches the VLM; true = at
                              # cell build, except under router.enabled, where the route is lazy
      on_unavailable: refuse  # refuse = reject the pick; degrade = fall back to the phrase grounder
                              # and record it. Refuse is the default because the fallback is wrong
                              # on exactly the prompts that reach this route.
      # How fast it answers: one pass of the model per token of the answer, about 140 ms on the
      # cell's 8B and 32 ms on the dev box's 4B; three cubes are 108 tokens. Measured in
      # `src/models/vlm/qwen.py`.
      stop_at_answer_end: true  # end a grounding answer where its JSON array closes and a command's
                                # reading where its object closes: the same boxes and cards, one pass
                                # sooner (three after a code fence)
      prompt_lookup_tokens: 0   # 10 = propose the next tokens from the answer itself and check them
                                # in one pass: three cubes in 47 passes instead of 108. A
                                # coordinate's last digit may come out one off. 0 = off.
      text_prompt_lookup_tokens: 0  # the same for a command's reading: 128 passes instead of 617 over
                                    # ten commands, every answer identical. 0 = off. With today's
                                    # compact instruction 3 of 67 readings came out otherwise.
      decode_graphs: auto           # each pass as CUDA graphs, the attention over the answer as before:
                                    # the same answers byte for byte, a pass in 19.7 ms instead of 46.3
                                    # on the dev box. "off" = every pass as before; "on" = also on a card
                                    # older than compute capability 8.0

  router:
    # true routes each prompt: plain English noun phrases to the phrase grounder, everything else
    # (German, negation, comparatives, spatial relations) to the VLM. Requires backend: vlm, since
    # routing with nowhere better to send a hard prompt is a decision nothing can act on; the
    # schema refuses that combination and names what to set instead.
    # GET /v1/diagnostics/route?prompt=... reports which route a prompt would take, without
    # loading a model.
    enabled: false

# The closed-set detector: RT-DETR's trained COCO classes, no prompt. Required by
# `detector: "rtdetr"` and by `pipeline.kind: closed_set`; either one without this block is
# refused. `python scripts/model_weights/fetch.py rtdetr` writes `model_path`, 0.2 GB, and then
# nothing about this block reaches the network at run time.
rtdetr:
  model_path: "${WILLY_PROJECT_ROOT}/assets/models/hf/detection/PekingU--rtdetr_r50vd"
  model_id: "PekingU/rtdetr_r50vd"
  threshold: 0.4
  local: true
  optim:
    torch_dtype: auto
    attn_implementation: "eager"
    channels_last: true
    compile: false
    compile_mode: reduce-overhead
