# Sim profile overlay, deep-merged onto segmenting.yaml when WILLY_PROFILE includes sim.
# SAM2 for the simulated vision path. The weights come from the base file now, at
# assets/models/hf, so nothing downloads at run time and nothing lands outside the checkout.
# Only `segmenter` diverges here, and every other key of the base file is inherited.
segmenter:
  optim:
    # The same unset-dtype path as `object.sim.yaml`: fp32 weights with fp16 autocast, which is
    # what holds recall on small objects. A `null` leaf would keep the base value `auto` (fp16
    # weights on CUDA), so the loader's reset sentinel "__null__" is the only way an overlay can
    # force a field back to unset. `channels_last` is a memory format rather than a numerical
    # setting, and is off here.
    torch_dtype: "__null__"
    attn_implementation: "__null__"
    channels_last: false
