# Sim profile overlay, deep-merged onto object.yaml when WILLY_PROFILE includes sim.
# GroundingDINO for the simulated vision path; `local: false` fetches the weights from the Hub on
# first run. Only `objectdetector` diverges here, and every other key of the base file is inherited.
objectdetector:
  model_path: ""
  # The detector checkpoint is a per-cell choice, not a fixed best. The tiny checkpoint grounds
  # sparse scenes on which the base checkpoint returns nothing at all, and a detector that grounds
  # nothing is a cell that cannot pick; the base checkpoint is the better one on dense clutter,
  # which is why `src/willy_sim/run_dense_pick.py` overrides this field for its own scenes. On a
  # scene that yields no detection, try the other checkpoint before lowering `threshold`.
  model_id: "IDEA-Research/grounding-dino-tiny"
  threshold: 0.2
  local: false
  optim:
    # This is the recall path for small objects: `torch_dtype` and `attn_implementation` both
    # unset, so the model loads fp32 weights and runs the forward pass under fp16 autocast.
    # Small is about 46 px across here: the scene's 30 mm cube under an overhead camera 1000 mm
    # above it, at the default lens fx of about 1527 over a 640 px width.
    # Naming a dtype is not the same thing, "float32" included, because `src/models/_inference.py`
    # forwards a named dtype to `torch.autocast` as well, and small objects go missing again.
    # A `null` leaf would keep the base value `auto` (fp16 weights on CUDA), so the loader's reset
    # sentinel "__null__" is the only way an overlay can force a field back to unset.
    # `channels_last` is a memory format rather than a numerical setting, and is off here.
    torch_dtype: "__null__"
    attn_implementation: "__null__"
    channels_last: false
