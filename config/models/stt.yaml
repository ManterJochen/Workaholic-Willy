# Whisper speech to text: which checkpoint, and which language it decodes. Read by
# `src.models.speech.holder.SpeechHolder`, which the console reaches over POST /v1/voice/transcribe
# and, for a push to talk turn at the cell PC, POST /v1/voice/listen. Nothing on the grasp path
# reads this block.
#
# The id is read from <models.weights_root>/speech/<org>--<name>, which
# `python scripts/model_weights/fetch.py whisper-turbo` writes at one pinned commit, 1.6 GB. The
# Silero voice detector that scores every recording before Whisper is asked comes from the same
# folder (`fetch.py silero-vad`), and the cell PC's microphone opens at 16 kHz, one channel of
# int16 in blocks of 8000 frames: both fixed in src/models/speech.
stt:
  model_id: "openai/whisper-large-v3-turbo"
  # `auto` picks German or English per recording; `german` or `english` forces that language token.
  # Whisper transcribes and never translates, so the text stays in the language it was spoken in.
  language: "auto"
